name: Update ladder data

on:
  schedule:
    # every three hours, all week
    - cron: "0 */3 * * *"
    # every 30 minutes through the Melbourne afternoon and evening on Sunday and
    # Monday, when results are actually entered (01:00-12:59 UTC = 12:00-23:59 AEDT)
    - cron: "*/30 1-12 * * 0,1"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape TROLS
        run: python scrape.py

      - name: Events near 3163
        run: python events.py || echo "events fetch failed — keeping the last file"

      - name: Commit the new snapshot
        run: |
          git config user.name  "ladder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json events.json 2>/dev/null || git add data.json
          if git diff --staged --quiet; then
            echo "No change today"
          else
            git commit -m "data: refresh from TROLS $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main || {
              git rebase --abort || true
              git pull --no-rebase -X ours origin main
            }
            git push
          fi

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
