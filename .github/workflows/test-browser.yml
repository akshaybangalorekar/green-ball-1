name: Test browser harvest
on:
  push:
    paths: ["tests/harvest_check.py", "events.py", "index.html", "test_div.py"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python test_div.py
      - run: node tests/tag_rules.js index.html
      - run: node tests/presentation.js index.html
