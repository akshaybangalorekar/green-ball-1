name: Harvest events
on:
  schedule:
    - cron: "0 20,0,4,8 * * *"   # 7am, 11am, 3pm, 7pm Melbourne
  push:
    paths: ["events.py"]
permissions:
  contents: write
concurrency:
  group: harvest
  cancel-in-progress: false
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python events.py
      - run: |
          git config user.name  "ladder-bot"
          git config user.email "bot@users.noreply.github.com"
          git add events.json
          git commit -m "harvest: tournament events" || echo "no change"
          git pull --rebase --autostash origin main
          git push
