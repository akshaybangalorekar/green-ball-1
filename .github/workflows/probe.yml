name: probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run probe
        run: python3 probe.py
      - name: Save result
        run: |
          git config user.name "Akshay Bangalorekar"
          git config user.email "akshay.bangalorekar@gmail.com"
          git add probe.json
          git commit -m "probe result" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push
