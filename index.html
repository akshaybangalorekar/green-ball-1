<style>
  :root {

    --line: rgba(27,26,23,.10); --line-soft: rgba(27,26,23,.06);

      --clay: #e2794f; --clay-wash: rgba(226,121,79,.13);
      --gold: #d4a94f; --gold-wash: rgba(212,169,79,.14);
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 18px 40px -24px rgba(0,0,0,.9);

  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {

    background:
      radial-gradient(900px 460px at 84% -14%, var(--court-wash), transparent 72%),

      var(--bg);
    color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased; padding-bottom: 56px;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }

  /* ---------- masthead ---------- */
  .masthead { display: flex; align-items: center; gap: 14px; padding: 30px 0 22px; }
  .crest { width: 50px; height: 50px; flex: 0 0 50px; border-radius: 14px; background: var(--court); color: #f7f4ee;
    display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 17px; }
  @media (prefers-color-scheme: dark) { .crest { color: #101309; } }
  .masthead h1 { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.05; margin: 0; letter-spacing: -.02em; }
  .masthead .sub { margin: 4px 0 0; font-size: 12.5px; color: var(--ink-dim); font-family: var(--mono); }
  .sync { margin-left: auto; text-align: right; font-family: var(--mono); font-size: 10px; line-height: 1.5; color: var(--ink-dim); }
  .sync b { display: block; color: var(--court); font-weight: 500; }

  /* ---------- tabs ---------- */
  .tabs { position: sticky; top: 0; z-index: 20; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
    margin: 0 -20px 26px; padding: 10px 20px; background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line-soft); }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { appearance: none; border: 0; background: transparent; cursor: pointer; font-family: var(--mono);
    font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-dim); padding: 9px 13px;
    border-radius: 9px; white-space: nowrap; transition: color .15s, background .15s; }
  .tabs button[aria-selected="true"] { color: var(--court); background: var(--court-wash); font-weight: 500; }

  .view { display: none; animation: rise .3s ease both; }
  .view.on { display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .view { animation: none; } }

  /* ---------- cards: one idea each ---------- */
  .card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 22px; padding: 26px 22px;
    box-shadow: var(--shadow); margin-bottom: 20px; }
  .label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-dim); margin: 0 0 18px; display: flex; align-items: center; gap: 8px; }
  .label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--court); flex: 0 0 6px; }
  .caption { font-size: 13px; color: var(--ink-dim); line-height: 1.6; margin: 16px 0 0; }
  .caption b { color: var(--ink); font-weight: 600; }

  /* ---------- hero ---------- */
  .hero { position: relative; overflow: hidden; background: linear-gradient(165deg, var(--court-wash), transparent 58%), var(--surface);
    border: 1px solid var(--line-soft); border-radius: 26px; padding: 28px 24px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .hero .courtlines { position: absolute; inset: 0; opacity: .5; pointer-events: none; }
  .hero .rd { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;

  .pill { background: var(--court); color: #f7f4ee; border-radius: 999px; padding: 3px 11px; font-size: 10px; letter-spacing: .09em; }
  .pill.clay { background: var(--clay); }
  @media (prefers-color-scheme: dark) { .pill { color: #101309; } }
  .hero h2 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 8.4vw, 42px); line-height: 1.02;
    letter-spacing: -.03em; margin: 18px 0 0; }
  .hero h2 small { display: block; font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-dim); margin-bottom: 9px; }
  .hero .venue { font-size: 14px; color: var(--ink-dim); margin-top: 12px; }

  /* trio avatars */
  .trio { display: flex; gap: 14px; margin-top: 24px; }
  .trio .who { text-align: center; flex: 1; }
  .trio .av { width: 52px; height: 52px; margin: 0 auto 9px; border-radius: 50%; background: var(--court); color: #f7f4ee;
    display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 17px; }
  @media (prefers-color-scheme: dark) { .trio .av { color: #101309; } }
  .trio .who.em .av { background: var(--gold); }
  .trio .nm { font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; color: var(--ink-dim); }
  .trio .who.em .nm { color: var(--gold); }

  /* ---------- KPI ---------- */
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .kpi { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 18px; padding: 20px 14px; text-align: center; box-shadow: var(--shadow); }
  .kpi .n { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .kpi .n small { font-size: 13px; font-weight: 600; color: var(--ink-dim); letter-spacing: 0; }
  .kpi .k { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); margin-top: 9px; }

  /* ---------- charts ---------- */
  .chart { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-family: var(--mono); font-size: 10px; fill: var(--ink-dim); }
  .chart .big { font-family: var(--display); font-size: 26px; font-weight: 800; fill: var(--ink); }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 16px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-dim); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  /* ---------- ladder bars ---------- */
  .bar-row { margin-bottom: 16px; }
  .bar-row .top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 7px; }
  .bar-row .tname { font-size: 14px; font-weight: 500; }
  .bar-row.us .tname { color: var(--court); font-weight: 700; }
  .bar-row .tp { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--ink-dim); }
  .bar-track { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; background: var(--court); opacity: .85; }
  .bar-row.us .bar-fill { opacity: 1; }
  .bar-row.other .bar-fill { background: var(--ink-dim); opacity: .35; }

  /* ---------- segmented ---------- */
  .seg-top { display: flex; gap: 6px; background: var(--surface-2); border-radius: 14px; padding: 5px; margin-bottom: 20px; }
  .seg-top button { flex: 1; appearance: none; border: 0; background: transparent; cursor: pointer; font-family: var(--mono);
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-dim); padding: 10px 6px; border-radius: 10px; }
  .seg-top button[aria-selected="true"] { background: var(--surface); color: var(--court); font-weight: 500; box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  /* ---------- results ---------- */
  .rnd { padding: 18px 0; border-top: 1px solid var(--line-soft); }
  .rnd:first-child { border-top: 0; padding-top: 0; }
  .rnd-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
  .rnd-h b { color: var(--ink); font-weight: 500; }
  .mt { display: flex; align-items: center; gap: 10px; padding: 9px 0; font-size: 13.5px; }
  .mt .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mt .nm.r { text-align: right; }
  .mt .sc { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); background: var(--surface-2);
    border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
  .mt.ours .nm { color: var(--court); font-weight: 700; }

  /* ---------- draw ---------- */
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li { display: grid; grid-template-columns: 46px 1fr auto; gap: 14px; align-items: center; padding: 15px 0;

  .tl li:first-child { border-top: 0; }
  .tl .rn { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); text-align: center; background: var(--surface-2);

  .tl .who { font-size: 14px; }
  .tl .who small { display: block; color: var(--ink-dim); font-size: 11.5px; font-family: var(--mono); margin-top: 4px; }

  .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: center; }

  .pstats .row:first-child { border-top: 0; }
  .pstats .k { font-family: var(--mono); font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-dim); }
  .pstats .v { font-family: var(--display); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
  .pnext { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line-soft); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pnext .txt { font-size: 13px; color: var(--ink-dim); }

  .seg button { appearance: none; border: 1px solid var(--line); background: transparent; cursor: pointer; font-family: var(--mono);

  .matrix .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
  .dot.in { background: var(--court); } .dot.out { background: var(--clay); } .dot.un { background: var(--gold); }
  .dot.none { background: var(--surface-2); border: 1px solid var(--line); }

  /* ---------- clubs ---------- */
  .club { padding: 20px 0; border-top: 1px solid var(--line-soft); }
  .club:first-child { border-top: 0; padding-top: 0; }
  .club .cn { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 9px; }
  .club .cn .tag { font-family: var(--mono); font-size: 9px; letter-spacing: .08em; text-transform: uppercase;

  @media (prefers-color-scheme: dark) { .club .cn .tag { color: #101309; } }
  .club .vd { font-size: 13px; color: var(--ink-dim); margin-top: 6px; }
  .club .ct { font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); margin-top: 8px; }
  .club .ct a { color: var(--court); text-decoration: none; }

  footer { margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--line-soft); font-family: var(--mono);
    font-size: 10.5px; line-height: 1.9; color: var(--ink-dim); }
  footer a { color: var(--court); text-decoration: none; }
  .tblwrap { overflow-x: auto; margin: 0 -6px; }

  /* ---------- season strip ---------- */
  .strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .blk { aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; font-family: var(--mono);
    font-size: 11px; background: var(--surface-2); color: var(--ink-dim); }
  .blk.w { background: var(--court); color: #f7f4ee; font-weight: 500; }
  .blk.l { background: var(--clay); color: #f7f4ee; font-weight: 500; }
  .blk.wo { background: var(--gold-wash); color: var(--gold); }
  .blk.today { outline: 2px solid var(--court); outline-offset: -2px; color: var(--court); font-weight: 500; }
  @media (prefers-color-scheme: dark) { .blk.w, .blk.l { color: #101309; } }
</style>

ll},{"round":9,"date":"2026-12-13","opponent":"MCC Glen Iris","homeAway":"A","result":null},{"round":10,"date":"2027-01-31","opponent":"Rosswood","homeAway":"A","result":null},{"round":11,"date":"2027-02-07","opponent":"Dingley","homeAway":"H","result":null},{"round":12,"date":"2027-02-14","opponent":"Mayfield Park","homeAway":"A","result":null},{"round":13,"date":"2027-02-21","opponent":"Fountain Gate","homeAway":"A","result":null},{"round":14,"date":"2027-02-28","opponent":"Glen Waverley","homeAway":"H","result":null}],"finals":[{"label":"No play","date":"2026-11-01"},{"label":"No play","date":"2027-03-07"},{"label":"Semi finals","date":"2027-03-14"},{"label":"Grand final","date":"2027-03-21"}],"clubs":[{"name":"Glen Waverley","melway":"71 A5","venue":"3 Aquatic Place Rear of Monash Aquatic Centre, Glen Waverley","contact":"Brad Hasler","phone":"0417 327 880"},{"name":"Mountain Gate","melway":"64 J11","venue":"Reta Matthews Reserve Cnr Burke Rd & Agora Blvd, Ferntree Gully","contact":"Frank Ruberto","phone":"0418 711 325"},{"name":"East Malvern","melway":"59 K10","venue":"15 Moira St Opp Dorothy Laver Reserve, Glen Iris Club House Ph:0477 858 854","contact":"Jake Zerman","phone":"0431 820 447"},{"name":"Fountain Gate","melway":"110 B4","venue":"Cnr Raven Cres & Princes Highway, Narre Warren","contact":"Dejan Stojic","phone":"0401 137 236"},{"name":"Rosswood","melway":"81 E8","venue":"112A Somerset Drive opposite Francesco Drive, Dandenong North Club House Ph:0401 177 886","contact":"Marcel Pietrasik","phone":"0401 177 886"},{"name":"Dingley","melway":"88 H4","venue":"Rowan Road South Off Westall Rd Ext. behind netball, Dingley Village Club House Ph:0411 330 289","contact":"Leon Yang","phone":"0400 366 188"},{"name":"Mayfield Park","melway":"70 B4","venue":"34 - 38 Mayfield Drive, Mount Waverley","contact":"Brad Hasler","phone":"0417 327 880"},{"name":"MCC Glen Iris","melway":"61 C11","venue":"260-270 High Street Road Opposite Surrey Road, Mount Waverley Club House const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CLUB = DATA.meta.club;
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

const parseDate = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d, 12, 0, 0); };
const fmtDate = (iso) => { const d = parseDate(iso); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const fmtLong = (iso) => { const d = parseDate(iso); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const todayISO = () => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}-${String(n.getDate()).padStart(2, "0")}`; };
const pct = (n) => n.toFixed(2).replace(/\.00$/, ".0");
const first = (n) => String(n).split(" ")[0];
const initials = (n) => String(n).split(" ").map((w) => w[0]).join("").slice(0, 2).toUpperCase();

const us = DATA.ladder.find((t) => t.isUs);
const roster = DATA.roster || { players: [], rounds: [], team_order: [] };

function resultsFor(team) {
  const out = [];
  DATA.results.forEach((r) => r.matches.forEach((m) => {
    if (m.home !== team && m.away !== team) return;
    const home = m.home === team;
    let res;
    if (m.washout) res = "wo";
    else {
      const mine = home ? m.homePts : m.awayPts, theirs = home ? m.awayPts : m.homePts;
      res = mine > theirs ? "w" : mine < theirs ? "l" : "d";
    }
    out.push({ round: r.round, date: r.date, res, home, opp: home ? m.away : m.home, m });
  }));
  return out.sort((a, b) => b.round - a.round);
}
const ourResults = resultsFor(CLUB);
const resultForRound = (n) => ourResults.find((r) => r.round === n) || null;
const ourPoints = (r) => (r.m.washout ? 4 : (r.m.home === CLUB ? r.m.homePts : r.m.awayPts));

function nextRound() {
  const t = todayISO();
  const upcoming = DATA.draw.filter((d) => d.date >= t);
  return upcoming.length ? upcoming[0] : DATA.draw[DATA.draw.length - 1];
}
const clubByName = (name) => DATA.clubs.find((c) => c.name === name) || null;

/* ---------- roster ---------- */
const rosterRound = (n) => roster.rounds.find((r) => r.round === n) || null;
function planFor(firstName, n) {
  const r = rosterRound(n);
  if (!r) return "none";
  if ((r.in || []).includes(firstName)) return "in";
  if ((r.unavailable || []).includes(firstName)) return "un";
  if ((r.out || []).includes(firstName)) return "out";
  return "none";
}
function playerStats(p) {
  const f = first(p.name);
  const inR = [], outR = [], unR = [];
  roster.rounds.forEach((r) => {
    if ((r.in || []).includes(f)) inR.push(r.round);
    else if ((r.unavailable || []).includes(f)) unR.push(r.round);
    else if ((r.out || []).includes(f)) outR.push(r.round);
  });
  const completed = inR.filter((n) => { const x = resultForRound(n); return x && x.res !== "wo"; });
  const wins = completed.filter((n) => resultForRound(n).res === "w").length;
  const washouts = inR.filter((n) => { const x = resultForRound(n); return x && x.res === "wo"; }).length;
  const partners = {};
  roster.rounds.forEach((r) => { if ((r.in || []).includes(f)) (r.in || []).forEach((o) => { if (o !== f) partners[o] = (partners[o] || 0) + 1; }); });
  const top = Object.entries(partners).sort((a, b) => b[1] - a[1]).slice(0, 1);
  const total = roster.rounds.length || 1;
  return { ...p, inCount: inR.length, outCount: outR.length, unCount: unR.length, scheduled: total,
    completed: completed.length, wins, washouts, inPct: (inR.length / total) * 100, partner: top.length ? top[0][0] : null };
}
const squad = (roster.players || []).map(playerStats).sort((a, b) => a.rank - b.rank);

/* ---------- graphics ---------- */
function ring(value, max, label, sub) {
  const r = 52, c = 2 * Math.PI * r, dash = Math.min(1, value / max) * c;
  return `<svg class="chart" viewBox="0 0 140 140" role="img" aria-label="${esc(label)} ${value}">
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="13"/>
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--court)" stroke-width="13" stroke-linecap="round"
      stroke-dasharray="${dash} ${c}" transform="rotate(-90 70 70)"/>
    <text x="70" y="70" text-anchor="middle" class="big" dominant-baseline="middle">${esc(label)}</text>
    <text x="70" y="92" text-anchor="middle">${esc(sub)}</text>
  </svg>`;
}

function pointsChart() {
  const rounds = ourResults.slice().sort((a, b) => a.round - b.round);
  if (!rounds.length) return "";
  const W = 320, H = 168, pad = 8, top = 26, base = H - 26;
  const bw = (W - pad * 2) / rounds.length;
  let cum = 0;
  const bars = rounds.map((r, i) => {
    const pts = ourPoints(r); cum += pts;
    const h = (pts / 8) * (base - top - 18);
    const x = pad + i * bw + bw * 0.2, w = bw * 0.6;
    return `<rect x="${x}" y="${base - h}" width="${w}" height="${h}" rx="4" fill="var(--court)" opacity="${r.res === "wo" ? .35 : .9}"/>
      <text x="${x + w / 2}" y="${base - h - 9}" text-anchor="middle" style="fill:var(--ink)">${pts.toFixed(0)}</text>
      <text x="${x + w / 2}" y="${base + 17}" text-anchor="middle">R${r.round}</text>
      <text x="${x + w / 2}" y="${H - 2}" text-anchor="middle" style="fill:var(--court)">${cum.toFixed(0)}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><line x1="${pad}" y1="${base}" x2="${W - pad}" y2="${base}" stroke="var(--line)"/>${bars}</svg>`;
}

function gamesChart() {
  const rounds = ourResults.slice().sort((a, b) => a.round - b.round).filter((r) => r.res !== "wo");
  if (!rounds.length) return "";
  const W = 320, H = 150, pad = 8, top = 20, base = H - 24;
  const maxG = Math.max(...rounds.map((r) => Math.max(r.m.homeGames, r.m.awayGames)), 36);
  const bw = (W - pad * 2) / rounds.length;
  const bars = rounds.map((r, i) => {
    const mine = r.m.home === CLUB ? r.m.homeGames : r.m.awayGames;
    const theirs = r.m.home === CLUB ? r.m.awayGames : r.m.homeGames;
    const hM = (mine / maxG) * (base - top), hT = (theirs / maxG) * (base - top);
    const x = pad + i * bw + bw * 0.14, w = bw * 0.34;
    return `<rect x="${x}" y="${base - hM}" width="${w}" height="${hM}" rx="4" fill="var(--court)"/>
      <rect x="${x + w + 4}" y="${base - hT}" width="${w}" height="${hT}" rx="4" fill="var(--clay)" opacity=".6"/>
      <text x="${x + w}" y="${base + 16}" text-anchor="middle">R${r.round}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><line x1="${pad}" y1="${base}" x2="${W - pad}" y2="${base}" stroke="var(--line)"/>${bars}</svg>`;
}

function seasonStrip() {
  const t = todayISO();
  return DATA.draw.map((d) => {
    const r = resultForRound(d.round);
    let cls = "up", txt = String(d.round);
    if (r) { cls = r.res === "wo" ? "wo" : r.res; txt = r.res === "wo" ? "–" : r.res.toUpperCase(); }
    else if (d.date === t) { cls = "today"; }
    return `<div class="blk ${cls}">${txt}</div>`;
  }).join("");
}

function ladderBars() {
  const max = Math.max(...DATA.ladder.map((t) => t.pts));
  return DATA.ladder.map((t) => `
    <div class="bar-row ${t.isUs ? "us" : "other"}">
      <div class="top"><span class="tname">${esc(t.team)}</span><span class="tp">${t.pts.toFixed(1)} pts · ${pct(t.pct)}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(4, (t.pts / max) * 100)}%"></div></div>
    </div>`).join("");
}

/* ---------- views ---------- */
function insightLine() {
  const sorted = DATA.ladder.slice().sort((a, b) => a.pos - b.pos);
  const top = sorted[0], fourth = sorted[3];
  const level = sorted.find((t) => t.pos !== us.pos && t.pts === us.pts);
  let s = `<b>${us.pos}${ordinal(us.pos)}</b> on ${us.pts.toFixed(1)} points, ${(top.pts - us.pts).toFixed(1)} behind ${esc(top.team)}.`;
  if (level) s += ` Level with ${esc(level.team)} — they sit ${level.pos < us.pos ? "above" : "below"} you only on percentage (${pct(level.pct)}% v ${pct(us.pct)}%).`;
  s += ` Top four play finals; 4th is ${(us.pts - fourth.pts).toFixed(1)} points back.`;
  return s;
}
function ordinal(n) { const s = ["th", "st", "nd", "rd"], v = n % 100; return s[(v - 20) % 10] || s[v] || s[0]; }

function viewWeek() {
  const nr = nextRound();
  const isToday = nr.date === todayISO();
  const opp = nr.opponent ? clubByName(nr.opponent) : null;
  const venue = nr.opponent

  const trioHTML = trio.length ? `<div class="trio">${trio.map((n) => {
    const em = rr.emergency && rr.emergency.includes(n);
    return `<div class="who ${em ? "em" : ""}"><div class="av">${esc(initials(n))}</div><div class="nm">${esc(first(n))}${em ? " · E" : ""}</div></div>`;
  }).join("")}</div>` : "";

  return `
    <div class="hero">
      <svg class="courtlines" viewBox="0 0 400 260" preserveAspectRatio="none" aria-hidden="true">
        <g stroke="var(--court)" stroke-width="1" fill="none" opacity=".13">
          <rect x="30" y="26" width="340" height="208" rx="4"/>
          <line x1="30" y1="130" x2="370" y2="130"/>
          <line x1="120" y1="26" x2="120" y2="234"/>
          <line x1="280" y1="26" x2="280" y2="234"/>
          <line x1="120" y1="86" x2="280" y2="86"/>
          <line x1="120" y1="174" x2="280" y2="174"/>
        </g>
      </svg>
      <div class="rd">
        <span class="pill">Round ${nr.round}</span>
        <span>${fmtLong(nr.date)}</span>
        ${isToday ? `<span class="pill clay">Today</span>` : ""}
      </div>
      <h2><small>${nr.opponent ? (nr.homeAway === "H" ? "Home vs" : "Away vs") : "Opponent"}</small>
        ${nr.opponent ? esc(nr.opponent) : "To be confirmed"}</h2>
      <div class="venue">${esc(venue)}</div>
      ${trioHTML}
    </div>

    <div class="kpis">
      <div class="kpi"><div class="n">${us.pos}<small>/${DATA.ladder.length}</small></div><div class="k">Ladder</div></div>
      <div class="kpi"><div class="n">${us.pts.toFixed(1)}</div><div class="k">Points</div></div>
      <div class="kpi"><div class="n">${Math.round(us.pct)}<small>%</small></div><div class="k">Games</div></div>
    </div>

    <div class="card">
      <p class="label">Where you stand</p>
      <p class="caption" style="margin:0">${insightLine()}</p>
    </div>

    <div class="card">
      <p class="label">Season so far</p>
      <div class="strip">${seasonStrip()}</div>
      <div class="legend"><span><i style="background:var(--court)"></i>win</span><span><i style="background:var(--clay)"></i>loss</span><span><i style="background:var(--gold-wash)"></i>wash-out</span><span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>to come</span></div>
    </div>`;
}

function viewTeam() {
  const sorted = DATA.ladder.slice().sort((a, b) => a.pos - b.pos);
  const level = sorted.find((t) => t.pos !== us.pos && t.pts === us.pts);
  const gf = us.games_for, ga = us.games_against;
  const win36 = ((gf + 36) / (ga + 10)) * 100;
  const win30 = ((gf + 30) / (ga + 18)) * 100;

  const combos = {};
  roster.rounds.forEach((r) => {
    if ((r.in || []).length !== 3) return;
    const key = r.in.slice().sort().join(" · ");
    const res = resultForRound(r.round);
    const c = combos[key] || (combos[key] = { played: 0, wins: 0, rounds: [] });
    c.rounds.push(r.round);
    if (res && res.res !== "wo") { c.played++; if (res.res === "w") c.wins++; }
  });
  const comboRows = Object.entries(combos)
    .sort((a, b) => b[1].rounds.length - a[1].rounds.length)
    .map(([k, v]) => {
      const rec = v.played ? `${v.wins}W–${v.played - v.wins}L` : "—";
      return `<div class="bar-row"><div class="top"><span class="tname">${esc(k)}</span>
        <span class="tp">${v.rounds.length} rd${v.rounds.length === 1 ? "" : "s"} · ${rec}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${(v.rounds.length / 14) * 100}%"></div></div></div>`;
    }).join("");

  return `
    <div class="card">
      <p class="label">Percentage</p>
      <div style="display:flex;justify-content:center;padding:8px 0 4px">
        ${ring(us.pct, 500, Math.round(us.pct) + "%", "games won")}
      </div>
      <p class="caption">${us.games_for} games won, ${us.games_against} conceded.</p>
    </div>

    <div class="card">
      <p class="label">The race for the four</p>
      <div style="margin-top:4px">${ladderBars()}</div>
      <p class="caption">Points decide the ladder. Percentage only breaks a tie — which is exactly where you sit.</p>
    </div>

    <div class="card">
      <p class="label">Points by round</p>
      ${pointsChart()}
      <div class="legend"><span><i style="background:var(--court)"></i>earned</span><span><i style="background:var(--court);opacity:.35"></i>wash-out (4)</span><span><i style="background:var(--court)"></i>running total</span></div>
      <p class="caption">A wash-out still banks four points — that is why round 3 is not a blank.</p>
    </div>

    <div class="card">
      <p class="label">Games for and against</p>
      ${gamesChart()}
      <div class="legend"><span><i style="background:var(--court)"></i>East Malvern</span><span><i style="background:var(--clay)"></i>opponent</span></div>
      <p class="caption">Every game counts towards percentage, even after the match is decided.</p>
    </div>

    <div class="card">
      <p class="label">What a win does</p>
      <p class="caption" style="margin:0">
        6–0 next round → <b>${pct(win36)}%</b> &nbsp;·&nbsp; 5–1 → <b>${pct(win30)}%</b>
        ${level ? `<br>${esc(level.team)} sit on ${pct(level.pct)}%, so a clean win clears them on both counts.` : ""}
      </p>
    </div>

    <div class="card">
      <p class="label">Which three</p>
      ${comboRows}
      <p class="caption">Triples needs three on court — these are the combinations Dave has named so far.</p>
    </div>`;
}

function viewSquad() {
  const cards = squad.map((s) => {
    const isCaptain = roster.captain && first(roster.captain) === first(s.parent || "");
    const nr = nextRound();
    const planned = planFor(first(s.name), nr.round);
    const override = overrideFor(first(s.name), nr.round);
    const shown = override || planned;
    const label = { in: "In", out: "Out", un: "Unavailable", none: "—", maybe: "Maybe" }[shown] || "—";

    return `<div class="pcard">
      <div class="top">
        <span class="rank">${s.rank}</span>
        <div>
          <div class="nm">${esc(s.name)}${isCaptain ? `<span class="capt">captain</span>` : ""}</div>
          <div class="role">${esc(s.parent || "")}</div>
        </div>
      </div>

      <div class="pgrid">
        <div style="text-align:center">${ring(s.inCount, s.scheduled, s.inCount + "/" + s.scheduled, "rounds in")}</div>
        <div class="pstats">
          <div class="row"><span class="k">Team record</span><span class="v">${s.wins}–${Math.max(0, s.completed - s.wins)}</span></div>
          <div class="row"><span class="k">Unavailable</span><span class="v">${s.unCount}</span></div>
          <div class="row"><span class="k">Usual partner</span><span class="v" style="font-size:14px">${esc(s.partner ? first(s.partner) : "—")}</span></div>
        </div>
      </div>

      <div class="pnext">
        <span class="txt">R${nr.round} · ${fmtDate(nr.date)}: <b>${label}</b>${override && override !== planned ? " (changed)" : ""}</span>
        <span class="seg">
          <button data-p="${esc(first(s.name))}" data-s="in" data-on="${shown === "in" ? "in" : ""}">In</button>
          <button data-p="${esc(first(s.name))}" data-s="maybe" data-on="${shown === "maybe" ? "maybe" : ""}">?</button>
          <button data-p="${esc(first(s.name))}" data-s="out" data-on="${shown === "out" || shown === "un" ? "out" : ""}">Out</button>
        </span>
      </div>
    </div>`;
  }).join("");

  const rounds = roster.rounds;
  const head = rounds.map((r) => `<th>${r.round}</th>`).join("");
  const body = (roster.players || []).map((p) => {
    const cells = rounds.map((r) => {
      const st = planFor(first(p.name), r.round);
      return `<td><span class="dot ${st === "in" ? "in" : st === "out" ? "out" : st === "un" ? "un" : "none"}"></span></td>`;
    }).join("");
    return `<tr><td>${esc(first(p.name))}</td>${cells}</tr>`;
  }).join("");

  return `
    <div class="card">
      <p class="label">Season availability</p>
      <div class="tblwrap"><table class="matrix"><thead><tr><th></th>${head}</tr></thead><tbody>${body}</tbody></table></div>
      <div class="legend"><span><i class="dot in" style="border-radius:50%"></i>in</span><span><i class="dot out" style="border-radius:50%"></i>out</span><span><i class="dot un" style="border-radius:50%"></i>unavailable</span></div>
      <p class="caption">From Dave's roster sheet. Tap In / ? / Out on a card to change the next round — saved on this phone only.</p>
    </div>
    ${cards}`;
}

function viewSeason() {
  const seg = seasonTab;
  const body = seg === "ladder" ? ladderView() : seg === "results" ? resultsView() : drawView();
  return `<div class="seg-top" role="tablist">
      <button data-season="ladder" aria-selected="${seg === "ladder"}">Ladder</button>
      <button data-season="results" aria-selected="${seg === "results"}">Results</button>
      <button data-season="draw" aria-selected="${seg === "draw"}">Draw</button>
    </div>${body}`;
}

function ladderView() {
  const rows = DATA.ladder.map((t) => `
    <tr class="${t.isUs ? "us" : ""}" style="${t.isUs ? "background:var(--court-wash)" : ""}">
      <td style="text-align:left">${t.pos}</td>
      <td style="text-align:left">${esc(t.team)}</td>
      <td>${t.played}</td><td>${t.pts.toFixed(1)}</td><td>${pct(t.pct)}</td>
    </tr>`).join("");
  return `<div class="card">
    <p class="label">After round 3</p>
    <div class="tblwrap"><table style="font-size:14px">
      <thead><tr><th style="text-align:left">#</th><th style="text-align:left">Team</th><th>P</th><th>Pts</th><th>%</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="caption">Top four play finals. Wash-outs pay 4 points each.</p>
  </div>`;
}

function resultsView() {
  const blocks = DATA.results.map((r) => {
    const rows = r.matches.map((m) => {
      const ours = m.home === CLUB || m.away === CLUB;
      if (m.washout) return `<div class="mt ${ours ? "ours" : ""}"><span class="nm">${esc(m.home)}</span><span class="sc">wash out</span><span class="nm r">${esc(m.away)}</span></div>`;
      const hWin = m.homePts > m.awayPts;
      return `<div class="mt ${ours ? "ours" : ""}">
        <span class="nm" style="${hWin ? "font-weight:700" : ""}">${esc(m.home)}</span>
        <span class="sc">${m.homePts.toFixed(0)}–${m.awayPts.toFixed(0)} · ${m.homeGames}–${m.awayGames}</span>
        <span class="nm r" style="${!hWin ? "font-weight:700" : ""}">${esc(m.away)}</span></div>`;
    }).join("");
    return `<div class="rnd"><div class="rnd-h"><b>Round ${r.round}</b><span>${fmtLong(r.date)}</span></div>${rows}</div>`;
  }).join("");
  return `<div class="card"><p class="label">Round by round</p>${blocks}
    <p class="caption">Score reads points then games.</p></div>`;
}

function drawView() {
  const t = todayISO();
  const items = DATA.draw.map((d) => {
    const past = d.date < t, isToday = d.date === t;
    const rr = rosterRound(d.round);
    const trio = rr ? (rr.in || []).map(first).join(", ") : "";
    const who = d.opponent ? `${d.homeAway === "H" ? "vs" : "at"} ${esc(d.opponent)}` : "Opponent TBC";
    return `<li class="${past ? "past" : ""} ${isToday ? "today" : ""}">
      <span class="rn">${d.round}</span>
      <span class="who">${who}<small>${fmtDate(d.date)}${d.homeAway ? " · " + (d.homeAway === "H" ? "home" : "away") : ""}${trio ? " · " + esc(trio) : ""}</small></span>
      <span class="res">${d.result ? esc(d.result) : ""}</span></li>`;
  }).join("");
  const finals = DATA.finals.map((f) => `<li><span class="rn">—</span><span class="who">${esc(f.label)}<small>${fmtDate(f.date)}</small></span><span class="res"></span></li>`).join("");
  return `<div class="card"><p class="label">Season draw</p><ul class="tl">${items}${finals}</ul></div>`;
}

function viewClubs() {
  const order = [CLUB].concat(DATA.clubs.filter((c) => c.name !== CLUB).map((c) => c.name));
  const cards = order.map((name) => {
    const c = clubByName(name);
    if (!c) return "";
    return `<div class="club">
      <div class="cn">${esc(c.name)}${c.isUs ? `<span class="tag">us</span>` : ""}</div>
      <div class="vd">${esc(c.venue)} · Melway ${esc(c.melway)}</div>
      <div class="ct">${esc(c.contact)} · <a href="tel:${esc(c.phone.replace(/\s/g, ""))}">${esc(c.phone)}</a></div>
    </div>`;
  }).join("");
  return `<div class="card"><p class="label">The section</p>${cards}</div>`;
}

/* ---------- state ---------- */
let seasonTab = "ladder";
const STORE = "em-gb1-avail-v2";
const loadOverrides = () => { try { return JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (e) { return {}; } };
const saveOverrides = (o) => { try { localStorage.setItem(STORE, JSON.stringify(o)); } catch (e) {} };
let overrides = loadOverrides();
const overrideFor = (f, round) => (overrides[round] || {})[f] || null;

function bind() {
  $("#view-squad").querySelectorAll(".seg button").forEach((b) => {
    b.onclick = () => {
      const r = nextRound().round;
      overrides[r] = overrides[r] || {};
      overrides[r][b.dataset.p] = b.dataset.s;
      saveOverrides(overrides);
      renderAll();
    };
  });
  $("#view-season").querySelectorAll(".seg-top button").forEach((b) => {
    b.onclick = () => { seasonTab = b.dataset.season; $("#view-season").innerHTML = viewSeason(); bind(); };
  });
}

function renderAll() {
  $("#mastheadSub").textContent = `${DATA.meta.club} · ${DATA.meta.competition}`;
  $("#syncWhen").textContent = DATA.meta.ladder_loaded.replace(/, .*/, "");
  $("#view-week").innerHTML = viewWeek();
  $("#view-team").innerHTML = viewTeam();
  $("#view-squad").innerHTML = viewSquad();
  $("#view-season").innerHTML = viewSeason();
  $("#view-clubs").innerHTML = viewClubs();
  bind();
  $("#foot").innerHTML = `
    ${esc(DATA.meta.section)} · ${esc(DATA.meta.competition)} ${esc(DATA.meta.season)} · Waverley District Tennis Association<br>
    Ladder, results and fixture from <a href="${esc(DATA.meta.source_ladder)}" target="_blank" rel="noopener">TROLS</a>.
    Roster from the captain's sheet. Snapshot ${esc(DATA.meta.ladder_loaded)}.<br>
    Unofficial team tool — check TROLS or your club before a match.`;
}

function showTab(name) {
  const btn = document.querySelector('.tabs button[data-view="' + name + '"]');
  if (!btn) return;
  document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", "false"));
  btn.setAttribute("aria-selected", "true");
  document.querySelectorAll(".view").forEach((v) => v.classList.remove("on"));
  const view = $("#view-" + name);
  if (view) view.classList.add("on");
}
document.querySelectorAll(".tabs button").forEach((b) => {
  b.onclick = () => {
    showTab(b.dataset.view);
    if (history.replaceState) history.replaceState(null, "", "#" + b.dataset.view);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
});

renderAll();
if (location.hash) showTab(location.hash.slice(1));

fetch("data.json?t=" + Date.now(), { cache: "no-store" })
  .then((r) => (r.ok ? r.json() : null))
  .then((fresh) => {
    if (!fresh || !fresh.meta || fresh.meta.ladder_loaded === DATA.meta.ladder_loaded) return;
    Object.assign(DATA, fresh);
    if (fresh.roster) Object.assign(roster, fresh.roster);
    $("#syncState").textContent = "updated";
    renderAll();
  })
  .catch(() => {});
</script>
</body>
</html>
