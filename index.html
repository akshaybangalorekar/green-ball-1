<!DOCTYPE html>
<html lang="en-AU">
<head>

<title>Advantage · East Malvern Green Ball 1</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    /* Centre Court: grass green, white, optic yellow */
    --bg: #21a065;
    --bg-2: #3ec784;
    --surface: #ffffff;
    --surface-2: #eef7f1;
    --ink: #0a2b1b;
    --ink-dim: #44685a;
    --line: rgba(13, 42, 28, .16);
    --line-soft: rgba(13, 42, 28, .08);
    --brand: #10744b;
    --brand-deep: #0d5735;
    --brand-wash: rgba(16, 116, 75, .11);
    --ball: #e3ee5c;
    --ball-ink: #1c2608;
    --ball-wash: rgba(227, 238, 92, .45);
    --muted: #93a99b;
    --on-brand: #ffffff;
    --on-brand-dim: rgba(255, 255, 255, .84);
    --loss: #bd4a2d;
    --shadow: 0 2px 4px rgba(8, 40, 24, .14), 0 18px 40px -26px rgba(8, 40, 24, .6);
    --display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
    --body: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a3524;
      --bg-2: #115234;
      --surface: #14211a;
      --surface-2: #1d2e24;
      --ink: #eef5ef;
      --ink-dim: #9fb3a6;
      --line: rgba(238, 245, 239, .16);
      --line-soft: rgba(238, 245, 239, .08);
      --brand: #2f9c62;
      --brand-deep: #0a3a24;
      --brand-wash: rgba(47, 156, 98, .18);
      --ball: #d7e64a;
      --ball-ink: #1a2410;
      --ball-wash: rgba(215, 230, 74, .18);
      --muted: #7f9488;
      --on-brand: #eef5ef;
      --on-brand-dim: rgba(238, 245, 239, .76);
      --loss: #d4633f;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 18px 42px -26px rgba(0, 0, 0, .95);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; font-family: var(--body); font-size: 17px; text-wrap: pretty;
    background:
      radial-gradient(820px 460px at 86% -16%, rgba(227, 238, 92, .22), transparent 68%),
      radial-gradient(680px 420px at -10% 4%, rgba(255, 255, 255, .10), transparent 62%),
      linear-gradient(176deg, var(--bg-2) 0%, var(--bg) 52%, var(--brand-deep) 100%);
    color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: 56px;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }

  .masthead { display: flex; align-items: center; gap: 12px; padding: 26px 0 20px; }
  .masthead .who { flex: 1; min-width: 0; }
  .crest { width: 50px; height: 50px; flex: 0 0 50px; border-radius: 15px; background: var(--ball); color: var(--ball-ink);
    display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 17px; }

  .masthead h1 { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.05; margin: 0;
    letter-spacing: -.02em; color: var(--on-brand); }
  .masthead .sub { margin: 5px 0 0; font-size: 12.5px; color: var(--on-brand-dim); font-family: var(--mono);
    line-height: 1.4; text-wrap: pretty; }
  .hbtns { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .hbtn { width: 34px; height: 34px; flex: 0 0 34px; border-radius: 50%; border: 1px solid rgba(245,251,247,.28);
    background: rgba(245, 251, 247, .12); color: var(--on-brand); display: grid; place-items: center; cursor: pointer;
    transition: background .15s, transform .15s; }
  .hbtn:hover { background: rgba(245, 251, 247, .22); }
  .hbtn:active { transform: scale(.94); }
  .hbtn.spin svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .hbtn.spin svg { animation: none; } }

  .toast { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(8px);
    background: var(--brand-deep); color: #ffffff; font-family: var(--mono); font-size: 11.5px; letter-spacing: .03em;
    padding: 11px 18px; border-radius: 999px; z-index: 70; opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease; white-space: nowrap; }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  .setsec { padding: 18px 0; border-top: 1px solid var(--line-soft); }
  .setsec:first-of-type { border-top: 0; padding-top: 4px; }
  .setsec h4 { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-dim); margin: 0 0 12px; font-weight: 400; }
  .passrow { display: flex; gap: 8px; }
  .passrow input { flex: 1; min-width: 0; font-family: var(--mono); font-size: 15px; letter-spacing: .3em;
    color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 13px; }
  .passrow input:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
  .kid, .lrow { cursor: default; }
  button.kid, button.lrow { cursor: pointer; }
  .about { font-family: var(--mono); font-size: 11px; line-height: 1.9; color: var(--ink-dim); }
  .visits { margin-top: 16px; }
  .visits img { height: 22px; display: block; }
  .visits img.hide { display: none; }
  .about a { color: var(--brand); text-decoration: none; }

  .tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
    margin: 0 -20px 26px; padding: 10px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(245,251,247,.14); }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { appearance: none; border: 0; background: transparent; cursor: pointer; font-family: var(--mono);
    font-size: 11.5px; letter-spacing: .03em; text-transform: uppercase; color: var(--on-brand-dim); padding: 9px 8px;
    border-radius: 9px; white-space: nowrap; transition: color .15s, background .15s; }
  .tabs button[aria-selected="true"] { color: var(--ball-ink); background: var(--ball); font-weight: 500;
    box-shadow: 0 4px 14px -8px rgba(0, 0, 0, .5); }


  .view { display: none; animation: rise .3s ease both; }
  .view.on { display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .view { animation: none; } }

  .card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 22px; padding: 26px 22px;
    box-shadow: var(--shadow); margin-bottom: 22px; }
  .label { font-family: var(--mono); font-size: 11.5px; letter-spacing: .13em; text-transform: uppercase;
    color: var(--ink-dim); margin: 0 0 18px; display: flex; align-items: center; gap: 8px; }
  .label::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ball); flex: 0 0 8px;
    box-shadow: 0 0 0 1px rgba(16,36,26,.16); }
  .caption { font-size: 14.5px; color: var(--ink-dim); line-height: 1.7; margin: 16px 0 0; text-wrap: pretty; }
  .caption b { color: var(--ink); font-weight: 600; }

  .hero { position: relative; overflow: hidden; border-radius: 26px; padding: 28px 24px; margin-bottom: 20px;
    background: linear-gradient(158deg, #33b174 0%, #178a56 55%, #0c5c3a 100%);
    color: var(--on-brand); box-shadow: var(--shadow); border: 1px solid rgba(245,251,247,.14); }
  .hero .courtlines { position: absolute; inset: 0; opacity: .16; pointer-events: none; }
  .hero .rd { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; position: relative; color: var(--on-brand); }
  .pill { background: rgba(245, 251, 247, .16); border-radius: 999px; padding: 3px 11px; font-size: 10px; letter-spacing: .09em; }
  .pill.today { background: var(--ball); color: var(--ball-ink); font-weight: 600; }
  .hero h2 { position: relative; font-family: var(--display); font-weight: 800; font-size: clamp(30px, 8.4vw, 42px); text-wrap: balance;
    line-height: 1.02; letter-spacing: -.03em; margin: 18px 0 0; }
  .hero h2 small { display: block; font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; opacity: .75; margin-bottom: 9px; }
  .hero .venue { position: relative; font-size: 15.5px; line-height: 1.5; text-wrap: pretty; color: var(--on-brand-dim); margin-top: 12px; }

  .trio { position: relative; display: flex; gap: 14px; margin-top: 24px; }
  .trio .who { text-align: center; flex: 1; }
  .trio .av { width: 52px; height: 52px; margin: 0 auto 9px; border-radius: 50%; background: var(--ball); color: var(--ball-ink);
    display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 17px; }
  .trio .who.em .av { background: rgba(245, 251, 247, .92); color: var(--brand-deep); }
  .trio .nm { font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; color: var(--on-brand-dim); }

  .pager { overflow: hidden; margin-bottom: 14px; transition: height .28s ease; }
  .pages { display: flex; align-items: flex-start; transition: transform .3s cubic-bezier(.22,.61,.36,1); will-change: transform; }
  .pages > * { flex: 0 0 100%; min-width: 0; }
  .pages .card { margin-bottom: 0; }
  .dots { display: flex; justify-content: center; gap: 7px; margin: 0 0 20px; }
  .dots button { width: 7px; height: 7px; border-radius: 50%; border: 0; padding: 0;
    background: rgba(255, 255, 255, .45); cursor: pointer; transition: width .2s, background .2s; }
  .dots button.on { background: var(--ball); width: 20px; border-radius: 4px; }
  .fourlist { margin-top: 6px; }
  .frow { padding: 13px 0; border-bottom: 1px solid var(--line-soft); }
  .frow:last-child { border-bottom: 0; padding-bottom: 0; }
  .fbody { display: block; }
  .fname { display: block; font-size: 16.5px; font-weight: 500; color: var(--ink); text-wrap: pretty; }
  .fgood { display: block; font-family: var(--display); font-weight: 800; font-size: 17px; color: var(--brand); margin-top: 3px; }
  .fnote { display: block; font-family: var(--mono); font-size: 11px; color: var(--ink-dim); margin-top: 5px; line-height: 1.55; }

  .install { padding: 18px 20px; }
  .instrow { display: flex; align-items: center; gap: 14px; }
  .insttxt { flex: 1; min-width: 0; }
  .insttxt b { display: block; font-size: 15.5px; font-weight: 600; }
  .insttxt span { display: block; font-size: 13px; color: var(--ink-dim); margin-top: 3px; line-height: 1.5; text-wrap: pretty; }
  .install .btn { flex: 0 0 auto; }

  .lvl { display: flex; align-items: baseline; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
  .lvl:last-of-type { border-bottom: 0; }
  .lvl .ln { font-size: 16px; font-weight: 500; min-width: 74px; }
  .lvl .ls { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }
  .lvl.now .ln { color: var(--brand); font-weight: 700; }
  .lnow { margin-left: auto; font-family: var(--mono); font-size: 9px; letter-spacing: .08em; text-transform: uppercase;
    background: var(--ball); color: var(--ball-ink); padding: 3px 7px; border-radius: 5px; }
  .prow { padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
  .prow:last-of-type { border-bottom: 0; }
  .prow b { display: block; font-size: 15.5px; font-weight: 600; }
  .prow span { display: block; font-size: 13.5px; color: var(--ink-dim); line-height: 1.6; margin-top: 3px; text-wrap: pretty; }
  .maprow, .linkrow { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line-soft);
    color: var(--ink); text-decoration: none; }
  .maprow:last-child, .linkrow:last-of-type { border-bottom: 0; }
  .maprow span, .linkrow span { flex: 1; min-width: 0; }
  .maprow small, .linkrow small { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--ink-dim);
    margin-top: 3px; line-height: 1.5; }
  .linkrow b { font-size: 15.5px; font-weight: 600; }
  .linkrow .arrow { flex: 0 0 auto; color: var(--brand); font-size: 17px; }
  .step { display: flex; gap: 12px; width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
    padding: 13px 0; border-bottom: 1px solid var(--line-soft); font-family: inherit; }
  .step:last-of-type { border-bottom: 0; }
  .step .tick { flex: 0 0 22px; width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--line);
    display: grid; place-items: center; font-size: 13px; color: #fff; margin-top: 2px; }
  .step.on .tick { background: var(--brand); border-color: var(--brand); }
  .step .stxt b { display: block; font-size: 15.5px; font-weight: 600; color: var(--ink); }
  .step.on .stxt b { color: var(--ink-dim); }
  .step .stxt small { display: block; font-size: 13px; color: var(--ink-dim); line-height: 1.55; margin-top: 3px; text-wrap: pretty; }

  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .kpi { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 18px; padding: 20px 14px;
    text-align: center; box-shadow: var(--shadow); }
  .kpi .n { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .kpi .n small { font-size: 13px; font-weight: 600; color: var(--ink-dim); letter-spacing: 0; }
  .kpi .k { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); margin-top: 9px; }

  .chart { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-family: var(--mono); font-size: 10px; fill: var(--ink-dim); }
  .chart .big { font-family: var(--display); font-size: 26px; font-weight: 800; fill: var(--ink); }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 16px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  /* stat rows */
  .srow { display: flex; align-items: baseline; justify-content: space-between; padding: 13px 0; border-top: 1px solid var(--line-soft); }
  .srow:first-child { border-top: 0; }
  .srow .k { font-family: var(--mono); font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-dim); }
  .srow .v { font-family: var(--display); font-weight: 700; font-size: 19px; font-variant-numeric: tabular-nums; }
  .srow .v small { font-size: 12px; color: var(--ink-dim); font-weight: 500; }

  /* gap rows */
  .gap { padding: 14px 0; border-top: 1px solid var(--line-soft); }
  .gap:first-of-type { border-top: 0; }
  .gline { display: flex; align-items: baseline; gap: 10px; }
  .gap .pos { width: 16px; font-family: var(--mono); font-size: 12px; color: var(--ink-dim); }
  .gap .nm { flex: 1; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gap.us .nm { color: var(--brand); font-weight: 700; }
  .gap .pts { font-family: var(--display); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
  .gap .d { width: 58px; text-align: right; font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }
  .gap .d.ahead { color: var(--ink-dim); }
  .gap.us .d { color: var(--brand); font-weight: 500; }
  .gtrack { height: 7px; border-radius: 4px; background: var(--surface-2); margin: 9px 0 0 26px; overflow: hidden; }
  .gtrack i { display: block; height: 100%; border-radius: 4px; background: var(--muted); opacity: .6; }
  .gap.us .gtrack i { background: var(--brand); opacity: 1; }
  .cutline { display: flex; align-items: center; gap: 10px; margin: 6px 0 0 26px; }
  .cutline::before, .cutline::after { content: ""; height: 1px; flex: 1; background: repeating-linear-gradient(90deg, var(--line) 0 5px, transparent 5px 10px); }
  .cutline span { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }

  .seg-top { display: flex; gap: 6px; background: var(--surface-2); border-radius: 14px; padding: 5px; margin-bottom: 20px; }
  .seg-top button { flex: 1; appearance: none; border: 0; background: transparent; cursor: pointer; font-family: var(--mono);
    font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-dim); padding: 10px 6px; border-radius: 10px; }
  .seg-top button[aria-selected="true"] { background: var(--surface); color: var(--brand); font-weight: 600;
    box-shadow: 0 1px 3px rgba(0,0,0,.10); }

  .rnd { padding: 18px 0; border-top: 1px solid var(--line-soft); }
  .rnd:first-child { border-top: 0; padding-top: 0; }
  .rnd-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
  .rnd-h b { color: var(--ink); font-weight: 500; }
  .mt { display: flex; align-items: center; gap: 10px; padding: 10px 0; font-size: 14.5px; }
  .mt .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mt .nm.r { text-align: right; }
  .mt .sc { text-align: center; }
  .mt .sc span { display: block; white-space: nowrap; }
  .mt .sc { font-family: var(--mono); font-size: 10.5px; line-height: 1.45; color: var(--ink-dim); background: var(--surface-2);
    border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
  .mt.ours .nm { color: var(--brand); font-weight: 700; }

  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li { display: grid; grid-template-columns: 46px 1fr auto; gap: 14px; align-items: center; padding: 15px 0;
    border-top: 1px solid var(--line-soft); }
  .tl li:first-child { border-top: 0; }
  .tl .rn { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); text-align: center; background: var(--surface-2);
    border-radius: 9px; padding: 7px 0; }
  .tl .who { font-size: 15.5px; line-height: 1.45; text-wrap: pretty; }
  .tl .who small { display: block; color: var(--ink-dim); font-size: 12px; font-family: var(--mono); margin-top: 5px; line-height: 1.55; }
  .tl .res { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); }
  .tl li.today { background: var(--brand-wash); border-radius: 14px; padding-left: 12px; padding-right: 12px; margin: 0 -12px; }
  .tl li.past .who { color: var(--ink-dim); }
  .tl li.past .who small { color: var(--muted); }
  .tl li:not(.past) .who { color: var(--brand); }
  .tl li:not(.past) .who small { color: var(--ink-dim); }
  .tl li.today .who { font-weight: 700; }
  .pastwrap { margin-top: 6px; border-top: 1px solid var(--line-soft); }
  .pastwrap summary { list-style: none; cursor: pointer; padding: 16px 0 4px; font-family: var(--mono);
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
  .pastwrap summary::-webkit-details-marker { display: none; }
  .pastwrap summary::before { content: "▸ "; }
  .pastwrap[open] summary::before { content: "▾ "; }
  .tl li.next .rn { background: var(--ball); color: var(--ball-ink); font-weight: 700; }

  .pcard { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 22px; padding: 24px 22px;
    margin-bottom: 18px; box-shadow: var(--shadow); }
  .pcard .top { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .rank { width: 38px; height: 38px; flex: 0 0 38px; border-radius: 12px; background: var(--brand); color: #ffffff;
    display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 16px; }

  .pcard .nm { font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: -.01em; }
  .pcard .role { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); margin-top: 4px; }
  .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: center; }
  .pstats .row { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line-soft); }
  .pstats .row:first-child { border-top: 0; }
  .pstats .k { font-family: var(--mono); font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-dim); }

function resultsFor(team) {
  const out = [];
  DATA.results.forEach((r) => r.matches.forEach((m) => {
    if (m.home !== team && m.away !== team) return;
    const home = m.home === team;
    let res;
    if (m.washout) res = "wo";
    else {
      const mine = home ? m.homePts : m.awayPts, theirs = home ? m.awayPts : m.homePts;
      res = mine > theirs ? "w" : mine < theirs ? "l" : "d";
    }
    out.push({ round: r.round, date: r.date, res, home, opp: home ? m.away : m.home, m });
  }));
  return out.sort((a, b) => b.round - a.round);
}

const normName = (v) => String(v || "").toLowerCase().replace(/[^a-z ]/g, " ").replace(/\s+/g, " ").trim();

function nameScore(input, candidate) {
  const a = normName(input).split(" ").filter(Boolean);
  const b = normName(candidate).split(" ").filter(Boolean);
  if (!a.length || !b.length) return 0;
  const [short, long] = a.length <= b.length ? [a, b] : [b, a];
  const hit = (w) => long.some((x) => x === w || (w.length >= 3 && x.startsWith(w.slice(0, 3))));
  if (short.every(hit)) return short.length === long.length ? 1 : 0.9;
  return short.filter(hit).length / Math.max(a.length, b.length);
}

function knownNames() {
  const set = new Set(Object.keys(DATA.section_players || {}));
  (DATA.match_details || []).forEach((m) => {
    [...(m.home_players || []), ...(m.away_players || [])].forEach((n) => {
      if (n && !/^no player/i.test(n)) set.add(n);
    });
  });
  (roster.players || []).forEach((p) => set.add(p.name));
  return [...set];
}

function matchName(input) {
  const target = String(input || "").trim();
  if (!target) return "";
  let best = null, score = 0;
  knownNames().forEach((n) => {
    const sc = nameScore(target, n);
    if (sc > score) { score = sc; best = n; }
  });
  return score >= 0.8 ? best : target;
}

function recordFor(name) {
  const hit = (DATA.section_players || {})[name];
  if (!hit || !hit.rubbers) return null;
  return hit;
}

function playingFor(round) {
  const rr = rosterRound(round);
  if (!rr) return { playing: [], sitting: [], added: [], edited: false };
  const e = editsFor(round);
  const added = e.add || [];
  const playing = (rr.in || []).filter((n) => !(e.out || []).includes(n)).concat(added);
  const sitting = [...new Set([...(rr.out || []), ...(rr.unavailable || []), ...(e.out || [])])]
    .filter((n) => !playing.includes(n));
  return { playing, sitting, added, edited: (e.out || []).length + added.length > 0 };
}
function planFor(firstName, n) {
  const r = rosterRound(n);
  if (!r) return "none";
  if ((r.in || []).includes(firstName)) return "in";
  if ((r.unavailable || []).includes(firstName)) return "un";
  if ((r.out || []).includes(firstName)) return "out";
  return "none";
}

let ladderSort = "team"; // "team" = the site's order, then games | "games" | "pct" | "sets"
const teamPos = {};
DATA.ladder.forEach((t) => { teamPos[t.team] = t.pos; });

function ladderRowsAll(mode) {
  const m = mode || ladderSort;
  const all = Object.values(DATA.section_players || {}).filter((p) => p.rubbers > 0);
  return all.sort((a, b) => {
    if (m === "team") {
      const ta = teamPos[a.team] || 99, tb = teamPos[b.team] || 99;
      return (ta - tb) || (b.games_won - a.games_won) || a.name.localeCompare(b.name);
    }
    if (m === "pct") {
      return (b.set_pct - a.set_pct) || ((b.game_pct || 0) - (a.game_pct || 0)) || a.name.localeCompare(b.name);
    }
    if (m === "sets") {
      return (b.sets_won - a.sets_won) || (b.games_won - a.games_won) || a.name.localeCompare(b.name);
    }
    return (b.games_won - a.games_won)
      || ((b.games_won - b.games_lost) - (a.games_won - a.games_lost))
      || a.name.localeCompare(b.name);
  });
}
function rankOf(name) {
  const rows = ladderRowsAll("games");
  const i = rows.findIndex((r) => r.name === name);
  return i < 0 ? null : { rank: i + 1, total: rows.length };
}

function ladderByRate() {
  return Object.values(DATA.section_players || {})
    .filter((p) => p.rubbers > 0 && p.set_pct != null)
    .sort((a, b) =>
      (b.set_pct - a.set_pct)
      || (b.sets_won - a.sets_won)
      || ((b.game_pct || 0) - (a.game_pct || 0))
      || a.name.localeCompare(b.name));
}

function teamsTable() {
  const sorted = [...DATA.ladder].sort((a, b) => a.pos - b.pos);
  const mine = sorted.find((t) => t.isUs);

  const level = sorted.find((t) => t.pos !== mine.pos && t.pts === mine.pts);
  const roundsLeft = DATA.draw.filter((d) => d.date >= todayISO()).length;
  const clear = mine.pts - fourth.pts;

  const rows = sorted.map((t) => {
    const fin = t.pos <= 4;
    const row = `<tr class="${t.isUs ? "us" : ""}">

    return row;

  return `<div class="tblwrap"><table class="ptable">
      <thead><tr><th class="pos">#</th><th class="pl">Team</th><th class="num">Pts</th><th class="num">%</th></tr></thead>

    Percentage is games won ÷ games lost.</p>`;
}

function explainSheet(name) {
  const rows = ladderRowsAll();
  const i = rows.findIndex((r) => r.name === name);
  if (i < 0) return "";
  const p = rows[i];
  const pos = i + 1;
  const above = rows.slice(0, i);
  const next = i > 0 ? rows[i - 1] : null;
  const sameGames = above.filter((r) => r.games_won === p.games_won);
  const detail = ((DATA.our_players || {})[name] || {}).detail || [];
  const sets = detail.flatMap((d) => (d.rubbers || []).map((rb) => ({ ...rb, round: d.round, opp: d.opponent_team })));
  const totalG = p.games_won + p.games_lost;
  const faced = [...new Set(detail.map((d) => d.opponent_team))];
  const steps = [];
  let stepNo = 0;
  const step = (body) => { stepNo += 1; return `<div class="step"><span class="num">${stepNo}</span><span class="body">${body}</span></div>`; };

  steps.push(step(`<span class="big">${p.games_won} games won</span><br>
    out of ${totalG} played — <b>${p.game_pct || 0}%</b> — across ${p.rubbers} sets${faced.length ? `, against ${faced.map(esc).join(" and ")}` : ""}.
    ${p.sets_won}–${p.sets_lost} on sets.`));

  if (!above.length) {
    steps.push(step(`Nobody in the section has won more games, so this is <b>1st</b>.`));
  } else {
    const more = above.filter((r) => r.games_won > p.games_won);
    let line = more.length
      ? `<b>${more.length}</b> ${more.length === 1 ? "player has" : "players have"} won more games —
         ${more.slice(0, 3).map((r) => `${esc(first(r.name))} ${r.games_won}`).join(", ")}${more.length > 3 ? " and others" : ""}.`
      : `Nobody has won more games than ${esc(first(p.name))} (${p.games_won}).`;
    if (sameGames.length) {
      line += ` Level on ${p.games_won} games with ${sameGames.map((r) => esc(first(r.name))).join(", ")}, so the better win–loss difference goes higher.`;
    }
    line += ` This is <b>${pos}${ordinal(pos)}</b> of ${rows.length}.`;
    steps.push(step(line));
  }

  if (next) {
    if (next.games_won > p.games_won) {
      const need = next.games_won - p.games_won + 1;
      steps.push(step(`<b>${need}</b> more game${need === 1 ? "" : "s"} won puts ${esc(first(p.name))} level with
        ${esc(first(next.name))} (${next.games_won}).`));
    } else {
      const gap = (next.games_won - next.games_lost) - (p.games_won - p.games_lost);
      steps.push(step(`Level with ${esc(first(next.name))} on ${p.games_won} games. Their difference is
        ${gap > 0 ? "+" + gap : gap}, so winning a few more than them moves ${esc(first(p.name))} ahead.`));
    }
  }

  if (sets.length) {
    const wins = sets.filter((r) => r.won).sort((a, b) => (a.ours - a.theirs) - (b.ours - b.theirs));
    const losses = sets.filter((r) => !r.won);
    const bits = [];
    const margins = [...new Set(wins.map((w) => `${w.ours}–${w.theirs}`))];
    if (wins.length) {
      bits.push(margins.length === 1
        ? `every set won <b>${margins[0]}</b>`
        : `closest set <b>${wins[0].ours}–${wins[0].theirs}</b> vs ${esc(wins[0].opp)}`);
    }
    if (losses.length) bits.push(`lost <b>${losses.map((l) => `${l.ours}–${l.theirs}`).join(", ")}</b> vs ${esc(losses[0].opp)}`);
    if (bits.length) steps.push(step(`The detail: ${bits.join("; ")}.`));
  }

  return `
    <div class="grab"></div>
    <button class="ovclose" data-close="1" aria-label="Close">×</button>
    <h3 class="ovtitle" id="ovTitle">Why ${esc(first(p.name))} is ${pos}${ordinal(pos)}</h3>
    <p class="ovsub">${esc(p.team)} · Open Triples Green Ball 1</p>
    ${steps.join("")}
    <p class="ovfoot">The ladder counts <b>games won</b>. A comfortable win is worth more games than a tight one.</p>`;
}

      const hWin = m.homePts > m.awayPts;
      return `<div class="mt ${ours ? "ours" : ""}">
        <span class="nm" style="${hWin ? "font-weight:700" : ""}">${esc(m.home)}</span>
        <span class="sc"><span>${m.homePts.toFixed(0)}–${m.awayPts.toFixed(0)} pts</span><span>${m.homeGames}–${m.awayGames} games</span></span>
        <span class="nm r" style="${!hWin ? "font-weight:700" : ""}">${esc(m.away)}</span></div>`;
    }).join("");
    return `<div class="rnd"><div class="rnd-h"><b>Round ${r.round}</b><span>${fmtLong(r.date)}</span></div>${rows}</div>`;
  }).join("");
  return `<div class="card"><p class="label">Round by round</p>${blocks}
    <p class="caption">Points are ladder points — a win is worth 8, a wash-out 4 each. Games are the 6–2s inside the sets.</p></div>`;
}

function drawView() {
  const t = todayISO();
  const nextNo = nextRound().round;
  const row = (d) => {
    const past = d.date < t, isToday = d.date === t, isNext = d.round === nextNo && !past;
    const rr = rosterRound(d.round);
    const trio = rr ? (rr.in || []).map(first).join(", ") : "";
    const who = d.opponent ? `${d.homeAway === "H" ? "vs" : "at"} ${esc(d.opponent)}` : "Opponent TBC";
    return `<li class="${past ? "past" : ""} ${isToday ? "today" : ""} ${isNext ? "next" : ""}">
      <span class="rn">${d.round}</span>
      <span class="who">${who}<small>${fmtDate(d.date)}${d.homeAway ? " · " + (d.homeAway === "H" ? "home" : "away") : ""}${trio ? " · " + esc(trio) : ""}</small></span>
      <span class="res">${d.result ? esc(d.result) : ""}</span></li>`;
  };
  const upcoming = DATA.draw.filter((d) => d.date >= t).map(row).join("");
  const earlier = DATA.draw.filter((d) => d.date < t).map(row).join("");
  const finals = DATA.finals.map((f) => `<li><span class="rn">—</span><span class="who">${esc(f.label)}<small>${fmtDate(f.date)}</small></span><span class="res"></span></li>`).join("");
  const pastCount = DATA.draw.filter((d) => d.date < t).length;
  return `<div class="card"><p class="label">Season draw</p>
    <ul class="tl">${upcoming}${finals}</ul>
    ${pastCount ? `<details class="pastwrap"><summary>Earlier rounds · ${pastCount} played</summary>
      <ul class="tl">${earlier}</ul></details>` : ""}
  </div>`;
}

function viewClubs() {
  const order = [CLUB].concat(DATA.clubs.filter((c) => c.name !== CLUB).map((c) => c.name));
  const cards = order.map((name) => {
    const c = clubByName(name);

    return `<div class="club">

      <div class="vd">${esc(cleanPlace(c.venue))} · Melway ${esc(c.melway)}</div>

function ymdLocal(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function matchReminderText() {
  const nr = nextRound();
  if (!nr || !nr.opponent) return null;
  const days = Math.round((parseDate(nr.date) - parseDate(ymdLocal(new Date()))) / 86400000);
  if (days < 0 || days > 3) return null;
  const now = new Date();
  const day = now.getDay(), hr = now.getHours();
  const window_ = (day === 5 && hr >= 18) || day === 6 || (day === 0 && hr < 18);
  if (!window_) return null;
  const atHome = nr.homeAway === "H";
  const opp = clubByName(nr.opponent);
  const ourClub = clubByName(CLUB);
  const place = cleanPlace(atHome ? (ourClub && ourClub.venue) : (opp && opp.venue));
  const trio = playingFor(nr.round).playing.map((n) => first(n)).join(", ");
  return {
    round: nr.round,
    title: `Sunday: ${atHome ? "v" : "at"} ${nr.opponent}`,
    body: [place, trio].filter(Boolean).join(" · "),
  };
}

async function maybeRemind() {
  if (!alertsOn()) return;
  const msg = matchReminderText();
  if (!msg) return;
  const key = "em-gb1-reminded-" + msg.round;
  if (localStorage.getItem(key) === "1") return;
  try {
    const reg = swReg || await navigator.serviceWorker.ready;
    reg.showNotification(msg.title, {
      body: msg.body, icon: "icon-192.png", badge: "icon-192.png",
      tag: "gb1-match-" + msg.round, data: { url: "./" },
    });
    localStorage.setItem(key, "1");
  } catch (e) {}
}

function sigOf(d) {
  const draw = (d.draw || []).map((x) => x.opponent || "-").join(",");
  return [d.meta.ladder_loaded, d.results.length, draw].join("|");
}

const NSTATE = "em-gb1-notif-state-v1";

function notifState() {
  try { return JSON.parse(localStorage.getItem(NSTATE) || '{"wash":[],"finals":false}'); }
  catch (e) { return { wash: [], finals: false }; }
}
function saveNotifState(st) { try { localStorage.setItem(NSTATE, JSON.stringify(st)); } catch (e) {} }

function ourWashRounds(d) {
  return (d.results || [])
    .filter((r) => (r.matches || []).some((m) => m.washout && (m.home === CLUB || m.away === CLUB)))
    .map((r) => r.round);
}

function finalsSecured(d) {
  const ladder = [...(d.ladder || [])].sort((a, b) => a.pos - b.pos);
  const mine = ladder.find((t) => t.isUs);
  const fifth = ladder[4];
  if (!mine || !fifth) return false;
  const played = new Set((d.results || []).map((r) => r.round));
  const remaining = (d.draw || []).filter((x) => !played.has(x.round)).length;
  return mine.pts > fifth.pts + 8 * remaining;
}

async function pushNote(body, tag) {
  try {
    const reg = swReg || await navigator.serviceWorker.ready;
    reg.showNotification(APP_NAME, { body, icon: "icon-192.png", badge: "icon-192.png", tag });
  } catch (e) {}
}

async function noteUpdate(fresh) {
  const prev = localStorage.getItem(SIG_KEY);
  const before = notifState();
  const washNow = ourWashRounds(fresh);
  const newWash = washNow.filter((r) => !(before.wash || []).includes(r));
  const securedNow = finalsSecured(fresh);
  const justSecured = securedNow && !before.finals;
  saveNotifState({ wash: washNow, finals: securedNow });

  localStorage.setItem(SIG_KEY, sigOf(fresh));
  if (!prev || prev === sigOf(fresh) || !alertsOn()) return;

  if (newWash.length) {
    const r = newWash[newWash.length - 1];
    return pushNote(`Round ${r} washed out — no play.`, "gb1-wash-" + r);
  }
  if (justSecured) return pushNote("Finals secured — you're in the top four.", "gb1-finals");

  const [prevLoad, prevRounds] = prev.split("|");
  const latest = (fresh.results || [])[0];
  let body = "Ladder updated";
  if (prevRounds !== String((fresh.results || []).length) && latest) body = `Round ${latest.round} results are in`;
  else if (prevLoad === String(fresh.meta.ladder_loaded)) body = "Fixture updated";
  return pushNote(body, "gb1-update");
}

    if (!track) return;
    const slides = [...track.children];
    let index = 0;
    const fit = () => {
      const slide = slides[index];
      if (!slide) return;
      const h = slide.getBoundingClientRect().height;
      if (h > 40) pager.style.height = h + "px";
    };
    const go = (i) => {
      index = Math.max(0, Math.min(slides.length - 1, i));
      track.style.transform = `translateX(${-index * 100}%)`;
      if (dots && dots.classList.contains("dots")) {
        dots.querySelectorAll("button").forEach((b, bi) => b.classList.toggle("on", bi === index));
      }
      fit();
    };
    if (dots && dots.classList.contains("dots")) {
      dots.querySelectorAll("button").forEach((b) => { b.onclick = () => go(Number(b.dataset.slide)); });
    }
    let sx = 0, sy = 0, live = false;
    pager.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      sx = t.clientX; sy = t.clientY; live = true;
    }, { passive: true });
    pager.addEventListener("touchend", (e) => {
      if (!live) return;
      live = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.2) go(index + (dx < 0 ? 1 : -1));
    }, { passive: true });
    window.addEventListener("resize", fit);
    requestAnimationFrame(() => { fit(); go(0); });

    const res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const fresh = await res.json();
    const changed = sigOf(fresh) !== sigOf(DATA);
    const first = !localStorage.getItem(SIG_KEY);
    if (changed && !first) {
      noteUpdate(fresh);
      Object.assign(DATA, fresh);
      if (fresh.roster) Object.assign(roster, fresh.roster);
      renderAll();
      outcome = "Updated from TROLS";
    } else {
      outcome = first ? null : "Already up to date";
    }
    localStorage.setItem(SIG_KEY, sigOf(fresh));
  } catch (e) {
    outcome = navigator.onLine === false ? "Offline — showing saved data" : "Couldn't reach TROLS";
  } finally {
    refreshing = false;
    if (btn) btn.classList.remove("spin");
    if (outcome && !silent) showToast(outcome);
  }
}

const refreshBtn = $("#refreshBtn");
if (refreshBtn) refreshBtn.onclick = () => refreshNow();
const settingsBtn = $("#settingsBtn");
if (settingsBtn) settingsBtn.onclick = () => openSettings();

refreshNow({ silent: true });
loadEvents();
setTimeout(maybeRemind, 2500);
</script>
</body>
</html>
