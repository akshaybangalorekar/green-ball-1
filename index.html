const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CLUB = DATA.meta.club;
const APP_NAME = "Advantage";
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

const parseDate = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d, 12, 0, 0); };
const fmtDate = (iso) => { const d = parseDate(iso); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const fmtLong = (iso) => { const d = parseDate(iso); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const todayISO = () => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}-${String(n.getDate()).padStart(2, "0")}`; };
const pct = (n) => Number(n).toFixed(2).replace(/\.00$/, ".0");
const first = (n) => String(n).split(" ")[0];
const initials = (n) => String(n).split(" ").map((w) => w[0]).join("").slice(0, 2).toUpperCase();
const ordinal = (n) => { const s = ["th", "st", "nd", "rd"], v = n % 100; return s[(v - 20) % 10] || s[v] || s[0]; };

const us = DATA.ladder.find((t) => t.isUs);
const roster = DATA.roster || { players: [], rounds: [], team_order: [] };
const playerResults = DATA.player_results || {};

function resultsFor(team) {
  const out = [];
  DATA.results.forEach((r) => r.matches.forEach((m) => {
    if (m.home !== team && m.away !== team) return;
    const home = m.home === team;
    let res;
    if (m.washout) res = "wo";
    else {
      const mine = home ? m.homePts : m.awayPts, theirs = home ? m.awayPts : m.homePts;
      res = mine > theirs ? "w" : mine < theirs ? "l" : "d";
    }
    out.push({ round: r.round, date: r.date, res, home, opp: home ? m.away : m.home, m });
  }));
  return out.sort((a, b) => b.round - a.round);
}
const ourResults = resultsFor(CLUB);
const resultForRound = (n) => ourResults.find((r) => r.round === n) || null;
const ourPoints = (r) => (r.m.washout ? 4 : (r.m.home === CLUB ? r.m.homePts : r.m.awayPts));

function nextRound() {
  const t = todayISO();
  const upcoming = DATA.draw.filter((d) => d.date >= t);
  return upcoming.length ? upcoming[0] : DATA.draw[DATA.draw.length - 1];
}
const clubByName = (name) => DATA.clubs.find((c) => c.name === name) || null;

const rosterRound = (n) => roster.rounds.find((r) => r.round === n) || null;
function planFor(firstName, n) {
  const r = rosterRound(n);
  if (!r) return "none";
  if ((r.in || []).includes(firstName)) return "in";
  if ((r.unavailable || []).includes(firstName)) return "un";
  if ((r.out || []).includes(firstName)) return "out";
  return "none";
}

/* ---------- team totals ---------- */
const completedRounds = ourResults.filter((r) => r.res !== "wo");
const teamSetsFor = us.sets_for, teamSetsAgainst = us.sets_against;
const setPct = Math.round((100 * teamSetsFor) / Math.max(1, teamSetsFor + teamSetsAgainst));
const gamePct = Math.round((100 * us.games_for) / Math.max(1, us.games_for + us.games_against));
const pointsPerRound = (us.pts / Math.max(1, ourResults.length)).toFixed(1);
const winRate = completedRounds.length ? Math.round((100 * completedRounds.filter((r) => r.res === "w").length) / completedRounds.length) : 0;

/* ---------- per player ---------- */
function playerLine(name) {
  const pr = playerResults[name];
  if (!pr) return null;
  const singles = pr.singles || [], doubles = pr.doubles || [];
  return {
    ...pr,
    singlesWon: singles.filter((r) => r.won).length,
    singlesPlayed: singles.length,
    doublesWon: doubles.filter((r) => r.won).length,
    doublesPlayed: doubles.length,
  };
}
const squad = (roster.players || []).map((p) => {
  const f = first(p.name);
  const inR = [], outR = [], unR = [];
  roster.rounds.forEach((r) => {
    if ((r.in || []).includes(f)) inR.push(r.round);
    else if ((r.unavailable || []).includes(f)) unR.push(r.round);
    else if ((r.out || []).includes(f)) outR.push(r.round);
  });
  const line = playerLine(p.name);
  return { ...p, inCount: inR.length, outCount: outR.length, unCount: unR.length,
    scheduled: roster.rounds.length || 1, line };
}).sort((a, b) => a.rank - b.rank);

/* ---------- graphics ---------- */
function ring(value, max, label, sub) {
  const r = 52, c = 2 * Math.PI * r, dash = Math.max(0, Math.min(1, value / max)) * c;
  return `<svg class="chart" viewBox="0 0 140 140" role="img" aria-label="${esc(label)}">
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="13"/>
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--clay)" stroke-width="13" stroke-linecap="round"
      stroke-dasharray="${dash} ${c}" transform="rotate(-90 70 70)"/>
    <text x="70" y="${sub ? 64 : 70}" text-anchor="middle" class="big" dominant-baseline="middle">${esc(label)}</text>
    ${sub ? `<text x="70" y="88" text-anchor="middle">${esc(sub)}</text>` : ""}
  </svg>`;
}

function pointsChart() {
  const rounds = ourResults.slice().sort((a, b) => a.round - b.round);
  if (!rounds.length) return "";
  const W = 320, H = 168, pad = 8, top = 26, base = H - 26;
  const bw = (W - pad * 2) / rounds.length;
  let cum = 0;
  const bars = rounds.map((r, i) => {
    const pts = ourPoints(r); cum += pts;
    const h = (pts / 8) * (base - top - 18);
    const x = pad + i * bw + bw * 0.2, w = bw * 0.6;
    return `<rect x="${x}" y="${base - h}" width="${w}" height="${h}" rx="4" fill="var(--clay)" opacity="${r.res === "wo" ? .35 : .9}"/>
      <text x="${x + w / 2}" y="${base - h - 9}" text-anchor="middle" style="fill:var(--ink)">${pts.toFixed(0)}</text>
      <text x="${x + w / 2}" y="${base + 17}" text-anchor="middle">R${r.round}</text>
      <text x="${x + w / 2}" y="${H - 2}" text-anchor="middle" style="fill:var(--clay)">${cum.toFixed(0)}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><line x1="${pad}" y1="${base}" x2="${W - pad}" y2="${base}" stroke="var(--line)"/>${bars}</svg>`;
}

function gamesChart() {
  const rounds = ourResults.slice().sort((a, b) => a.round - b.round).filter((r) => r.res !== "wo");
  if (!rounds.length) return "";
  const W = 320, H = 150, pad = 8, top = 20, base = H - 24;
  const maxG = Math.max(...rounds.map((r) => Math.max(r.m.homeGames, r.m.awayGames)), 36);
  const bw = (W - pad * 2) / rounds.length;
  const bars = rounds.map((r, i) => {
    const mine = r.m.home === CLUB ? r.m.homeGames : r.m.awayGames;
    const theirs = r.m.home === CLUB ? r.m.awayGames : r.m.homeGames;
    const hM = (mine / maxG) * (base - top), hT = (theirs / maxG) * (base - top);
    const x = pad + i * bw + bw * 0.14, w = bw * 0.34;
    return `<rect x="${x}" y="${base - hM}" width="${w}" height="${hM}" rx="4" fill="var(--ball)"/>
      <rect x="${x + w + 4}" y="${base - hT}" width="${w}" height="${hT}" rx="4" fill="var(--taupe)" opacity=".7"/>
      <text x="${x + w}" y="${base + 16}" text-anchor="middle">R${r.round}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><line x1="${pad}" y1="${base}" x2="${W - pad}" y2="${base}" stroke="var(--line)"/>${bars}</svg>`;
}

function seasonStrip() {
  const t = todayISO();
  return DATA.draw.map((d) => {
    const r = resultForRound(d.round);
    let cls = "up", txt = String(d.round);
    if (r) { cls = r.res === "wo" ? "wo" : r.res; txt = r.res === "wo" ? "–" : r.res.toUpperCase(); }
    else if (d.date === t) { cls = "today"; }
    return `<div class="blk ${cls}">${txt}</div>`;
  }).join("");
}

/* ---------- views ---------- */
function insightLine() {
  const sorted = DATA.ladder.slice().sort((a, b) => a.pos - b.pos);
  const top = sorted[0], fourth = sorted[3];
  const level = sorted.find((t) => t.pos !== us.pos && t.pts === us.pts);
  let s = `<b>${us.pos}${ordinal(us.pos)}</b> on ${us.pts.toFixed(1)} points, ${(top.pts - us.pts).toFixed(1)} behind ${esc(top.team)}.`;
  if (level) s += ` Level with ${esc(level.team)} — they sit ${level.pos < us.pos ? "above" : "below"} you only on percentage (${pct(level.pct)}% v ${pct(us.pct)}%).`;
  s += ` Top four play finals; 4th is ${(us.pts - fourth.pts).toFixed(1)} points back.`;
  return s;
}

  return `
    <div class="hero">
      <svg class="courtlines" viewBox="0 0 400 260" preserveAspectRatio="none" aria-hidden="true">
        <g stroke="#fff8f0" stroke-width="1.2" fill="none">
          <rect x="30" y="26" width="340" height="208" rx="3"/>
          <line x1="30" y1="130" x2="370" y2="130"/>
          <line x1="120" y1="26" x2="120" y2="234"/>
          <line x1="280" y1="26" x2="280" y2="234"/>
          <line x1="120" y1="86" x2="280" y2="86"/>
          <line x1="120" y1="174" x2="280" y2="174"/>
        </g>
      </svg>
      <div class="rd">
        <span class="pill">Round ${nr.round}</span>
        <span>${fmtLong(nr.date)}</span>
        ${isToday ? `<span class="pill today">Today</span>` : ""}
      </div>
      <h2><small>${nr.opponent ? (nr.homeAway === "H" ? "Home vs" : "Away vs") : "Opponent"}</small>
        ${nr.opponent ? esc(nr.opponent) : "To be confirmed"}</h2>
      <div class="venue">${esc(venue)}</div>
      ${trioHTML}
    </div>

    <div class="kpis">
      <div class="kpi"><div class="n">${us.pos}<small>/${DATA.ladder.length}</small></div><div class="k">Ladder</div></div>
      <div class="kpi"><div class="n">${us.pts.toFixed(1)}</div><div class="k">Points</div></div>
      <div class="kpi"><div class="n">${setPct}<small>%</small></div><div class="k">Sets won</div></div>
    </div>

    <div class="card">
      <p class="label">Where you stand</p>
      <p class="caption" style="margin:0">${insightLine()}</p>

      <p class="label">Season so far</p>
      <div class="strip">${seasonStrip()}</div>
      <div class="legend"><span><i style="background:var(--ball)"></i>win</span><span><i style="background:var(--clay)"></i>loss</span><span><i style="background:var(--taupe)"></i>wash-out</span><span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>to come</span></div>
    </div>

    <div class="card">
      <p class="label">App and alerts</p>
      <div class="act">${installBlock()}</div>
      <div class="act" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft)">${alertsBlock()}</div>
    </div>`;
}

function viewTeam() {
  const sorted = DATA.ladder.slice().sort((a, b) => a.pos - b.pos);
  const top = sorted[0], second = sorted[1], fourth = sorted[3];
  const level = sorted.find((t) => t.pos !== us.pos && t.pts === us.pts);
  const gf = us.games_for, ga = us.games_against;
  const win36 = ((gf + 36) / (ga + 10)) * 100;

  const gapRow = (t, label) => {
    const diff = t.pts - us.pts;
    const d = t.isUs ? "you" : diff === 0 ? "level" : (diff > 0 ? `+${diff.toFixed(1)} ahead` : `${Math.abs(diff).toFixed(1)} behind`);
    return `<div class="gap ${t.isUs ? "us" : ""}">
      <span class="pos">${t.pos}</span>
      <span class="nm">${esc(t.team)}</span>
      <span class="d ${!t.isUs && diff < 0 ? "lead" : ""}">${d}</span></div>`;
  };

  const combos = {};
  roster.rounds.forEach((r) => {
    if ((r.in || []).length !== 3) return;
    const key = r.in.slice().sort().join(" · ");
    const res = resultForRound(r.round);
    const c = combos[key] || (combos[key] = { played: 0, wins: 0, rounds: [] });
    c.rounds.push(r.round);
    if (res && res.res !== "wo") { c.played++; if (res.res === "w") c.wins++; }
  });
  const comboRows = Object.entries(combos)
    .sort((a, b) => b[1].rounds.length - a[1].rounds.length)
    .map(([k, v]) => {
      const rec = v.played ? `${v.wins}W–${v.played - v.wins}L` : "—";
      return `<div class="srow"><span class="k">${esc(k)}</span><span class="v" style="font-size:14px">${rec} <small>· ${v.rounds.length} rd${v.rounds.length === 1 ? "" : "s"}</small></span></div>`;
    }).join("");

  return `
    <div class="card">
      <p class="label">Sets won</p>
      <div style="display:flex;justify-content:center;padding:8px 0 4px">
        ${ring(setPct, 100, setPct + "%", "sets won")}
      </div>
      <p class="caption">${teamSetsFor} sets won, ${teamSetsAgainst} lost across ${completedRounds.length} completed rounds.</p>
    </div>

    <div class="card">
      <p class="label">How the team is going</p>
      <div class="srow"><span class="k">Points per round</span><span class="v">${pointsPerRound} <small>of 8</small></span></div>
      <div class="srow"><span class="k">Rounds won</span><span class="v">${completedRounds.filter((r) => r.res === "w").length}<small>/${completedRounds.length}</small></span></div>
      <div class="srow"><span class="k">Sets won</span><span class="v">${teamSetsFor}<small>/${teamSetsFor + teamSetsAgainst} · ${setPct}%</small></span></div>
      <div class="srow"><span class="k">Games won</span><span class="v">${us.games_for}<small>/${us.games_for + us.games_against} · ${gamePct}%</small></span></div>
      <p class="caption">The ladder's own percentage is games won divided by games lost — kept in Season for the official standings.</p>
    </div>

    <div class="card">
      <p class="label">Gap to the finals line</p>
      ${gapRow(top)}
      ${second && second.pos !== us.pos ? gapRow(second) : ""}
      ${gapRow(us)}
      ${gapRow(fourth)}
      <p class="caption">${level ? `Level on points with ${esc(level.team)} — percentage is the only thing separating you.` : "Top four play finals."}</p>
    </div>

    <div class="card">
      <p class="label">Points by round</p>
      ${pointsChart()}
      <div class="legend"><span><i style="background:var(--clay)"></i>earned</span><span><i style="background:var(--clay);opacity:.35"></i>wash-out (4)</span><span><i style="background:var(--clay)"></i>running total</span></div>
      <p class="caption">A wash-out still banks four points — that is why round 3 is not a blank.</p>
    </div>

    <div class="card">
      <p class="label">Games for and against</p>
      ${gamesChart()}
      <div class="legend"><span><i style="background:var(--ball)"></i>East Malvern</span><span><i style="background:var(--taupe)"></i>opponent</span></div>
      <p class="caption">Every game counts towards the ladder percentage, even after the match is decided.</p>
    </div>

    <div class="card">
      <p class="label">What a win does</p>
      <p class="caption" style="margin:0">A 6–0 next round lifts your ladder percentage to <b>${pct(win36)}%</b>${level ? `, clear of ${esc(level.team)} on ${pct(level.pct)}%` : ""}.</p>
    </div>

    <div class="card">
      <p class="label">Which three</p>
      ${comboRows}
      <p class="caption">Triples needs three on court — these are the combinations named so far.</p>
    </div>`;
}

function viewSquad() {
  const ranked = squad.slice().sort((a, b) => {
    const A = a.line, B = b.line;
    if (!A && !B) return a.rank - b.rank;
    if (!A) return 1;
    if (!B) return -1;
    return (B.set_pct || 0) - (A.set_pct || 0) || B.sets_won - A.sets_won;
  });

  const ladderRows = ranked.map((p, i) => {
    const L = p.line;
    const sets = L ? `${L.sets_won}–${L.sets_lost}` : "—";
    const games = L ? `${L.games_won}–${L.games_lost}` : "—";
    const pctv = L && L.set_pct != null ? L.set_pct + "%" : "—";
    return `<tr>
      <td style="text-align:left">${i + 1}</td>
      <td style="text-align:left;${i === 0 && L ? "font-weight:700;color:var(--clay)" : ""}">${esc(first(p.name))}</td>
      <td>${L ? L.rubbers : "—"}</td><td>${sets}</td><td>${games}</td><td>${pctv}</td>
    </tr>`;
  }).join("");

  const cards = squad.map((s) => {
    const nr = nextRound();
    const planned = planFor(first(s.name), nr.round);
    const override = overrideFor(first(s.name), nr.round);
    const shown = override || planned;
    const label = { in: "In", out: "Out", un: "Unavailable", none: "—", maybe: "Maybe" }[shown] || "—";
    const L = s.line;
    const pctShown = L && L.set_pct != null ? Math.round(L.set_pct) : 0;

    const stats = L ? `
      <div class="pstats">
        <div class="row"><span class="k">Sets</span><span class="v">${L.sets_won}–${L.sets_lost}</span></div>
        <div class="row"><span class="k">Games</span><span class="v">${L.games_won}–${L.games_lost}</span></div>
        <div class="row"><span class="k">Singles</span><span class="v">${L.singlesWon}–${L.singlesPlayed - L.singlesWon}</span></div>
        <div class="row"><span class="k">Doubles</span><span class="v">${L.doublesWon}–${L.doublesPlayed - L.doublesWon}</span></div>
      </div>` : `
      <div class="pstats">
        <div class="row"><span class="k">Rubbers</span><span class="v">—</span></div>
        <div class="row"><span class="k">Scheduled</span><span class="v">${s.inCount}/${s.scheduled}</span></div>
      </div>`;

    return `<div class="pcard">
      <div class="top">
        <span class="rank">${s.rank}</span>
        <div>
          <div class="nm">${esc(s.name)}</div>
          <div class="role">${L ? `${L.rubbers} rubbers played` : "No rubbers yet"}</div>
        </div>
      </div>

      <div class="pgrid">
        <div style="text-align:center">${L ? ring(pctShown, 100, pctShown + "%", "sets won") : ring(0, 100, "—", "no rubbers")}</div>
        ${stats}
      </div>

      <div class="pnext">
        <span class="txt">R${nr.round} · ${fmtDate(nr.date)}: <b>${label}</b>${override && override !== planned ? " (changed)" : ""}</span>
        <span class="seg">
          <button data-p="${esc(first(s.name))}" data-s="in" data-on="${shown === "in" ? "in" : ""}">In</button>
          <button data-p="${esc(first(s.name))}" data-s="maybe" data-on="${shown === "maybe" ? "maybe" : ""}">?</button>
          <button data-p="${esc(first(s.name))}" data-s="out" data-on="${shown === "out" || shown === "un" ? "out" : ""}">Out</button>
        </span>
      </div>
    </div>`;
  }).join("");

  const rounds = roster.rounds;
  const head = rounds.map((r) => `<th>${r.round}</th>`).join("");
  const body = (roster.players || []).map((p) => {
    const cells = rounds.map((r) => {
      const st = planFor(first(p.name), r.round);
      return `<td><span class="dot ${st === "in" ? "in" : st === "out" ? "out" : st === "un" ? "un" : "none"}"></span></td>`;
    }).join("");
    return `<tr><td>${esc(first(p.name))}</td>${cells}</tr>`;
  }).join("");

  return `
    <div class="card">
      <p class="label">Player ladder</p>
      <div class="tblwrap"><table style="font-size:13.5px">
        <thead><tr><th style="text-align:left">#</th><th style="text-align:left">Player</th><th>Rub</th><th>Sets</th><th>Games</th><th>Set %</th></tr></thead>
        <tbody>${ladderRows}</tbody></table></div>
      <p class="caption">From the official rubbers on TROLS — every player plays one singles and two doubles each round.</p>
    </div>
    ${cards}
    <div class="card">
      <p class="label">Season availability</p>
      <div class="tblwrap"><table class="matrix"><thead><tr><th></th>${head}</tr></thead><tbody>${body}</tbody></table></div>
      <div class="legend"><span><i class="dot in" style="border-radius:50%"></i>in</span><span><i class="dot out" style="border-radius:50%"></i>out</span><span><i class="dot un" style="border-radius:50%"></i>unavailable</span></div>
      <p class="caption">Tap In / ? / Out on a card to change the next round — saved on this phone only.</p>
    </div>`;
}

function viewSeason() {
  const seg = seasonTab;
  const body = seg === "ladder" ? ladderView() : seg === "results" ? resultsView() : drawView();
  return `<div class="seg-top" role="tablist">
      <button data-season="ladder" aria-selected="${seg === "ladder"}">Ladder</button>
      <button data-season="results" aria-selected="${seg === "results"}">Results</button>
      <button data-season="draw" aria-selected="${seg === "draw"}">Draw</button>
    </div>${body}`;
}

function ladderView() {
  const rows = DATA.ladder.map((t) => `
    <tr style="${t.isUs ? "background:var(--clay-wash)" : ""}">
      <td style="text-align:left">${t.pos}</td>
      <td style="text-align:left;${t.isUs ? "font-weight:700;color:var(--clay)" : ""}">${esc(t.team)}</td>
      <td>${t.played}</td><td>${t.pts.toFixed(1)}</td><td>${pct(t.pct)}</td>
    </tr>`).join("");
  return `<div class="card">
    <p class="label">Official ladder · after round 3</p>
    <div class="tblwrap"><table style="font-size:14px">
      <thead><tr><th style="text-align:left">#</th><th style="text-align:left">Team</th><th>P</th><th>Pts</th><th>%</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="caption">Points decide the ladder; percentage is games won ÷ games lost. Wash-outs pay 4 points each. Top four play finals.</p>
  </div>`;
}

function resultsView() {
  const blocks = DATA.results.map((r) => {
    const rows = r.matches.map((m) => {
      const ours = m.home === CLUB || m.away === CLUB;
      if (m.washout) return `<div class="mt ${ours ? "ours" : ""}"><span class="nm">${esc(m.home)}</span><span class="sc">wash out</span><span class="nm r">${esc(m.away)}</span></div>`;
      const hWin = m.homePts > m.awayPts;
      return `<div class="mt ${ours ? "ours" : ""}">
        <span class="nm" style="${hWin ? "font-weight:700" : ""}">${esc(m.home)}</span>
        <span class="sc">${m.homePts.toFixed(0)}–${m.awayPts.toFixed(0)} · ${m.homeGames}–${m.awayGames}</span>
        <span class="nm r" style="${!hWin ? "font-weight:700" : ""}">${esc(m.away)}</span></div>`;
    }).join("");
    return `<div class="rnd"><div class="rnd-h"><b>Round ${r.round}</b><span>${fmtLong(r.date)}</span></div>${rows}</div>`;
  }).join("");
  return `<div class="card"><p class="label">Round by round</p>${blocks}
    <p class="caption">Score reads points then games.</p></div>`;
}

function drawView() {
  const t = todayISO();
  const items = DATA.draw.map((d) => {
    const past = d.date < t, isToday = d.date === t;
    const rr = rosterRound(d.round);
    const trio = rr ? (rr.in || []).map(first).join(", ") : "";
    const who = d.opponent ? `${d.homeAway === "H" ? "vs" : "at"} ${esc(d.opponent)}` : "Opponent TBC";
    return `<li class="${past ? "past" : ""} ${isToday ? "today" : ""}">
      <span class="rn">${d.round}</span>
      <span class="who">${who}<small>${fmtDate(d.date)}${d.homeAway ? " · " + (d.homeAway === "H" ? "home" : "away") : ""}${trio ? " · " + esc(trio) : ""}</small></span>
      <span class="res">${d.result ? esc(d.result) : ""}</span></li>`;
  }).join("");
  const finals = DATA.finals.map((f) => `<li><span class="rn">—</span><span class="who">${esc(f.label)}<small>${fmtDate(f.date)}</small></span><span class="res"></span></li>`).join("");
  return `<div class="card"><p class="label">Season draw</p><ul class="tl">${items}${finals}</ul></div>`;
}

function viewClubs() {
  const order = [CLUB].concat(DATA.clubs.filter((c) => c.name !== CLUB).map((c) => c.name));
  const cards = order.map((name) => {
    const c = clubByName(name);
    if (!c) return "";
    return `<div class="club">
      <div class="cn">${esc(c.name)}${c.isUs ? `<span class="tag">us</span>` : ""}</div>
      <div class="vd">${esc(c.venue)} · Melway ${esc(c.melway)}</div>
      <div class="ct">${esc(c.contact)} · <a href="tel:${esc(c.phone.replace(/\s/g, ""))}">${esc(c.phone)}</a></div>
    </div>`;
  }).join("");
  return `<div class="card"><p class="label">The section</p>${cards}</div>`;
}

/* ---------- app install + alerts ---------- */
const NOTIFY_KEY = "em-gb1-notify-v1";
const SIG_KEY = "em-gb1-sig-v1";
let deferredPrompt = null;
let swReg = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredPrompt = e; });

function isStandalone() {
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
}
function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function alertsOn() { return ("Notification" in window) && Notification.permission === "granted" && localStorage.getItem(NOTIFY_KEY) === "1"; }

function installBlock() {
  if (isStandalone()) {
    return `<span class="txt"><b>Installed</b>You're using the app version — full screen, no browser bars.</span>
      <button class="btn ghost" disabled>Installed</button>`;
  }
  const hint = isIOS() ? "Tap Share, then <b>Add to Home Screen</b>." : "Tap Install, or use the browser menu → Add to Home screen.";
  return `<span class="txt"><b>Open it as an app</b>${hint}</span>
    <button class="btn" id="installBtn">${isIOS() ? "How" : "Install"}</button>`;
}

function alertsBlock() {
  if (!("Notification" in window)) return `<span class="txt"><b>Alerts</b>This browser can't show notifications.</span>`;
  if (Notification.permission === "denied") return `<span class="txt"><b>Alerts blocked</b>Notifications are turned off for this site in your browser settings.</span>`;
  if (alertsOn()) return `<span class="txt"><b>Alerts on</b>Results posted, ladder changes and fixture moves.</span>
      <button class="btn ghost" id="alertsOff">Turn off</button>`;
  return `<span class="txt"><b>Alerts</b>Get told when results are posted, the ladder moves or the fixture changes.</span>
    <button class="btn" id="alertsOn">Turn on</button>`;
}

async function enableAlerts() {
  try {
    const perm = await Notification.requestPermission();
    if (perm === "granted") {
      localStorage.setItem(NOTIFY_KEY, "1");
      const reg = swReg || (navigator.serviceWorker && await navigator.serviceWorker.ready);
      if (reg) {
        if (reg.active) reg.active.postMessage({ type: "check" });
        reg.showNotification(APP_NAME + " alerts on", {
          body: "We'll tell you when results, the ladder or the fixture change.",
          icon: "icon-192.png", badge: "icon-192.png", tag: "gb1-welcome",
        });
      }
    }
  } catch (e) {}
  renderAll();
}

async function initApp() {
  if (!("serviceWorker" in navigator)) return;
  try {
    swReg = await navigator.serviceWorker.register("sw.js", { scope: "./" });
    if (navigator.periodicSync) {
      try { await navigator.periodicSync.register("check-updates", { minInterval: 12 * 60 * 60 * 1000 }); } catch (e) {}
    }
  } catch (e) {}
}

function sigOf(d) {
  const draw = (d.draw || []).map((x) => x.opponent || "-").join(",");
  return [d.meta.ladder_loaded, d.results.length, draw].join("|");
}

async function noteUpdate(fresh) {
  const prev = localStorage.getItem(SIG_KEY);
  localStorage.setItem(SIG_KEY, sigOf(fresh));
  if (!prev || prev === sigOf(fresh) || !alertsOn()) return;
  const [prevLoad, prevRounds] = prev.split("|");
  const latest = (fresh.results || [])[0];
  let body = "Ladder updated";
  if (prevRounds !== String(fresh.results.length) && latest) body = `Round ${latest.round} results are in`;
  else if (prevLoad === String(fresh.meta.ladder_loaded)) body = "Fixture updated";
  try {
    const reg = swReg || await navigator.serviceWorker.ready;
    reg.showNotification(APP_NAME, { body, icon: "icon-192.png", badge: "icon-192.png", tag: "gb1-update" });
  } catch (e) {}
}

/* ---------- state ---------- */
let seasonTab = "ladder";
const STORE = "em-gb1-avail-v2";
const loadOverrides = () => { try { return JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (e) { return {}; } };
const saveOverrides = (o) => { try { localStorage.setItem(STORE, JSON.stringify(o)); } catch (e) {} };
let overrides = loadOverrides();
const overrideFor = (f, round) => (overrides[round] || {})[f] || null;

function bind() {
  const squadView = $("#view-squad");
  squadView.querySelectorAll(".seg button").forEach((b) => {
    b.onclick = () => {
      const r = nextRound().round;
      overrides[r] = overrides[r] || {};
      overrides[r][b.dataset.p] = b.dataset.s;
      saveOverrides(overrides);
      renderAll();
    };
  });
  $("#view-season").querySelectorAll(".seg-top button").forEach((b) => {
    b.onclick = () => { seasonTab = b.dataset.season; $("#view-season").innerHTML = viewSeason(); bind(); };
  });
  const ib = $("#installBtn");
  if (ib) ib.onclick = async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      try { await deferredPrompt.userChoice; } catch (e) {}
      deferredPrompt = null;
      renderAll();
    } else if (isIOS()) {
      alert('On iPhone: tap Share, then "Add to Home Screen".');
    } else {
      alert('Open the browser menu and choose "Add to Home screen".');
    }
  };
  const on = $("#alertsOn"); if (on) on.onclick = enableAlerts;
  const off = $("#alertsOff"); if (off) off.onclick = () => { localStorage.setItem(NOTIFY_KEY, "0"); renderAll(); };
}

function renderAll() {
  $("#mastheadSub").textContent = `${DATA.meta.competition} · ${DATA.meta.section.replace(/^Open Triples /, "")}`;
  $("#syncWhen").textContent = DATA.meta.ladder_loaded.replace(/, .*/, "");
  $("#view-week").innerHTML = viewWeek();
  $("#view-team").innerHTML = viewTeam();
  $("#view-squad").innerHTML = viewSquad();
  $("#view-season").innerHTML = viewSeason();
  $("#view-clubs").innerHTML = viewClubs();
  bind();
  $("#foot").innerHTML = `
    ${APP_NAME} · ${esc(DATA.meta.section)} · ${esc(DATA.meta.competition)} ${esc(DATA.meta.season)} · Waverley District Tennis Association<br>
    Ladder, results, rubbers and fixture from <a href="${esc(DATA.meta.source_ladder)}" target="_blank" rel="noopener">TROLS</a>.
    Roster from the team sheet. Snapshot ${esc(DATA.meta.ladder_loaded)}.<br>
    Unofficial team tool — check TROLS or your club before a match.`;
}

function showTab(name) {
  const btn = document.querySelector('.tabs button[data-view="' + name + '"]');
  if (!btn) return;
  document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", "false"));
  btn.setAttribute("aria-selected", "true");
  document.querySelectorAll(".view").forEach((v) => v.classList.remove("on"));
  const view = $("#view-" + name);
  if (view) view.classList.add("on");
}
document.querySelectorAll(".tabs button").forEach((b) => {
  b.onclick = () => {
    showTab(b.dataset.view);
    if (history.replaceState) history.replaceState(null, "", "#" + b.dataset.view);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
});

renderAll();
if (location.hash) showTab(location.hash.slice(1));
initApp();

fetch("data.json?t=" + Date.now(), { cache: "no-store" })
  .then((r) => (r.ok ? r.json() : null))
  .then((fresh) => {
    if (!fresh || !fresh.meta || fresh.meta.ladder_loaded === DATA.meta.ladder_loaded) return;
    noteUpdate(fresh);
    Object.assign(DATA, fresh);
    if (fresh.roster) Object.assign(roster, fresh.roster);
    $("#syncState").textContent = "updated";
    renderAll();
  })
  .catch(() => {})
  .finally(() => { if (!localStorage.getItem(SIG_KEY)) localStorage.setItem(SIG_KEY, sigOf(DATA)); });
</script>
</body>
</html>
