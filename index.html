const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CLUB = DATA.meta.club;
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function parseDate(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d, 12, 0, 0); }
function fmtDate(iso) { const d = parseDate(iso); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function fmtLong(iso) { const d = parseDate(iso); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function todayISO() { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}-${String(n.getDate()).padStart(2, "0")}`; }
function pct(n) { return n.toFixed(2).replace(/\.00$/, ".0"); }

const us = DATA.ladder.find((t) => t.isUs);
const roster = DATA.roster || { players: [], rounds: [], team_order: [] };
const first = (n) => String(n).split(" ")[0];

function resultsFor(team) {
  const out = [];
  DATA.results.forEach((r) => {
    r.matches.forEach((m) => {
      if (m.home !== team && m.away !== team) return;
      const home = m.home === team;
      let res;
      if (m.washout) res = "wo";
      else {
        const mine = home ? m.homePts : m.awayPts;
        const theirs = home ? m.awayPts : m.homePts;
        res = mine > theirs ? "w" : mine < theirs ? "l" : "d";
      }
      out.push({ round: r.round, date: r.date, res, home, opp: home ? m.away : m.home, m });
    });
  });
  return out.sort((a, b) => b.round - a.round);
}
const ourResults = resultsFor(CLUB);
const resultForRound = (n) => ourResults.find((r) => r.round === n) || null;
const form = ourResults.filter((r) => r.res !== "wo").slice(0, 4);

function nextRound() {
  const t = todayISO();
  const upcoming = DATA.draw.filter((d) => d.date >= t);
  return upcoming.length ? upcoming[0] : DATA.draw[DATA.draw.length - 1];
}
function clubByName(name) { return DATA.clubs.find((c) => c.name === name) || null; }

/* ---------- roster maths ---------- */
function rosterRound(n) { return roster.rounds.find((r) => r.round === n) || null; }
function planFor(firstName, n) {
  const r = rosterRound(n);
  if (!r) return "none";
  if ((r.in || []).includes(firstName)) return "in";
  if ((r.unavailable || []).includes(firstName)) return "un";
  if ((r.out || []).includes(firstName)) return "out";
  return "none";
}
function playerStats(p) {
  const f = first(p.name);
  const inR = [], outR = [], unR = [];
  roster.rounds.forEach((r) => {
    if ((r.in || []).includes(f)) inR.push(r.round);
    else if ((r.unavailable || []).includes(f)) unR.push(r.round);
    else if ((r.out || []).includes(f)) outR.push(r.round);
  });
  const completed = inR.filter((n) => { const x = resultForRound(n); return x && x.res !== "wo"; });
  const wins = completed.filter((n) => resultForRound(n).res === "w").length;
  const washouts = inR.filter((n) => { const x = resultForRound(n); return x && x.res === "wo"; }).length;

  const partners = {};
  roster.rounds.forEach((r) => {
    if (!(r.in || []).includes(f)) return;
    (r.in || []).forEach((o) => { if (o !== f) partners[o] = (partners[o] || 0) + 1; });
  });
  const topPartners = Object.entries(partners).sort((a, b) => b[1] - a[1]).slice(0, 2);

  const total = roster.rounds.length || 1;
  return {
    name: p.name, rank: p.rank, parent: p.parent, phone: p.phone,
    inCount: inR.length, outCount: outR.length, unCount: unR.length,
    scheduled: total, completed: completed.length, wins, washouts,
    inPct: (inR.length / total) * 100, outPct: (outR.length / total) * 100, unPct: (unR.length / total) * 100,
    partners: topPartners,
  };
}
const playerStatsAll = (roster.players || []).map(playerStats).sort((a, b) => a.rank - b.rank);

/* ---------- charts ---------- */
function pointsChart() {
  const rounds = ourResults.slice().sort((a, b) => a.round - b.round);
  if (!rounds.length) return "";
  const W = 320, H = 130, pad = 26, bw = (W - pad * 2) / rounds.length;
  let cum = 0;
  const bars = rounds.map((r, i) => {
    const pts = r.m.washout ? 4 : (r.m.home === CLUB ? r.m.homePts : r.m.awayPts);
    cum += pts;
    const h = (pts / 8) * (H - 40);
    const x = pad + i * bw + bw * 0.18, w = bw * 0.64;
    return `<rect x="${x}" y="${H - 22 - h}" width="${w}" height="${h}" rx="2" fill="var(--court)" opacity="${r.res === "wo" ? 0.4 : 0.9}"/>
      <text x="${x + w / 2}" y="${H - 26 - h}" text-anchor="middle">${pts.toFixed(0)}</text>
      <text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">R${r.round}</text>
      <text x="${x + w / 2}" y="${H - 46 - h}" text-anchor="middle" style="fill:var(--ink-dim)">${cum.toFixed(0)}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Points earned per round">
    <line x1="${pad}" y1="${H - 22}" x2="${W - pad}" y2="${H - 22}" stroke="var(--line)"/>${bars}</svg>`;
}

function gamesChart() {
  const rounds = ourResults.slice().sort((a, b) => a.round - b.round).filter((r) => r.res !== "wo");
  if (!rounds.length) return "";
  const W = 320, H = 120, pad = 22, maxG = Math.max(...rounds.map((r) => Math.max(r.m.homeGames, r.m.awayGames)), 36);
  const bw = (W - pad * 2) / rounds.length;
  const bars = rounds.map((r, i) => {
    const mine = r.m.home === CLUB ? r.m.homeGames : r.m.awayGames;
    const theirs = r.m.home === CLUB ? r.m.awayGames : r.m.homeGames;
    const hM = (mine / maxG) * (H - 40), hT = (theirs / maxG) * (H - 40);
    const x = pad + i * bw + bw * 0.15, w = bw * 0.32;
    return `<rect x="${x}" y="${H - 22 - hM}" width="${w}" height="${hM}" rx="2" fill="var(--court)"/>
      <rect x="${x + w + 3}" y="${H - 22 - hT}" width="${w}" height="${hT}" rx="2" fill="var(--clay)" opacity=".65"/>
      <text x="${x + w}" y="${H - 8}" text-anchor="middle">R${r.round}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Games for and against per round">
    <line x1="${pad}" y1="${H - 22}" x2="${W - pad}" y2="${H - 22}" stroke="var(--line)"/>${bars}</svg>`;
}

function insightLine() {
  const sorted = DATA.ladder.slice().sort((a, b) => a.pos - b.pos);
  const above = sorted.filter((t) => t.pos < us.pos);
  const below = sorted.filter((t) => t.pos > us.pos);
  const top = sorted[0];
  const fourth = sorted[3];
  const gapTop = (top.pts - us.pts).toFixed(1);
  const sameAs = sorted.find((t) => t.pos !== us.pos && t.pts === us.pts);
  let s = `You are ${us.pos}${ordinal(us.pos)} on ${us.pts.toFixed(1)} points, ${gapTop} behind ${esc(top.team)}.`;
  if (sameAs) s += ` ${esc(sameAs.team)} sit ${sameAs.pos === us.pos - 1 ? "above" : "below"} you on the same points — percentage decides it (${pct(sameAs.pct)}% v ${pct(us.pct)}%).`;
  s += ` Top four play finals; ${esc(fourth.team)} in 4th are ${(us.pts - fourth.pts).toFixed(1)} points back.`;
  return s;
}
function ordinal(n) { return ["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n] || "th"; }

function viewTeam() {
  const sorted = DATA.ladder.slice().sort((a, b) => a.pos - b.pos);
  const top = sorted[0], fourth = sorted[3];
  const sameAs = sorted.find((t) => t.pos !== us.pos && t.pts === us.pts);
  const gf = us.games_for, ga = us.games_against;

  // what a 6-0 win would do to the percentage
  const win36 = ((gf + 36) / (ga + 10)) * 100;
  const win30 = ((gf + 30) / (ga + 18)) * 100;
  const passLine = sameAs ? sameAs.pct : null;

  const combos = {};
  roster.rounds.forEach((r) => {
    if ((r.in || []).length !== 3) return;
    const key = r.in.slice().sort().join(" · ");
    const res = resultForRound(r.round);
    const c = combos[key] || (combos[key] = { played: 0, wins: 0, rounds: [] });
    c.rounds.push(r.round);
    if (res && res.res !== "wo") { c.played++; if (res.res === "w") c.wins++; }
  });
  const comboRows = Object.entries(combos).map(([k, v]) => {
    const played = v.played ? `${v.wins}W–${v.played - v.wins}L` : "not yet played";
    return `<tr><td class="team">${esc(k)}</td><td>${v.rounds.join(", ")}</td><td>${played}</td></tr>`;
  }).join("");

  return `
    <div class="card">
      <p class="label">Finals race</p>
      <p class="note" style="margin:0 0 12px">${insightLine()}</p>
      <div class="tblwrap"><table>
        <thead><tr><th>#</th><th>Team</th><th>Pts</th><th>%</th></tr></thead>
        <tbody>${sorted.slice(0, 4).map((t) => `<tr class="${t.isUs ? "us" : ""}">
          <td><span class="pos">${t.pos}</span></td><td class="team">${esc(t.team)}</td>
          <td>${t.pts.toFixed(1)}</td><td>${pct(t.pct)}</td></tr>`).join("")}</tbody>
      </table></div>
      <p class="note" style="margin:12px 0 0">${us.pos <= 4 ? "You are inside the four." : "You are outside the four."}
      Semis ${esc(fmtDate("2027-03-14"))}, grand final ${esc(fmtDate("2027-03-21"))}.</p>
    </div>

    <div class="card">
      <p class="label">Points by round</p>
      ${pointsChart()}
      <div class="legend"><span><i style="background:var(--court)"></i>points earned</span><span><i style="background:var(--ink-dim)"></i>running total</span></div>
      <p class="note" style="margin:10px 0 0">A wash-out still banks 4 points (shown faded) — that is why round 3 looks like a result.</p>
    </div>

    <div class="card">
      <p class="label">Games for and against</p>
      ${gamesChart()}
      <div class="legend"><span><i style="background:var(--court)"></i>East Malvern</span><span><i style="background:var(--clay)"></i>opponent</span></div>
      <p class="note" style="margin:10px 0 0">Percentage is games won divided by games lost, so every game in a dead rubber still counts.</p>
    </div>

    <div class="card">
      <p class="label">What it takes</p>
      <p class="note" style="margin:0">
        A 6–0 win next round (36–10 on games) lifts you to <b>${pct(win36)}%</b>;

        ${passLine ? `MCC Glen Iris sit on ${pct(passLine)}%, so a clean win clears them on percentage as well as points.` : ""}

      <p class="note" style="margin:12px 0 0">Triples needs three on court. Combinations with a clean record are worth keeping together.</p>

    const partners = s.partners.map(([n, c]) => `${n} ×${c}`).join(" · ") || "—";

    return `<div class="pcard">
      <div class="top">
        <span class="rank">${s.rank}</span>
        <div>
          <div class="nm">${esc(s.name)}${isCaptain ? `<span class="capt">captain</span>` : ""}</div>
          <div class="role">${esc(p.parent || "")}${p.phone ? " · " + esc(p.phone) : ""}</div>
        </div>
      </div>

      <div class="prow">
        <div><div class="v">${s.inCount}<span style="font-size:12px;color:var(--ink-dim)">/${s.scheduled}</span></div><div class="k">Scheduled in</div></div>
        <div><div class="v">${s.wins}–${Math.max(0, s.completed - s.wins)}</div><div class="k">Team record</div></div>
        <div><div class="v">${Math.round(s.inPct)}<span style="font-size:12px;color:var(--ink-dim)">%</span></div><div class="k">Availability</div></div>
      </div>

      <div class="avail">
        <i style="width:${s.inPct}%;background:var(--court)"></i>
        <i style="width:${s.outPct}%;background:var(--clay)"></i>
        <i style="width:${s.unPct}%;background:var(--gold)"></i>
      </div>

      <p class="note" style="margin:9px 0 0">
        ${s.completed} completed round${s.completed === 1 ? "" : "s"}${s.washouts ? `, ${s.washouts} washed out` : ""} ·
        ${s.outCount} out · ${s.unCount} unavailable ·
        most often with ${esc(partners)}
      </p>

      <div class="next">
        <span class="note" style="margin:0">R${nr.round} ${fmtDate(nr.date)}: <b>${label}</b>${override && override !== planned ? " (changed)" : ""}</span>
        <span class="seg">
          <button data-p="${esc(first(s.name))}" data-s="in" data-on="${shown === "in" ? "in" : ""}">In</button>
          <button data-p="${esc(first(s.name))}" data-s="maybe" data-on="${shown === "maybe" ? "maybe" : ""}">?</button>
          <button data-p="${esc(first(s.name))}" data-s="out" data-on="${shown === "out" || shown === "un" ? "out" : ""}">Out</button>
        </span>
      </div>
    </div>`;
  }).join("");

  const rounds = roster.rounds;
  const head = rounds.map((r) => `<th>R${r.round}</th>`).join("");
  const body = (roster.players || []).map((p) => {
    const cells = rounds.map((r) => {
      const st = planFor(first(p.name), r.round);
      return `<td><span class="dot ${st === "in" ? "in" : st === "out" ? "out" : st === "un" ? "un" : "none"}"></span></td>`;
    }).join("");
    return `<tr><td>${esc(first(p.name))}</td>${cells}</tr>`;
  }).join("");

  return `
    <div class="card">
      <p class="label">Squad · captain ${esc(roster.captain || "—")}</p>
      <p class="note" style="margin:0 0 12px">Team order: ${(roster.team_order || []).map((n, i) => `${i + 1}. ${esc(n)}`).join(" · ")}</p>
      <div class="tblwrap">
        <table class="matrix">
          <thead><tr><th></th>${head}</tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
      <div class="legend">
        <span><i class="dot in" style="border-radius:50%"></i>in</span>
        <span><i class="dot out" style="border-radius:50%"></i>out</span>
        <span><i class="dot un" style="border-radius:50%"></i>unavailable</span>
      </div>
      <p class="note" style="margin:12px 0 0">Straight from Dave's roster sheet. Tap In / ? / Out on a card to record a change for the next round — it saves on this phone only.</p>
    </div>
    ${cards}
    <div class="card">
      <p class="label">What the numbers can and can't say</p>
      <p class="note" style="margin:0">
        TROLS publishes team scores only — the individual rubber-by-rubber detail sits behind a pop-up that isn't publicly readable, so there is no per-player win/loss record to show.
        "Team record" above is how the side went in the rounds that player was on court, which is the honest version.
        Record the rubbers on the scoresheet on the day and this becomes a real individual ladder next season.
      </p>
    </div>`;
}

function viewLadder() {
  const max = Math.max(...DATA.ladder.map((t) => t.pct));
  const rows = DATA.ladder.map((t) => `
    <tr class="${t.isUs ? "us" : ""}">
      <td><span class="pos">${t.pos}</span></td>
      <td class="team">${esc(t.team)}</td>
      <td>${t.played}</td><td>${t.won}</td><td>${t.lost}</td>
      <td>${t.sets_for}–${t.sets_against}</td>
      <td>${t.pts.toFixed(1)}</td>
      <td style="min-width:74px">${pct(t.pct)}<div class="pctbar"><i style="width:${Math.max(3, (t.pct / max) * 100)}%"></i></div></td>
    </tr>`).join("");
  return `<div class="card">
    <p class="label">Open Triples Green Ball 1 · after round 3</p>
    <div class="tblwrap"><table>
      <thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>L</th><th>Sets</th><th>Pts</th><th>%</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <p class="note" style="margin:13px 0 0">Points decide the ladder; percentage is games won divided by games lost. A wash-out pays each team 4 points. Top four play finals.</p>
  </div>`;
}

function viewResults() {
  const blocks = DATA.results.map((r) => {
    const rows = r.matches.map((m) => {
      const ours = m.home === CLUB || m.away === CLUB;
      if (m.washout) return `<div class="match ${ours ? "ours" : ""}"><div class="h">${esc(m.home)}</div><div class="sc">wash out</div><div class="a">${esc(m.away)}</div></div>`;
      const hWin = m.homePts > m.awayPts;
      return `<div class="match ${ours ? "ours" : ""}">
        <div class="h ${hWin ? "win" : ""}">${esc(m.home)}</div>
        <div class="sc">${m.homePts.toFixed(1)} · ${m.homeSets}s · ${m.homeGames}g – ${m.awayPts.toFixed(1)} · ${m.awaySets}s · ${m.awayGames}g</div>
        <div class="a ${!hWin ? "win" : ""}">${esc(m.away)}</div></div>`;
    }).join("");
    return `<div class="round">
      <div class="round-h"><b>Round ${r.round}</b><span>${fmtLong(r.date)}</span>${r.washout ? `<span class="chip wo">wash out</span>` : ""}</div>
      ${rows}</div>`;
  }).join("");
  return `<div class="card">
    <p class="label">Round by round · loaded ${esc(DATA.meta.results_loaded)}</p>
    ${blocks}
    <p class="note" style="margin:13px 0 0">Scores read points · sets · games. East Malvern's matches are highlighted.</p>
  </div>`;
}

function viewDraw() {
  const t = todayISO();
  const items = DATA.draw.map((d) => {
    const past = d.date < t, isToday = d.date === t;
    const cls = [past ? "past" : "", isToday ? "today" : ""].filter(Boolean).join(" ");
    const rr = rosterRound(d.round);
    const trio = rr ? (rr.in || []).join(", ") : "";
    const who = d.opponent ? `${d.homeAway === "H" ? "vs" : "at"} ${esc(d.opponent)}` : "Opponent to be confirmed";
    return `<li class="${cls}">
      <span class="rn">R${d.round}</span>
      <span class="who">${who}<small>${fmtDate(d.date)}${d.homeAway ? " · " + (d.homeAway === "H" ? "home" : "away") : ""}${trio ? " · " + esc(trio) : ""}</small></span>
      <span class="res">${d.result ? esc(d.result) : (isToday ? "today" : "")}</span>
    </li>`;
  }).join("");
  const finals = DATA.finals.map((f) => `<li><span class="rn">—</span><span class="who">${esc(f.label)}<small>${fmtDate(f.date)}</small></span><span class="res"></span></li>`).join("");
  return `<div class="card">
    <p class="label">Season draw · Sunday AM Summer 26/27</p>
    <ul class="draw">${items}${finals}</ul>
    <p class="note" style="margin:13px 0 0">Dates and opponents come from the TROLS fixture; the three names are from the roster sheet.</p>
  </div>`;
}

function viewClubs() {
  const order = [CLUB].concat(DATA.clubs.filter((c) => c.name !== CLUB).map((c) => c.name));
  const cards = order.map((name) => {
    const c = clubByName(name);
    if (!c) return "";
    return `<div class="club">
      <div class="cn">${esc(c.name)}${c.isUs ? `<span class="tag">us</span>` : ""}</div>
      <div class="vd">${esc(c.venue)} · Melway ${esc(c.melway)}</div>
      <div class="ct">${esc(c.contact)} · <a href="tel:${esc(c.phone.replace(/\s/g, ""))}">${esc(c.phone)}</a>${c.clubPhone ? ` · club ${esc(c.clubPhone)}` : ""}</div>
    </div>`;
  }).join("");
  return `<div class="card">
    <p class="label">The section · venues and contacts</p>
    ${cards}
    <p class="note" style="margin:13px 0 0">Contacts are the club contacts on the TROLS section sheet — for match-day issues, the venue supervisor is the first call.</p>
  </div>`;
}

/* ---------- local availability overrides ---------- */
const STORE = "em-gb1-avail-v2";
function loadOverrides() { try { return JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (e) { return {}; } }
function saveOverrides(o) { try { localStorage.setItem(STORE, JSON.stringify(o)); } catch (e) {} }
let overrides = loadOverrides();
function overrideFor(firstName, round) { return (overrides[round] || {})[firstName] || null; }

function bindSquad() {
  const el = $("#view-squad");
  el.querySelectorAll(".seg button").forEach((b) => {
    b.onclick = () => {
      const r = nextRound().round;
      overrides[r] = overrides[r] || {};
      overrides[r][b.dataset.p] = b.dataset.s;
      saveOverrides(overrides);
      renderAll();
    };
  });
}

/* ---------- boot ---------- */
function renderAll() {
  $("#mastheadSub").textContent = `${DATA.meta.club} · ${DATA.meta.competition} · ${DATA.meta.season}`;
  $("#syncWhen").textContent = DATA.meta.ladder_loaded.replace(/, .*/, "");
  $("#view-week").innerHTML = viewWeek();
  $("#view-team").innerHTML = viewTeam();
  $("#view-squad").innerHTML = viewSquad();
  $("#view-ladder").innerHTML = viewLadder();
  $("#view-results").innerHTML = viewResults();
  $("#view-draw").innerHTML = viewDraw();
  $("#view-clubs").innerHTML = viewClubs();
  bindSquad();
  $("#foot").innerHTML = `
    ${esc(DATA.meta.section)} · section ${esc(DATA.meta.section_code)} · ${esc(DATA.meta.competition)} ${esc(DATA.meta.season)} · Waverley District Tennis Association<br>
    Ladder, results and fixture from <a href="${esc(DATA.meta.source_ladder)}" target="_blank" rel="noopener">TROLS</a>,
    the official record for Waverley Tennis. Snapshot ${esc(DATA.meta.ladder_loaded)}. Roster from the captain's sheet.<br>
    Unofficial team tool — always check TROLS or your club before a match.`;
}

function showTab(name) {
  const btn = document.querySelector('.tabs button[data-view="' + name + '"]');
  if (!btn) return;
  document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", "false"));
  btn.setAttribute("aria-selected", "true");
  document.querySelectorAll(".view").forEach((v) => v.classList.remove("on"));
  const view = $("#view-" + name);
  if (view) view.classList.add("on");
}

document.querySelectorAll(".tabs button").forEach((b) => {
  b.onclick = () => {
    showTab(b.dataset.view);
    if (history.replaceState) history.replaceState(null, "", "#" + b.dataset.view);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
});

renderAll();
if (location.hash) showTab(location.hash.slice(1));

fetch("data.json?t=" + Date.now(), { cache: "no-store" })
  .then((r) => (r.ok ? r.json() : null))
  .then((fresh) => {
    if (!fresh || !fresh.meta || fresh.meta.ladder_loaded === DATA.meta.ladder_loaded) return;
    Object.assign(DATA, fresh);
    if (fresh.roster) Object.assign(roster, fresh.roster);
    $("#syncState").textContent = "updated";
    renderAll();
  })
  .catch(() => {});
</script>
</body>
</html>
