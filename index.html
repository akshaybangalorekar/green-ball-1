<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Advantage · East Malvern Green Ball 1</title>
<meta name="theme-color" content="#B8431F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Advantage">
<meta name="apple-mobile-web-app-title" content="Advantage">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* clay court + tennis ball */
    --bg: #faf3ea;
    --surface: #fffcf7;
    --surface-2: #f1e5d6;
    --ink: #241811;
    --ink-dim: #7d6553;
    --line: rgba(36, 24, 17, .12);
    --line-soft: rgba(36, 24, 17, .07);
    --clay: #b8431f;
    --clay-deep: #8d3013;
    --clay-wash: rgba(184, 67, 31, .10);
    --ball: #d3dd2c;
    --ball-ink: #2b3005;
    --ball-wash: rgba(211, 221, 44, .28);
    --taupe: #a89383;
    --shadow: 0 1px 2px rgba(36, 24, 17, .05), 0 16px 36px -24px rgba(90, 45, 25, .55);
    --display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
    --body: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17100b;
      --surface: #201711;
      --surface-2: #2b2018;
      --ink: #f4ece1;
      --ink-dim: #b39c88;
      --line: rgba(244, 236, 225, .14);
      --line-soft: rgba(244, 236, 225, .07);
      --clay: #e5713f;
      --clay-deep: #f08a5c;
      --clay-wash: rgba(229, 113, 63, .15);
      --ball: #dbe64a;
      --ball-ink: #1a1d04;
      --ball-wash: rgba(219, 230, 74, .18);
      --taupe: #8c7869;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 18px 42px -26px rgba(0, 0, 0, .95);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; font-family: var(--body); font-size: 15px;
    background:
      radial-gradient(820px 420px at 88% -10%, var(--clay-wash), transparent 70%),
      radial-gradient(680px 380px at -6% 6%, var(--ball-wash), transparent 66%),
      var(--bg);
    color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: 56px;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }

  .masthead { display: flex; align-items: center; gap: 12px; padding: 26px 0 20px; }
  .masthead .who { flex: 1; min-width: 0; }
  .crest { width: 50px; height: 50px; flex: 0 0 50px; border-radius: 15px; background: var(--clay); color: #fff8f0;
    display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 17px; }
  @media (prefers-color-scheme: dark) { .crest { color: #17100b; } }
  .masthead h1 { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.05; margin: 0; letter-spacing: -.02em; }
  .masthead .sub { margin: 4px 0 0; font-size: 11.5px; color: var(--ink-dim); font-family: var(--mono);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sync { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .synctext { text-align: right; font-family: var(--mono); font-size: 10px; line-height: 1.5; color: var(--ink-dim); }
  .synctext b { display: block; color: var(--clay); font-weight: 500; }
  .refresh { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--surface); color: var(--clay); display: grid; place-items: center; cursor: pointer;
    transition: background .15s, transform .15s; }
  .refresh:hover { background: var(--clay-wash); }
  .refresh:active { transform: scale(.94); }
  .refresh.spin svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .refresh.spin svg { animation: none; } }

  .tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
    margin: 0 -20px 26px; padding: 10px 20px; background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line-soft); }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { appearance: none; border: 0; background: transparent; cursor: pointer; font-family: var(--mono);
    font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-dim); padding: 9px 13px;
    border-radius: 9px; white-space: nowrap; transition: color .15s, background .15s; }
  .tabs button[aria-selected="true"] { color: #fff8f0; background: var(--clay); font-weight: 500; }
  @media (prefers-color-scheme: dark) { .tabs button[aria-selected="true"] { color: #17100b; } }

  .view { display: none; animation: rise .3s ease both; }
  .view.on { display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .view { animation: none; } }

  .card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 22px; padding: 26px 22px;
    box-shadow: var(--shadow); margin-bottom: 20px; }
  .label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-dim); margin: 0 0 18px; display: flex; align-items: center; gap: 8px; }
  .label::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ball); flex: 0 0 7px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
  .caption { font-size: 13px; color: var(--ink-dim); line-height: 1.6; margin: 16px 0 0; }
  .caption b { color: var(--ink); font-weight: 600; }

  .hero { position: relative; overflow: hidden; border-radius: 26px; padding: 28px 24px; margin-bottom: 20px;
    background: linear-gradient(158deg, var(--clay) 0%, var(--clay-deep) 100%); color: #fff8f0; box-shadow: var(--shadow); }
  .hero .courtlines { position: absolute; inset: 0; opacity: .18; pointer-events: none; }
  .hero .rd { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; position: relative; }
  .pill { background: rgba(255, 248, 240, .18); border-radius: 999px; padding: 3px 11px; font-size: 10px; letter-spacing: .09em; }
  .pill.today { background: var(--ball); color: var(--ball-ink); font-weight: 500; }
  .hero h2 { position: relative; font-family: var(--display); font-weight: 800; font-size: clamp(30px, 8.4vw, 42px);
    line-height: 1.02; letter-spacing: -.03em; margin: 18px 0 0; }
  .hero h2 small { display: block; font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; opacity: .75; margin-bottom: 9px; }
  .hero .venue { position: relative; font-size: 14px; opacity: .85; margin-top: 12px; }

  .trio { position: relative; display: flex; gap: 14px; margin-top: 24px; }
  .trio .who { text-align: center; flex: 1; }
  .trio .av { width: 52px; height: 52px; margin: 0 auto 9px; border-radius: 50%; background: var(--ball); color: var(--ball-ink);
    display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 17px; }
  .trio .who.em .av { background: rgba(255, 248, 240, .92); color: var(--clay-deep); }
  .trio .nm { font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; opacity: .9; }

  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .kpi { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 18px; padding: 20px 14px;
    text-align: center; box-shadow: var(--shadow); }
  .kpi .n { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .kpi .n small { font-size: 13px; font-weight: 600; color: var(--ink-dim); letter-spacing: 0; }
  .kpi .k { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); margin-top: 9px; }

  .chart { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-family: var(--mono); font-size: 10px; fill: var(--ink-dim); }
  .chart .big { font-family: var(--display); font-size: 26px; font-weight: 800; fill: var(--ink); }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 16px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-dim); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  /* stat rows */
  .srow { display: flex; align-items: baseline; justify-content: space-between; padding: 13px 0; border-top: 1px solid var(--line-soft); }
  .srow:first-child { border-top: 0; }
  .srow .k { font-family: var(--mono); font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-dim); }
  .srow .v { font-family: var(--display); font-weight: 700; font-size: 19px; font-variant-numeric: tabular-nums; }
  .srow .v small { font-size: 12px; color: var(--ink-dim); font-weight: 500; }

  /* gap rows */
  .gap { padding: 14px 0; border-top: 1px solid var(--line-soft); }
  .gap:first-of-type { border-top: 0; }
  .gline { display: flex; align-items: baseline; gap: 10px; }
  .gap .pos { width: 16px; font-family: var(--mono); font-size: 12px; color: var(--ink-dim); }
  .gap .nm { flex: 1; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gap.us .nm { color: var(--clay); font-weight: 700; }
  .gap .pts { font-family: var(--display); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
  .gap .d { width: 58px; text-align: right; font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }
  .gap .d.ahead { color: var(--taupe); }
  .gap.us .d { color: var(--clay); font-weight: 500; }
  .gtrack { height: 7px; border-radius: 4px; background: var(--surface-2); margin: 9px 0 0 26px; overflow: hidden; }
  .gtrack i { display: block; height: 100%; border-radius: 4px; background: var(--taupe); opacity: .55; }
  .gap.us .gtrack i { background: var(--clay); opacity: 1; }
  .cutline { display: flex; align-items: center; gap: 10px; margin: 6px 0 0 26px; }
  .cutline::before, .cutline::after { content: ""; height: 1px; flex: 1; background: repeating-linear-gradient(90deg, var(--line) 0 5px, transparent 5px 10px); }
  .cutline span { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }

  .seg-top { display: flex; gap: 6px; background: var(--surface-2); border-radius: 14px; padding: 5px; margin-bottom: 20px; }
  .seg-top button { flex: 1; appearance: none; border: 0; background: transparent; cursor: pointer; font-family: var(--mono);
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-dim); padding: 10px 6px; border-radius: 10px; }
  .seg-top button[aria-selected="true"] { background: var(--surface); color: var(--clay); font-weight: 500; box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  .rnd { padding: 18px 0; border-top: 1px solid var(--line-soft); }
  .rnd:first-child { border-top: 0; padding-top: 0; }
  .rnd-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
  .rnd-h b { color: var(--ink); font-weight: 500; }
  .mt { display: flex; align-items: center; gap: 10px; padding: 9px 0; font-size: 13.5px; }
  .mt .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mt .nm.r { text-align: right; }
  .mt .sc { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); background: var(--surface-2);
    border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
  .mt.ours .nm { color: var(--clay); font-weight: 700; }

  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li { display: grid; grid-template-columns: 46px 1fr auto; gap: 14px; align-items: center; padding: 15px 0;
    border-top: 1px solid var(--line-soft); }
  .tl li:first-child { border-top: 0; }
  .tl .rn { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); text-align: center; background: var(--surface-2);
    border-radius: 9px; padding: 7px 0; }
  .tl .who { font-size: 14px; }
  .tl .who small { display: block; color: var(--ink-dim); font-size: 11.5px; font-family: var(--mono); margin-top: 4px; }
  .tl .res { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }
  .tl li.today { background: var(--clay-wash); border-radius: 14px; padding-left: 12px; padding-right: 12px; margin: 0 -12px; }
  .tl li.past .who { color: var(--ink-dim); }

  .pcard { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 22px; padding: 24px 22px;
    margin-bottom: 18px; box-shadow: var(--shadow); }
  .pcard .top { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .rank { width: 38px; height: 38px; flex: 0 0 38px; border-radius: 12px; background: var(--clay); color: #fff8f0;
    display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 16px; }
  @media (prefers-color-scheme: dark) { .rank { color: #17100b; } }
  .pcard .nm { font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: -.01em; }
  .pcard .role { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); margin-top: 4px; }
  .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: center; }
  .pstats .row { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line-soft); }
  .pstats .row:first-child { border-top: 0; }
  .pstats .k { font-family: var(--mono); font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-dim); }
  .pstats .v { font-family: var(--display); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
  .pnext { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line-soft); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pnext .txt { font-size: 13px; color: var(--ink-dim); }
  .pnext .txt b { color: var(--ink); }
  .seg { display: flex; gap: 4px; margin-left: auto; }
  .seg button { appearance: none; border: 1px solid var(--line); background: transparent; cursor: pointer; font-family: var(--mono);
    font-size: 10.5px; letter-spacing: .05em; padding: 6px 11px; border-radius: 8px; color: var(--ink-dim); }
  .seg button[data-on="in"] { background: var(--ball); border-color: var(--ball); color: var(--ball-ink); font-weight: 500; }
  .seg button[data-on="maybe"] { background: var(--taupe); border-color: var(--taupe); color: #fff; }
  .seg button[data-on="out"] { background: var(--clay); border-color: var(--clay); color: #fff8f0; }

  .kid { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; cursor: pointer;
    background: transparent; border: 0; border-top: 1px solid var(--line-soft); padding: 16px 0;
    font-family: var(--body); color: var(--ink); }
  .kid:first-of-type { border-top: 0; }
  .kid:active { opacity: .7; }
  .krank { width: 34px; height: 34px; flex: 0 0 34px; border-radius: 10px; background: var(--ball); color: var(--ball-ink);
    display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 15px; }
  .kbody { flex: 1; min-width: 0; }
  .knm { display: block; font-family: var(--display); font-weight: 600; font-size: 16px; }
  .kmeta { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--ink-dim); margin-top: 3px; }
  .kpct { font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--clay); font-variant-numeric: tabular-nums; }
  .karrow { color: var(--ink-dim); font-size: 20px; line-height: 1; }

  .back { appearance: none; border: 0; background: transparent; cursor: pointer; color: var(--clay);
    font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 0 0 14px; }
  .phead { margin-bottom: 6px; }
  .pname { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: -.02em; line-height: 1.1; }
  .pteam { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); margin-top: 6px; }

  .pround { padding: 16px 0; border-top: 1px solid var(--line-soft); }
  .pround:first-of-type { border-top: 0; padding-top: 0; }
  .prh { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-dim); }
  .prh b { color: var(--ink); font-weight: 500; }
  .rub { display: grid; grid-template-columns: 62px 1fr auto; gap: 10px; align-items: center; padding: 9px 0;
    border-top: 1px solid var(--line-soft); font-size: 13px; }
  .rub:first-of-type { border-top: 0; }
  .rub .rt { font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-dim); }
  .rub .rw { color: var(--ink-dim); overflow-wrap: break-word; }
  .rub .rs { font-family: var(--mono); font-size: 12.5px; font-weight: 500; padding: 3px 9px; border-radius: 7px; white-space: nowrap; }
  .rub.w .rs { background: var(--ball); color: var(--ball-ink); }
  .rub.l .rs { background: var(--clay); color: #fff8f0; }

  .matrix { border-collapse: collapse; font-size: 11px; }
  .matrix th, .matrix td { padding: 8px 5px; text-align: center; }
  .matrix th:first-child, .matrix td:first-child { text-align: left; padding-right: 12px; white-space: nowrap; }
  .matrix .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
  .dot.in { background: var(--ball); } .dot.out { background: var(--clay); } .dot.un { background: var(--taupe); }
  .dot.none { background: var(--surface-2); border: 1px solid var(--line); }

  .club { padding: 20px 0; border-top: 1px solid var(--line-soft); }
  .club:first-child { border-top: 0; padding-top: 0; }
  .club .cn { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 9px; }
  .club .cn .tag { font-family: var(--mono); font-size: 9px; letter-spacing: .08em; text-transform: uppercase;
    background: var(--clay); color: #fff8f0; border-radius: 5px; padding: 3px 7px; font-weight: 500; }
  .club .vd { font-size: 13px; color: var(--ink-dim); margin-top: 6px; }
  .club .ct { font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); margin-top: 8px; }
  .club .ct a { color: var(--clay); text-decoration: none; }

  .act { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .act .txt { flex: 1; min-width: 180px; font-size: 13px; color: var(--ink-dim); line-height: 1.5; }
  .act .txt b { color: var(--ink); font-weight: 600; display: block; margin-bottom: 3px; font-size: 13.5px; }
  .btn { appearance: none; border: 0; cursor: pointer; font-family: var(--mono); font-size: 11px; letter-spacing: .07em;
    text-transform: uppercase; padding: 11px 16px; border-radius: 11px; background: var(--clay); color: #fff8f0; }
  .btn.ghost { background: var(--surface-2); color: var(--ink); }
  .btn[disabled] { opacity: .5; cursor: default; }
  @media (prefers-color-scheme: dark) { .btn { color: #17100b; } }

  .strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .blk { aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; font-family: var(--mono);
    font-size: 11px; background: var(--surface-2); color: var(--ink-dim); }
  .blk.w { background: var(--ball); color: var(--ball-ink); font-weight: 700; }
  .blk.l { background: var(--clay); color: #fff8f0; font-weight: 700; }
  .blk.wo { background: var(--taupe); color: #fff; }
  .blk.today { outline: 2px solid var(--clay); outline-offset: -2px; color: var(--clay); font-weight: 700; }

  footer { margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--line-soft); font-family: var(--mono);
    font-size: 10.5px; line-height: 1.9; color: var(--ink-dim); }
  footer a { color: var(--clay); text-decoration: none; }
  .tblwrap { overflow-x: auto; margin: 0 -6px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="crest">EM</div>
    <div class="who">
      <h1>Advantage</h1>

const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

const parseDate = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d, 12, 0, 0); };
const fmtDate = (iso) => { const d = parseDate(iso); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const fmtLong = (iso) => { const d = parseDate(iso); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const todayISO = () => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}-${String(n.getDate()).padStart(2, "0")}`; };
const pct = (n) => Number(n).toFixed(2).replace(/\.00$/, ".0");
const first = (n) => String(n).split(" ")[0];
const initials = (n) => String(n).split(" ").map((w) => w[0]).join("").slice(0, 2).toUpperCase();
const ordinal = (n) => { const s = ["th", "st", "nd", "rd"], v = n % 100; return s[(v - 20) % 10] || s[v] || s[0]; };

const us = DATA.ladder.find((t) => t.isUs);
const roster = DATA.roster || { players: [], rounds: [], team_order: [] };
const playerResults = DATA.section_players || {};

function resultsFor(team) {
  const out = [];
  DATA.results.forEach((r) => r.matches.forEach((m) => {
    if (m.home !== team && m.away !== team) return;
    const home = m.home === team;
    let res;
    if (m.washout) res = "wo";
    else {
      const mine = home ? m.homePts : m.awayPts, theirs = home ? m.awayPts : m.homePts;
      res = mine > theirs ? "w" : mine < theirs ? "l" : "d";
    }
    out.push({ round: r.round, date: r.date, res, home, opp: home ? m.away : m.home, m });
  }));
  return out.sort((a, b) => b.round - a.round);
}
const ourResults = resultsFor(CLUB);
const resultForRound = (n) => ourResults.find((r) => r.round === n) || null;
const ourPoints = (r) => (r.m.washout ? 4 : (r.m.home === CLUB ? r.m.homePts : r.m.awayPts));

function nextRound() {
  const t = todayISO();
  const upcoming = DATA.draw.filter((d) => d.date >= t);
  return upcoming.length ? upcoming[0] : DATA.draw[DATA.draw.length - 1];
}
const clubByName = (name) => DATA.clubs.find((c) => c.name === name) || null;

const rosterRound = (n) => roster.rounds.find((r) => r.round === n) || null;
function planFor(firstName, n) {
  const r = rosterRound(n);
  if (!r) return "none";
  if ((r.in || []).includes(firstName)) return "in";
  if ((r.unavailable || []).includes(firstName)) return "un";
  if ((r.out || []).includes(firstName)) return "out";
  return "none";
}

/* ---------- team totals ---------- */
const completedRounds = ourResults.filter((r) => r.res !== "wo");
const teamSetsFor = us.sets_for, teamSetsAgainst = us.sets_against;
const setPct = Math.round((100 * teamSetsFor) / Math.max(1, teamSetsFor + teamSetsAgainst));
const gamePct = Math.round((100 * us.games_for) / Math.max(1, us.games_for + us.games_against));
const pointsPerRound = (us.pts / Math.max(1, ourResults.length)).toFixed(1);
const winRate = completedRounds.length ? Math.round((100 * completedRounds.filter((r) => r.res === "w").length) / completedRounds.length) : 0;

/* ---------- per player ---------- */
function playerLine(name) {
  const pr = playerResults[name];
  if (!pr) return null;
  return {
    ...pr,
    singlesWon: pr.singles_won || 0, singlesPlayed: pr.singles_played || 0,
    doublesWon: pr.doubles_won || 0, doublesPlayed: pr.doubles_played || 0,
  };
}
const squad = (roster.players || []).map((p) => {
  const f = first(p.name);
  const inR = [], outR = [], unR = [];
  roster.rounds.forEach((r) => {
    if ((r.in || []).includes(f)) inR.push(r.round);
    else if ((r.unavailable || []).includes(f)) unR.push(r.round);
    else if ((r.out || []).includes(f)) outR.push(r.round);
  });
  const line = playerLine(p.name);
  return { ...p, inCount: inR.length, outCount: outR.length, unCount: unR.length,
    scheduled: roster.rounds.length || 1, line };
}).sort((a, b) => a.rank - b.rank);

/* ---------- graphics ---------- */
function ring(value, max, label, sub) {
  const r = 52, c = 2 * Math.PI * r, dash = Math.max(0, Math.min(1, value / max)) * c;
  return `<svg class="chart" viewBox="0 0 140 140" role="img" aria-label="${esc(label)}">
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="13"/>
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--clay)" stroke-width="13" stroke-linecap="round"
      stroke-dasharray="${dash} ${c}" transform="rotate(-90 70 70)"/>
    <text x="70" y="${sub ? 64 : 70}" text-anchor="middle" class="big" dominant-baseline="middle">${esc(label)}</text>
    ${sub ? `<text x="70" y="88" text-anchor="middle">${esc(sub)}</text>` : ""}
  </svg>`;
}

function pointsChart() {
  const rounds = ourResults.slice().sort((a, b) => a.round - b.round);
  if (!rounds.length) return "";
  const W = 320, H = 168, pad = 8, top = 26, base = H - 26;
  const bw = (W - pad * 2) / rounds.length;
  let cum = 0;
  const bars = rounds.map((r, i) => {
    const pts = ourPoints(r); cum += pts;
    const h = (pts / 8) * (base - top - 18);
    const x = pad + i * bw + bw * 0.2, w = bw * 0.6;
    return `<rect x="${x}" y="${base - h}" width="${w}" height="${h}" rx="4" fill="var(--clay)" opacity="${r.res === "wo" ? .35 : .9}"/>
      <text x="${x + w / 2}" y="${base - h - 9}" text-anchor="middle" style="fill:var(--ink)">${pts.toFixed(0)}</text>
      <text x="${x + w / 2}" y="${base + 17}" text-anchor="middle">R${r.round}</text>
      <text x="${x + w / 2}" y="${H - 2}" text-anchor="middle" style="fill:var(--clay)">${cum.toFixed(0)}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><line x1="${pad}" y1="${base}" x2="${W - pad}" y2="${base}" stroke="var(--line)"/>${bars}</svg>`;
}

function gamesChart() {
  const rounds = ourResults.slice().sort((a, b) => a.round - b.round).filter((r) => r.res !== "wo");
  if (!rounds.length) return "";
  const W = 320, H = 150, pad = 8, top = 20, base = H - 24;
  const maxG = Math.max(...rounds.map((r) => Math.max(r.m.homeGames, r.m.awayGames)), 36);
  const bw = (W - pad * 2) / rounds.length;
  const bars = rounds.map((r, i) => {
    const mine = r.m.home === CLUB ? r.m.homeGames : r.m.awayGames;
    const theirs = r.m.home === CLUB ? r.m.awayGames : r.m.homeGames;
    const hM = (mine / maxG) * (base - top), hT = (theirs / maxG) * (base - top);
    const x = pad + i * bw + bw * 0.14, w = bw * 0.34;
    return `<rect x="${x}" y="${base - hM}" width="${w}" height="${hM}" rx="4" fill="var(--ball)"/>
      <rect x="${x + w + 4}" y="${base - hT}" width="${w}" height="${hT}" rx="4" fill="var(--taupe)" opacity=".7"/>
      <text x="${x + w}" y="${base + 16}" text-anchor="middle">R${r.round}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><line x1="${pad}" y1="${base}" x2="${W - pad}" y2="${base}" stroke="var(--line)"/>${bars}</svg>`;
}

function seasonStrip() {
  const t = todayISO();
  return DATA.draw.map((d) => {
    const r = resultForRound(d.round);
    let cls = "up", txt = String(d.round);
    if (r) { cls = r.res === "wo" ? "wo" : r.res; txt = r.res === "wo" ? "–" : r.res.toUpperCase(); }
    else if (d.date === t) { cls = "today"; }
    return `<div class="blk ${cls}">${txt}</div>`;
  }).join("");
}

/* ---------- views ---------- */
function insightLine() {
  const sorted = DATA.ladder.slice().sort((a, b) => a.pos - b.pos);
  const top = sorted[0], fourth = sorted[3];
  const level = sorted.find((t) => t.pos !== us.pos && t.pts === us.pts);
  let s = `<b>${us.pos}${ordinal(us.pos)}</b> on ${us.pts.toFixed(1)} points, ${(top.pts - us.pts).toFixed(1)} behind ${esc(top.team)}.`;
  if (level) s += ` Level with ${esc(level.team)} — they sit ${level.pos < us.pos ? "above" : "below"} you only on percentage (${pct(level.pct)}% v ${pct(us.pct)}%).`;
  s += ` Top four play finals; 4th is ${(us.pts - fourth.pts).toFixed(1)} points back.`;
  return s;
}

function viewWeek() {
  const nr = nextRound();
  const isToday = nr.date === todayISO();
  const opp = nr.opponent ? clubByName(nr.opponent) : null;
  const venue = nr.opponent
    ? (nr.homeAway === "H" ? "Home · 15 Moira St, Glen Iris" : (opp ? "Away · " + opp.venue : "Away"))
    : "Venue confirmed once TROLS publishes the round";
  const rr = rosterRound(nr.round);
  const trio = rr ? (rr.in || []) : [];

  const trioHTML = trio.length ? `<div class="trio">${trio.map((n) => {
    const em = rr.emergency && rr.emergency.includes(n);
    return `<div class="who ${em ? "em" : ""}"><div class="av">${esc(initials(n))}</div><div class="nm">${esc(first(n))}${em ? " · E" : ""}</div></div>`;
  }).join("")}</div>` : "";

  return `
    <div class="hero">
      <svg class="courtlines" viewBox="0 0 400 260" preserveAspectRatio="none" aria-hidden="true">
        <g stroke="#fff8f0" stroke-width="1.2" fill="none">
          <rect x="30" y="26" width="340" height="208" rx="3"/>
          <line x1="30" y1="130" x2="370" y2="130"/>
          <line x1="120" y1="26" x2="120" y2="234"/>
          <line x1="280" y1="26" x2="280" y2="234"/>
          <line x1="120" y1="86" x2="280" y2="86"/>
          <line x1="120" y1="174" x2="280" y2="174"/>
        </g>
      </svg>
      <div class="rd">
        <span class="pill">Round ${nr.round}</span>
        <span>${fmtLong(nr.date)}</span>
        ${isToday ? `<span class="pill today">Today</span>` : ""}
      </div>
      <h2><small>${nr.opponent ? (nr.homeAway === "H" ? "Home vs" : "Away vs") : "Opponent"}</small>
        ${nr.opponent ? esc(nr.opponent) : "To be confirmed"}</h2>
      <div class="venue">${esc(venue)}</div>
      ${trioHTML}
    </div>

    <div class="kpis">
      <div class="kpi"><div class="n">${us.pos}<small>/${DATA.ladder.length}</small></div><div class="k">Ladder</div></div>
      <div class="kpi"><div class="n">${us.pts.toFixed(1)}</div><div class="k">Points</div></div>
      <div class="kpi"><div class="n">${setPct}<small>%</small></div><div class="k">Sets won</div></div>
    </div>

    <div class="card">
      <p class="label">Where you stand</p>
      <p class="caption" style="margin:0">${insightLine()}</p>
    </div>

    <div class="card">
      <p class="label">Season so far</p>
      <div class="strip">${seasonStrip()}</div>
      <div class="legend"><span><i style="background:var(--ball)"></i>win</span><span><i style="background:var(--clay)"></i>loss</span><span><i style="background:var(--taupe)"></i>wash-out</span><span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>to come</span></div>
    </div>

    <div class="card">
      <p class="label">App and alerts</p>
      <div class="act">${installBlock()}</div>
      <div class="act" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft)">${alertsBlock()}</div>
    </div>`;
}

function viewTeam() {
  const sorted = DATA.ladder.slice().sort((a, b) => a.pos - b.pos);
  const top = sorted[0];
  const fourth = sorted[3];
  const level = sorted.find((t) => t.pos !== us.pos && t.pts === us.pts);

  const wanted = [top, level, us, fourth]
    .filter(Boolean)
    .filter((t, i, arr) => arr.findIndex((x) => x.team === t.team) === i)
    .sort((a, b) => a.pos - b.pos);

  const maxPts = Math.max(...DATA.ladder.map((t) => t.pts), 1);
  const roundsLeft = DATA.draw.filter((d) => d.date >= todayISO()).length;

  const rows = wanted.map((t) => {
    const diff = t.pts - us.pts;
    const delta = t.isUs ? "you" : diff === 0 ? "level" : (diff > 0 ? `+${diff.toFixed(1)}` : `−${Math.abs(diff).toFixed(1)}`);
    const cut = t.pos === 4;
    return `<div class="gap ${t.isUs ? "us" : ""} ${cut ? "cut" : ""}">
      <div class="gline">
        <span class="pos">${t.pos}</span>
        <span class="nm">${esc(t.team)}</span>
        <span class="pts">${t.pts.toFixed(1)}</span>
        <span class="d ${!t.isUs && diff > 0 ? "ahead" : ""}">${delta}</span>
      </div>
      <div class="gtrack"><i style="width:${Math.max(3, (t.pts / maxPts) * 100)}%"></i></div>
    </div>`;
  }).join("");

  const clear = us.pts - fourth.pts;

  return `
    <div class="card">
      <p class="label">Gap to the finals line</p>
      ${rows}
      <div class="cutline"><span>finals cut</span></div>
      <p class="caption" style="margin-top:18px">
        Top four of eight play finals. You are <b>${clear.toFixed(1)} points clear</b> of the cut
        with <b>${roundsLeft} rounds</b> left${level ? `, and level with ${esc(level.team)} on points` : ""}.
      </p>
    </div>`;
}

function ladderRowsAll() {
  const all = Object.values(DATA.section_players || {}).filter((p) => p.set_pct != null);
  return all.sort((a, b) =>
    (b.set_pct - a.set_pct) || ((b.game_pct || 0) - (a.game_pct || 0)) || (b.rubbers - a.rubbers) || a.name.localeCompare(b.name));
}
function rankOf(name) {
  const rows = ladderRowsAll();
  const i = rows.findIndex((r) => r.name === name);
  return i < 0 ? null : { rank: i + 1, total: rows.length };
}

function viewSquad() {
  if (selectedPlayer) return viewPlayer(selectedPlayer);

  const rows = ladderRowsAll();
  const ladder = rows.map((p, i) => {
    const mine = p.team === CLUB;
    return `<tr style="${mine ? "background:var(--clay-wash)" : ""}">
      <td style="text-align:left;width:28px">${i + 1}</td>
      <td style="text-align:left;${mine ? "font-weight:700;color:var(--clay)" : ""}">${esc(first(p.name))} <span style="opacity:.55;font-weight:400">${esc(p.name.split(" ").slice(1).join(" "))}</span></td>
      <td style="text-align:left;font-size:12px;color:var(--ink-dim)">${esc(p.team)}</td>
      <td>${p.sets_won}–${p.sets_lost}</td>
      <td>${p.set_pct}%</td>
    </tr>`;
  }).join("");

  const kids = squad.map((s) => {
    const r = rankOf(s.name);
    const L = s.line;
    const pctShown = L && L.set_pct != null ? L.set_pct : null;
    return `<button class="kid" data-player="${esc(s.name)}">
      <span class="krank">${r ? r.rank : "—"}</span>
      <span class="kbody">
        <span class="knm">${esc(s.name)}</span>
        <span class="kmeta">${r ? `${r.rank}${ordinal(r.rank)} of ${r.total} in the section` : "no rubbers yet"}${L ? ` · ${L.sets_won}–${L.sets_lost} sets` : ""}</span>
      </span>
      <span class="kpct">${pctShown != null ? pctShown + "%" : "—"}</span>
      <span class="karrow">›</span>
    </button>`;
  }).join("");

  return `
    <div class="card">
      <p class="label">Your four</p>
      ${kids}
      <p class="caption">Tap a child to see every set they have played.</p>
    </div>
    <div class="card">
      <p class="label">Section ladder · ${rows.length} players</p>
      <div class="tblwrap"><table style="font-size:13px">
        <thead><tr><th style="text-align:left">#</th><th style="text-align:left">Player</th><th style="text-align:left">Team</th><th>Sets</th><th>%</th></tr></thead>
        <tbody>${ladder}</tbody></table></div>
      <p class="caption">Every player in Open Triples Green Ball 1. Ranked by sets won %, then games won % — a clean 3–0 sits above a 6–0 that dropped games. East Malvern in clay.</p>
    </div>`;
}

function viewPlayer(name) {
  const p = (DATA.our_players || {})[name] || (DATA.section_players || {})[name];
  if (!p) return `<div class="card"><p class="caption">No rubbers recorded for ${esc(name)} yet.</p></div>`;
  const r = rankOf(name);
  const pctShown = p.set_pct != null ? Math.round(p.set_pct) : 0;

  const rounds = (p.detail || []).slice().sort((a, b) => b.round - a.round).map((d) => {
    const rubbers = d.rubbers.map((rb) => {
      const real = (rb.opponents || []).filter((o) => !/^no player/i.test(o));
      const who = rb.type === "singles"
        ? `vs ${esc(real[0] || "opponent")}`
        : `with ${esc(first(rb.partner || ""))} vs ${real.length ? real.map((o) => esc(first(o))).join(" & ") : "opponent"}`;
      return `<div class="rub ${rb.won ? "w" : "l"}">
        <span class="rt">${rb.type === "singles" ? "Singles" : "Doubles"}</span>
        <span class="rw">${who}</span>
        <span class="rs">${rb.ours}–${rb.theirs}</span>
      </div>`;
    }).join("");
    return `<div class="pround">
      <div class="prh"><b>Round ${d.round}</b><span>${fmtDate(d.date)} · vs ${esc(d.opponent_team)}</span></div>
      ${rubbers}
    </div>`;
  }).join("");

  return `
    <div class="card">
      <button class="back" id="backBtn">‹ Squad</button>
      <div class="phead">
        <div class="pname">${esc(p.name)}</div>
        <div class="pteam">${esc(p.team)}${r ? ` · ${r.rank}${ordinal(r.rank)} of ${r.total} in the section` : ""}</div>
      </div>
      <div style="display:flex;justify-content:center;padding:10px 0 2px">
        ${ring(pctShown, 100, pctShown + "%", "sets won")}
      </div>
      <div class="srow"><span class="k">Rubbers played</span><span class="v">${p.rubbers}</span></div>
      <div class="srow"><span class="k">Sets</span><span class="v">${p.sets_won}<small>–${p.sets_lost}</small></span></div>
      <div class="srow"><span class="k">Games</span><span class="v">${p.games_won}<small>–${p.games_lost}</small></span></div>
      <div class="srow"><span class="k">Singles</span><span class="v">${p.singles_won}<small>–${p.singles_played - p.singles_won}</small></span></div>
      <div class="srow"><span class="k">Doubles</span><span class="v">${p.doubles_won}<small>–${p.doubles_played - p.doubles_won}</small></span></div>
    </div>
    <div class="card">
      <p class="label">Every set</p>
      ${rounds || `<p class="caption">No rubbers recorded yet.</p>`}
    </div>`;
}

function viewSeason() {
  const seg = seasonTab;
  const body = seg === "ladder" ? ladderView() : seg === "results" ? resultsView() : drawView();
  return `<div class="seg-top" role="tablist">
      <button data-season="ladder" aria-selected="${seg === "ladder"}">Ladder</button>
      <button data-season="results" aria-selected="${seg === "results"}">Results</button>
      <button data-season="draw" aria-selected="${seg === "draw"}">Draw</button>
    </div>${body}`;
}

function ladderView() {
  const rows = DATA.ladder.map((t) => `
    <tr style="${t.isUs ? "background:var(--clay-wash)" : ""}">
      <td style="text-align:left">${t.pos}</td>
      <td style="text-align:left;${t.isUs ? "font-weight:700;color:var(--clay)" : ""}">${esc(t.team)}</td>
      <td>${t.played}</td><td>${t.pts.toFixed(1)}</td><td>${pct(t.pct)}</td>
    </tr>`).join("");
  return `<div class="card">
    <p class="label">Official ladder · after round 3</p>
    <div class="tblwrap"><table style="font-size:14px">
      <thead><tr><th style="text-align:left">#</th><th style="text-align:left">Team</th><th>P</th><th>Pts</th><th>%</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="caption">Points decide the ladder; percentage is games won ÷ games lost. Wash-outs pay 4 points each. Top four play finals.</p>
  </div>`;
}

function resultsView() {
  const blocks = DATA.results.map((r) => {
    const rows = r.matches.map((m) => {
      const ours = m.home === CLUB || m.away === CLUB;
      if (m.washout) return `<div class="mt ${ours ? "ours" : ""}"><span class="nm">${esc(m.home)}</span><span class="sc">wash out</span><span class="nm r">${esc(m.away)}</span></div>`;
      const hWin = m.homePts > m.awayPts;
      return `<div class="mt ${ours ? "ours" : ""}">
        <span class="nm" style="${hWin ? "font-weight:700" : ""}">${esc(m.home)}</span>
        <span class="sc">${m.homePts.toFixed(0)}–${m.awayPts.toFixed(0)} · ${m.homeGames}–${m.awayGames}</span>
        <span class="nm r" style="${!hWin ? "font-weight:700" : ""}">${esc(m.away)}</span></div>`;
    }).join("");
    return `<div class="rnd"><div class="rnd-h"><b>Round ${r.round}</b><span>${fmtLong(r.date)}</span></div>${rows}</div>`;
  }).join("");
  return `<div class="card"><p class="label">Round by round</p>${blocks}
    <p class="caption">Score reads points then games.</p></div>`;
}

function drawView() {
  const t = todayISO();
  const items = DATA.draw.map((d) => {
    const past = d.date < t, isToday = d.date === t;
    const rr = rosterRound(d.round);
    const trio = rr ? (rr.in || []).map(first).join(", ") : "";
    const who = d.opponent ? `${d.homeAway === "H" ? "vs" : "at"} ${esc(d.opponent)}` : "Opponent TBC";
    return `<li class="${past ? "past" : ""} ${isToday ? "today" : ""}">
      <span class="rn">${d.round}</span>
      <span class="who">${who}<small>${fmtDate(d.date)}${d.homeAway ? " · " + (d.homeAway === "H" ? "home" : "away") : ""}${trio ? " · " + esc(trio) : ""}</small></span>
      <span class="res">${d.result ? esc(d.result) : ""}</span></li>`;
  }).join("");
  const finals = DATA.finals.map((f) => `<li><span class="rn">—</span><span class="who">${esc(f.label)}<small>${fmtDate(f.date)}</small></span><span class="res"></span></li>`).join("");
  return `<div class="card"><p class="label">Season draw</p><ul class="tl">${items}${finals}</ul></div>`;
}

function viewClubs() {
  const order = [CLUB].concat(DATA.clubs.filter((c) => c.name !== CLUB).map((c) => c.name));
  const cards = order.map((name) => {
    const c = clubByName(name);
    if (!c) return "";
    return `<div class="club">
      <div class="cn">${esc(c.name)}${c.isUs ? `<span class="tag">us</span>` : ""}</div>
      <div class="vd">${esc(c.venue)} · Melway ${esc(c.melway)}</div>
      <div class="ct">${esc(c.contact)} · <a href="tel:${esc(c.phone.replace(/\s/g, ""))}">${esc(c.phone)}</a></div>
    </div>`;
  }).join("");
  return `<div class="card"><p class="label">The section</p>${cards}</div>`;
}

/* ---------- app install + alerts ---------- */
const NOTIFY_KEY = "em-gb1-notify-v1";
const SIG_KEY = "em-gb1-sig-v1";
let deferredPrompt = null;
let swReg = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredPrompt = e; });

function isStandalone() {
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
}
function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function alertsOn() { return ("Notification" in window) && Notification.permission === "granted" && localStorage.getItem(NOTIFY_KEY) === "1"; }

function installBlock() {
  if (isStandalone()) {
    return `<span class="txt"><b>Installed</b>You're using the app version — full screen, no browser bars.</span>
      <button class="btn ghost" disabled>Installed</button>`;
  }
  const hint = isIOS() ? "Tap Share, then <b>Add to Home Screen</b>." : "Tap Install, or use the browser menu → Add to Home screen.";
  return `<span class="txt"><b>Open it as an app</b>${hint}</span>
    <button class="btn" id="installBtn">${isIOS() ? "How" : "Install"}</button>`;
}

function alertsBlock() {
  if (!("Notification" in window)) return `<span class="txt"><b>Alerts</b>This browser can't show notifications.</span>`;
  if (Notification.permission === "denied") return `<span class="txt"><b>Alerts blocked</b>Notifications are turned off for this site in your browser settings.</span>`;
  if (alertsOn()) return `<span class="txt"><b>Alerts on</b>Results posted, ladder changes and fixture moves.</span>
      <button class="btn ghost" id="alertsOff">Turn off</button>`;
  return `<span class="txt"><b>Alerts</b>Get told when results are posted, the ladder moves or the fixture changes.</span>
    <button class="btn" id="alertsOn">Turn on</button>`;
}

async function enableAlerts() {
  try {
    const perm = await Notification.requestPermission();
    if (perm === "granted") {
      localStorage.setItem(NOTIFY_KEY, "1");
      const reg = swReg || (navigator.serviceWorker && await navigator.serviceWorker.ready);
      if (reg) {
        if (reg.active) reg.active.postMessage({ type: "check" });
        reg.showNotification(APP_NAME + " alerts on", {
          body: "We'll tell you when results, the ladder or the fixture change.",
          icon: "icon-192.png", badge: "icon-192.png", tag: "gb1-welcome",
        });
      }
    }
  } catch (e) {}
  renderAll();
}

async function initApp() {
  if (!("serviceWorker" in navigator)) return;
  try {
    swReg = await navigator.serviceWorker.register("sw.js", { scope: "./" });
    if (navigator.periodicSync) {
      try { await navigator.periodicSync.register("check-updates", { minInterval: 12 * 60 * 60 * 1000 }); } catch (e) {}
    }
  } catch (e) {}
}

function sigOf(d) {
  const draw = (d.draw || []).map((x) => x.opponent || "-").join(",");
  return [d.meta.ladder_loaded, d.results.length, draw].join("|");
}

async function noteUpdate(fresh) {
  const prev = localStorage.getItem(SIG_KEY);
  localStorage.setItem(SIG_KEY, sigOf(fresh));
  if (!prev || prev === sigOf(fresh) || !alertsOn()) return;
  const [prevLoad, prevRounds] = prev.split("|");
  const latest = (fresh.results || [])[0];
  let body = "Ladder updated";
  if (prevRounds !== String(fresh.results.length) && latest) body = `Round ${latest.round} results are in`;
  else if (prevLoad === String(fresh.meta.ladder_loaded)) body = "Fixture updated";
  try {
    const reg = swReg || await navigator.serviceWorker.ready;
    reg.showNotification(APP_NAME, { body, icon: "icon-192.png", badge: "icon-192.png", tag: "gb1-update" });
  } catch (e) {}
}

/* ---------- state ---------- */
let seasonTab = "ladder";
let selectedPlayer = null;
const STORE = "em-gb1-avail-v2";
const loadOverrides = () => { try { return JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (e) { return {}; } };
const saveOverrides = (o) => { try { localStorage.setItem(STORE, JSON.stringify(o)); } catch (e) {} };
let overrides = loadOverrides();
const overrideFor = (f, round) => (overrides[round] || {})[f] || null;

function bind() {
  const squadView = $("#view-squad");
  squadView.querySelectorAll(".seg button").forEach((b) => {
    b.onclick = () => {
      const r = nextRound().round;
      overrides[r] = overrides[r] || {};
      overrides[r][b.dataset.p] = b.dataset.s;
      saveOverrides(overrides);
      renderAll();
    };
  });
  $("#view-season").querySelectorAll(".seg-top button").forEach((b) => {
    b.onclick = () => { seasonTab = b.dataset.season; $("#view-season").innerHTML = viewSeason(); bind(); };
  });
  $("#view-squad").querySelectorAll(".kid").forEach((b) => {
    b.onclick = () => {
      selectedPlayer = b.dataset.player;
      if (history.replaceState) history.replaceState(null, "", "#player=" + encodeURIComponent(selectedPlayer));
      $("#view-squad").innerHTML = viewSquad();
      bind();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
  });
  const back = $("#backBtn");
  if (back) back.onclick = () => {
    selectedPlayer = null;
    if (history.replaceState) history.replaceState(null, "", "#squad");
    $("#view-squad").innerHTML = viewSquad();
    bind();
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  const ib = $("#installBtn");
  if (ib) ib.onclick = async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      try { await deferredPrompt.userChoice; } catch (e) {}
      deferredPrompt = null;
      renderAll();
    } else if (isIOS()) {
      alert('On iPhone: tap Share, then "Add to Home Screen".');
    } else {
      alert('Open the browser menu and choose "Add to Home screen".');
    }
  };
  const on = $("#alertsOn"); if (on) on.onclick = enableAlerts;
  const off = $("#alertsOff"); if (off) off.onclick = () => { localStorage.setItem(NOTIFY_KEY, "0"); renderAll(); };
}

function renderAll() {
  $("#mastheadSub").textContent = `${DATA.meta.competition} · ${DATA.meta.section.replace(/^Open Triples /, "")}`;
  $("#syncWhen").textContent = DATA.meta.ladder_loaded.replace(/, .*/, "").replace(/\s+\d{4}$/, "");
  $("#view-week").innerHTML = viewWeek();
  $("#view-team").innerHTML = viewTeam();
  $("#view-squad").innerHTML = viewSquad();
  $("#view-season").innerHTML = viewSeason();
  $("#view-clubs").innerHTML = viewClubs();
  bind();
  $("#foot").innerHTML = `
    ${APP_NAME} · ${esc(DATA.meta.section)} · ${esc(DATA.meta.competition)} ${esc(DATA.meta.season)} · Waverley District Tennis Association<br>
    Ladder, results, rubbers and fixture from <a href="${esc(DATA.meta.source_ladder)}" target="_blank" rel="noopener">TROLS</a>.
    Roster from the team sheet. Snapshot ${esc(DATA.meta.ladder_loaded)}.<br>
    Unofficial team tool — check TROLS or your club before a match.`;
}

function showTab(name) {
  const btn = document.querySelector('.tabs button[data-view="' + name + '"]');
  if (!btn) return;
  document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", "false"));
  btn.setAttribute("aria-selected", "true");
  document.querySelectorAll(".view").forEach((v) => v.classList.remove("on"));
  const view = $("#view-" + name);
  if (view) view.classList.add("on");
}
document.querySelectorAll(".tabs button").forEach((b) => {
  b.onclick = () => {
    if (b.dataset.view === "squad") selectedPlayer = null;
    showTab(b.dataset.view);
    if (history.replaceState) history.replaceState(null, "", "#" + b.dataset.view);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
});

renderAll();
if (location.hash.startsWith("#player=")) {
  selectedPlayer = decodeURIComponent(location.hash.slice(8));
  showTab("squad");
  $("#view-squad").innerHTML = viewSquad();
  bind();
} else if (location.hash) {
  showTab(location.hash.slice(1));
}
initApp();

let refreshing = false;

async function refreshNow(opts) {
  const silent = opts && opts.silent;
  if (refreshing) return;
  refreshing = true;
  const btn = $("#refreshBtn");
  const state = $("#syncState");
  if (btn && !silent) btn.classList.add("spin");
  if (state && !silent) state.textContent = "checking";

  let outcome = "synced";
  try {
    const res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const fresh = await res.json();
    const changed = sigOf(fresh) !== sigOf(DATA);
    const first = !localStorage.getItem(SIG_KEY);
    if (changed && !first) {
      noteUpdate(fresh);
      Object.assign(DATA, fresh);
      if (fresh.roster) Object.assign(roster, fresh.roster);
      renderAll();
      outcome = "updated";
    } else {
      outcome = first ? "synced" : "up to date";
    }
    localStorage.setItem(SIG_KEY, sigOf(fresh));
  } catch (e) {
    outcome = navigator.onLine === false ? "offline" : "couldn't reach TROLS";
  } finally {
    refreshing = false;
    if (btn) btn.classList.remove("spin");
    if (state && !silent) {
      state.textContent = outcome;
      setTimeout(() => {
        const s2 = $("#syncState");
        if (s2 && s2.textContent === outcome) s2.textContent = "synced";
      }, 2600);
    }
  }
}

const refreshBtn = $("#refreshBtn");
if (refreshBtn) refreshBtn.onclick = () => refreshNow();

refreshNow({ silent: true });
</script>
</body>
</html>
