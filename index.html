<!DOCTYPE html>
<html lang="en-AU" data-theme="hardcourt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Advantage · East Malvern Green Ball 1</title>
<meta name="theme-color" content="#2f6fb5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Advantage">
<meta name="apple-mobile-web-app-title" content="Advantage">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Centre Court: grass green, white, optic yellow */
    --bg: #2dbb7f;
    --bg-2: #63e2a3;
    --bg-3: #1f9f6c;
    --hero-1: #46cf8b;
    --hero-2: #1ba468;
    --hero-3: #12854f;
    --surface: #ffffff;
    --surface-2: #eef7f1;
    --ink: #0a2b1b;
    --ink-dim: #3d6756;
    --line: rgba(13, 42, 28, .16);
    --line-soft: rgba(13, 42, 28, .08);
    --brand: #0f8b5a;
    --brand-deep: #16935f;
    --brand-wash: rgba(15, 139, 90, .12);
    --ball: #e9f56d;
    --ball-ink: #16220a;
    --ball-wash: rgba(227, 238, 92, .45);
    --muted: #a3bcae;
    --on-brand: #ffffff;
    --on-brand-dim: rgba(255, 255, 255, .84);
    --loss: #d4573a;
    --ctl-bg: rgba(245, 251, 247, .12);
    --ctl-bg-hover: rgba(245, 251, 247, .22);
    --ctl-border: rgba(245, 251, 247, .30);
    --ctl-fg: #ffffff;
    --tabbar-bg: transparent;
    --shadow: 0 2px 4px rgba(8, 40, 24, .14), 0 18px 40px -26px rgba(8, 40, 24, .6);
    --display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
    --body: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  /* ---------- colour themes ---------- */
  [data-theme="hardcourt"] {
    --bg: #2f6fb5; --bg-2: #4f96d8; --bg-3: #1f4f88;
    --hero-1: #4a90cf; --hero-2: #2c6ba8; --hero-3: #1c4a7a;
    --surface: #ffffff; --surface-2: #eef4fb;
    --ink: #0b2137; --ink-dim: #3f5f7d;
    --line: rgba(11, 33, 55, .16); --line-soft: rgba(11, 33, 55, .08);
    --brand: #1d6bb5; --brand-deep: #14528c; --brand-wash: rgba(29, 107, 181, .12);
    --ball: #ffe14d; --ball-ink: #241d00; --ball-wash: rgba(255, 225, 77, .4);
    --muted: #9fb2c6; --on-brand: #ffffff; --on-brand-dim: rgba(255, 255, 255, .85);
    --loss: #d9542f;
  }
  [data-theme="clay"] {
    --bg: #c4623f; --bg-2: #dd8a63; --bg-3: #a34c2e;
    --hero-1: #d0724c; --hero-2: #b0552f; --hero-3: #8d3f22;
    --surface: #fffaf5; --surface-2: #f7ece3;
    --ink: #2b1a12; --ink-dim: #7a5a49;
    --line: rgba(43, 26, 18, .16); --line-soft: rgba(43, 26, 18, .08);
    --brand: #a44e2c; --brand-deep: #7d3a1f; --brand-wash: rgba(164, 78, 44, .12);
    --ball: #ffe066; --ball-ink: #2b1a12; --ball-wash: rgba(255, 224, 102, .45);
    --muted: #c3a795; --on-brand: #ffffff; --on-brand-dim: rgba(255, 255, 255, .88);
    --loss: #7d3a1f;
  }
  [data-theme="chalk"] {
    --bg: #eef3ee; --bg-2: #ffffff; --bg-3: #dfe9e1;
    --hero-1: #1f7a52; --hero-2: #176342; --hero-3: #114b32;
    --surface: #ffffff; --surface-2: #f1f5f1;
    --ink: #12261b; --ink-dim: #4d6a58;
    --line: rgba(18, 38, 27, .14); --line-soft: rgba(18, 38, 27, .07);
    --brand: #157347; --brand-deep: #0f5836; --brand-wash: rgba(21, 115, 71, .10);
    --ball: #d8e63f; --ball-ink: #1d2508; --ball-wash: rgba(216, 230, 63, .4);
    --muted: #9db0a3; --on-brand: #ffffff; --on-brand-dim: rgba(255, 255, 255, .86);
    --loss: #c2492c;
  }
  [data-theme="chalk"] .masthead { color: var(--ink); }
  [data-theme="chalk"] .masthead h1 { color: var(--ink); }
  [data-theme="chalk"] .masthead .sub { color: var(--ink-dim); }
  [data-theme="chalk"] {
    --ctl-bg: rgba(18, 38, 27, .06); --ctl-bg-hover: rgba(18, 38, 27, .12);
    --ctl-border: rgba(18, 38, 27, .22); --ctl-fg: #12261b;
    --tabbar-bg: rgba(255, 255, 255, .8);
  }

  [data-theme="chalk"] .tabs button { color: var(--ink-dim); }
  [data-theme="chalk"] .tabs button[aria-selected="true"] { color: var(--ball-ink); }
  [data-theme="chalk"] .plansrc { color: var(--ink-dim); }


  /* ---------- iOS-style settings ---------- */

  /* collapsible sections */
  .journeychart { padding: 20px 16px 16px; }
  .utrline { margin: 10px 0 0; font-size: 14.5px; line-height: 1.55; color: var(--ink-dim); text-wrap: pretty; }
  .utrline b { color: var(--ink); }
  .journeycta { margin: 10px 0 0; font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em;
    text-transform: uppercase; color: var(--brand); }
  .journeychart { cursor: pointer; }
  .journey { display: block; width: 100%; height: auto; margin: 2px 0 4px; }
  .vtop { display: flex; align-items: flex-end; gap: 6px; margin: 2px 0 16px; }
  .vmini { margin: 0; font-family: var(--display); font-weight: 600; font-size: 13px; line-height: 1.3;
    letter-spacing: -.01em; color: var(--ink-dim); white-space: nowrap; }
  .vmini b { font-weight: 800; color: var(--ink); }
  .vmini b { font-weight: 800; opacity: 1; }
  .vnum { font-family: var(--display); font-weight: 800; font-size: 30px; flex: 0 0 auto; letter-spacing: -.03em; color: var(--brand); }
  .vlab { font-family: var(--mono); font-size: 13px; line-height: 1.3; letter-spacing: .02em;
    text-transform: uppercase; color: var(--ink-dim); }
  .vtrack { position: relative; padding-left: 34px; }
  .vtrack::before { content: ""; position: absolute; left: 12px; top: 10px; bottom: 26px; width: 2px; background: var(--line); }
  .vnode { position: relative; padding-bottom: 20px; }
  .vnode > b { display: block; font-size: 16px; font-weight: 700; }
  .vnode small { display: block; margin-top: 3px; font-size: 12.5px; color: var(--ink-dim); line-height: 1.5; }
  .vdot { position: absolute; left: -28px; top: 4px; width: 13px; height: 13px; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--ink-dim); }
  .vnode.now .vdot { left: -30px; width: 17px; height: 17px; background: var(--ball); border: 2px solid var(--brand); }
  .vnode.now b { color: var(--brand); display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .vutr { font-family: var(--display); font-weight: 800; font-size: 15px; color: var(--ink); letter-spacing: -.01em; }
  .vnode.now small b { display: inline; color: var(--ink); font-weight: 700; }
  .vev { margin: 12px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line-soft); }
  .vevtop { display: flex; align-items: center; gap: 8px; }
  .enrol { display: flex; align-items: center; gap: 9px; margin-top: 10px; cursor: pointer;
    font-size: 13.5px; color: var(--ink-dim); }
  .enrol input { width: 18px; height: 18px; accent-color: var(--brand); }
  .btn.small { width: auto; padding: 8px 14px; font-size: 13px; }
  .iosbtn { display: block; width: 100%; margin: 14px 0 0; padding: 13px; border: 0; border-radius: 13px;
    background: var(--brand); color: #fff; font-family: inherit; font-size: 15.5px; font-weight: 600;
    cursor: pointer; }
  .iosbtn:active { opacity: .85; }
  .iosbtn:disabled { opacity: .6; }
  .chip { display: inline-block; padding: 2px 7px; border-radius: 6px; font-family: var(--mono);
    font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-decoration: none; vertical-align: 1px; }
  .chip.ta { background: var(--brand-wash); color: var(--brand); }
  .chip.utr { background: var(--ball-wash); color: var(--ball-ink); }
  .vtop .vnum, .vtop .vlab, .vtop .vmini { font-size: 12px !important; }
  .grp { margin: 0 0 10px; font-family: var(--mono); font-size: 10px; letter-spacing: .07em;
    text-transform: uppercase; color: var(--ink-dim); }
  .fold.mini > summary { padding: 13px 16px; }
  .fold.mini .ftitle { font-size: 14.5px; }
  .fold.mini .fbody { padding: 0 16px 14px; }
  .evkey { margin: 0 0 6px; font-size: 12px; line-height: 1.6; color: var(--ink-dim); }
  .evkey b { color: var(--ink); font-weight: 600; }
  .fold { background: var(--surface); border-radius: 20px; margin-bottom: 14px; overflow: hidden;
    box-shadow: 0 8px 24px -18px rgba(8, 40, 24, .5); }
  .fold.hasnew > summary::after { content: "NEW"; margin-left: 8px; padding: 2px 6px; border-radius: 5px;
    background: var(--ball); color: var(--ball-ink); font-family: var(--mono); font-size: 8.5px;
    font-weight: 700; letter-spacing: .08em; }
  .fold > summary { display: flex; align-items: center; gap: 10px; padding: 17px 20px; cursor: pointer;
    list-style: none; }
  .fold > summary::-webkit-details-marker { display: none; }
  .ftitle { font-family: var(--display); font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
  .fsum { margin-left: auto; font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em;
    text-transform: uppercase; color: var(--ink-dim); }
  .fchev { color: var(--ink-dim); font-size: 15px; transition: transform .2s; }
  .fold[open] .fchev { transform: rotate(90deg); }
  .fbody { padding: 0 20px 18px; }
  .fold[open] > summary { border-bottom: 1px solid var(--line-soft); margin-bottom: 12px; }
  .utrsm { font-size: 15px; font-family: var(--mono); font-weight: 400; letter-spacing: .1em; opacity: .8; }
  .hero.plan .utrbar { margin-top: 12px; height: 9px; border-radius: 6px; background: rgba(255,255,255,.22); overflow: hidden; }
  .hero.plan .utrbar i { display: block; height: 100%; background: var(--ball); border-radius: 6px; }

  .ios-head { margin: 22px 0 7px; padding-left: 16px; font-size: 12.5px; letter-spacing: .02em;
    text-transform: uppercase; color: var(--ink-dim); }
  .ios-group { background: var(--surface); border-radius: 12px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(8, 40, 24, .06); }
  .ios-row { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 11px 16px;
    border-bottom: 1px solid var(--line-soft); font-size: 16px; }
  .ios-row:last-child { border-bottom: 0; }
  .ios-row.col { flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 16px; }
  .ios-row.col b { font-size: 15px; font-weight: 600; }
  .ios-row.col small { font-size: 13px; line-height: 1.5; color: var(--ink-dim); }
  .ios-row.col a { color: var(--brand); }
  .ios-label { flex: 1; min-width: 0; }
  .ios-value { color: var(--ink-dim); font-size: 15px; text-align: right; }
  .ios-btn { appearance: none; border: 0; background: var(--brand-wash); color: var(--brand);
    font-family: inherit; font-size: 14.5px; font-weight: 600; padding: 7px 14px; border-radius: 9px; cursor: pointer; }
  .ios-input { width: 66px; text-align: right; font-family: var(--mono); font-size: 15px; color: var(--ink);
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }
  .ios-foot { margin: 18px 6px 0; font-size: 12.5px; line-height: 1.6; color: var(--ink-dim); text-align: center; }
  .ios-switch { position: relative; display: inline-block; width: 51px; height: 31px; flex: 0 0 51px; }
  .ios-switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .ios-switch span { position: absolute; inset: 0; background: var(--line); border-radius: 16px;
    transition: background .2s; cursor: pointer; }
  .ios-switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
  .ios-switch input:checked + span { background: var(--brand); }
  .ios-switch input:checked + span::after { transform: translateX(20px); }
  .swrow { padding: 14px 16px; }
  .swrow .swatches { width: 100%; }

  /* swatch picker */
  .verline { margin: 14px 0 0; font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); cursor: default; user-select: none; }
  .swatches { display: flex; gap: 10px; margin-top: 4px; }
  .sw { flex: 1; appearance: none; border: 2px solid transparent; border-radius: 12px; padding: 0;
    cursor: pointer; overflow: hidden; background: none; }
  .sw[aria-pressed="true"] { border-color: var(--brand); }
  .sw .band { height: 34px; }
  .sw .nm { display: block; padding: 6px 2px 7px; font-family: var(--mono); font-size: 8.5px;
    letter-spacing: .04em; text-transform: uppercase; color: var(--ink-dim); text-align: center; }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html {
    min-height: 100%;
    background:
      radial-gradient(860px 480px at 86% -16%, rgba(233, 245, 109, .34), transparent 70%),
      radial-gradient(680px 420px at -10% 4%, rgba(255, 255, 255, .10), transparent 62%),
      linear-gradient(176deg, var(--bg-2) 0%, var(--bg) 46%, var(--bg-3) 100%);
    background-attachment: fixed, fixed, fixed;
    background-repeat: no-repeat;
    background-size: cover;
  }
  body {
    margin: 0; font-family: var(--body); font-size: 17px; text-wrap: pretty;
    background: transparent;
    color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: 56px;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }

  .masthead { display: flex; align-items: center; gap: 12px; padding: 14px 0 14px;
    position: sticky; top: 0; z-index: 40; margin: 0 -20px; padding-left: 20px; padding-right: 20px;
    background: color-mix(in srgb, var(--bg-2) 92%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .masthead .who { flex: 1; min-width: 0; }
  .crest { width: 50px; height: 50px; flex: 0 0 50px; border-radius: 15px; background: var(--ball); color: var(--ball-ink);
    display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 17px; }

  .masthead h1 { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.05; margin: 0;
    letter-spacing: -.02em; color: var(--on-brand); }
  .masthead .sub { margin: 5px 0 0; font-size: 12.5px; color: var(--on-brand-dim); font-family: var(--mono);
    line-height: 1.4; text-wrap: pretty; }
  .hbtns { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .hbtn { width: 34px; height: 34px; flex: 0 0 34px; border-radius: 50%;
    border: 1px solid var(--ctl-border); background: var(--ctl-bg); color: var(--ctl-fg);
    display: grid; place-items: center; cursor: pointer; transition: background .15s, transform .15s; }
  .hbtn:hover { background: var(--ctl-bg-hover); }
  .hbtn:active { transform: scale(.94); }
  .hbtn.spin svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .hbtn.spin svg { animation: none; } }

  .toast { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(8px);
    background: var(--brand-deep); color: #ffffff; font-family: var(--mono); font-size: 11.5px; letter-spacing: .03em;
    padding: 11px 18px; border-radius: 999px; z-index: 70; opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease; white-space: nowrap; }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  .setsec { padding: 18px 0; border-top: 1px solid var(--line-soft); }
  .setsec:first-of-type { border-top: 0; padding-top: 4px; }
  .setsec h4 { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-dim); margin: 0 0 12px; font-weight: 400; }
  .passrow { display: flex; gap: 8px; }
  .passrow input { flex: 1; min-width: 0; font-family: var(--mono); font-size: 15px; letter-spacing: .3em;
    color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 13px; }
  .passrow input:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
  .kid, .lrow { cursor: default; }
  button.kid, button.lrow { cursor: pointer; }
  .about { font-family: var(--mono); font-size: 11px; line-height: 1.9; color: var(--ink-dim); }
  .visits { margin-top: 16px; }
  .visits img { height: 22px; display: block; }
  .visits img.hide { display: none; }
  .about a { color: var(--brand); text-decoration: none; }

  .tabs { position: relative; z-index: 10; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
    margin: 0 -20px 26px; padding: 10px 20px; background: var(--tabbar-bg);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { appearance: none; border: 0; background: transparent; cursor: pointer; font-family: var(--mono);
    font-size: 11px; letter-spacing: 0; text-transform: uppercase; color: var(--on-brand-dim); padding: 11px 1px;
    border-radius: 9px; white-space: nowrap; transition: color .15s, background .15s;
    flex: 1 1 0; min-width: 0; text-align: center; overflow: hidden; text-overflow: ellipsis; }
  .tabs button[aria-selected="true"] { color: var(--ball-ink); background: var(--ball); font-weight: 500;
    box-shadow: 0 4px 14px -8px rgba(0, 0, 0, .5); }


  .view { display: none; animation: rise .3s ease both; }
  .view.on { display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .view { animation: none; } }

  .card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 22px; padding: 26px 22px;
    box-shadow: var(--shadow); margin-bottom: 22px; }
  .label { font-family: var(--mono); font-size: 11.5px; letter-spacing: .13em; text-transform: uppercase;
    color: var(--ink-dim); margin: 0 0 18px; display: flex; align-items: center; gap: 8px; }
  .label::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ball); flex: 0 0 8px;
    box-shadow: 0 0 0 1px rgba(16,36,26,.16); }
  .caption { font-size: 14.5px; color: var(--ink-dim); line-height: 1.7; margin: 16px 0 0; text-wrap: pretty; }
  .caption b { color: var(--ink); font-weight: 600; }

  .hero { position: relative; overflow: hidden; border-radius: 26px; padding: 28px 24px; margin-bottom: 20px;
    background: linear-gradient(158deg, var(--hero-1) 0%, var(--hero-2) 55%, var(--hero-3) 100%);
    color: var(--on-brand); box-shadow: var(--shadow); border: 1px solid rgba(245,251,247,.14); }
  .hero .courtlines { position: absolute; inset: 0; opacity: .16; pointer-events: none; }
  .hero .rd { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; position: relative; color: var(--on-brand); }
  .pill { background: rgba(245, 251, 247, .16); border-radius: 999px; padding: 3px 11px; font-size: 10px; letter-spacing: .09em; }
  .pill.today { background: var(--ball); color: var(--ball-ink); font-weight: 600; }
  .hero h2 { position: relative; font-family: var(--display); font-weight: 800; font-size: clamp(30px, 8.4vw, 42px); text-wrap: balance;
    line-height: 1.02; letter-spacing: -.03em; margin: 18px 0 0; }
  .hero h2 small { display: block; font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; opacity: .75; margin-bottom: 9px; }
  .hero .venue { position: relative; font-size: 15.5px; line-height: 1.5; text-wrap: pretty; color: var(--on-brand-dim); margin-top: 12px; }

  .trio { position: relative; display: flex; gap: 14px; margin-top: 24px; }
  .trio .who { text-align: center; flex: 1; }
  .trio .av { width: 52px; height: 52px; margin: 0 auto 9px; border-radius: 50%; background: var(--ball); color: var(--ball-ink);
    display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 17px; }
  .trio .who.em .av { background: rgba(245, 251, 247, .92); color: var(--brand-deep); }
  .trio .nm { font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; color: var(--on-brand-dim); }

  .pager { overflow: hidden; margin-bottom: 14px; transition: height .28s ease; }
  .pages { display: flex; align-items: flex-start; transition: transform .3s cubic-bezier(.22,.61,.36,1); will-change: transform; }
  .pages > * { flex: 0 0 100%; min-width: 0; }
  .pages .card { margin-bottom: 0; }

  .finchip { display: inline-block; margin-left: 6px; padding: 1px 5px; border-radius: 4px;

  .ltable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .ltable th { font-family: var(--mono); font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--ink-dim); font-weight: 500; padding: 0 0 11px; border-bottom: 1px solid var(--line); }
  .ltable td { padding: 12px 0; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }

  .lrow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;

  .lrow .sub2 { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--ink-dim); margin-top: 3px;

  .plrow { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line-soft); }

  .btn { appearance: none; border: 0; cursor: pointer; font-family: var(--mono); font-size: 11px; letter-spacing: .07em;
    text-transform: uppercase; padding: 11px 16px; border-radius: 11px; background: var(--brand); color: #ffffff; }
  .btn.ghost { background: var(--surface-2); color: var(--ink); }

  .strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }

  footer { margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--line-soft); font-family: var(--mono);

  .tblwrap { overflow-x: auto; margin: 0 -6px; }
</style>

function resultsFor(team) {
  const out = [];
  DATA.results.forEach((r) => r.matches.forEach((m) => {
    if (m.home !== team && m.away !== team) return;
    const home = m.home === team;
    let res;
    if (m.washout) res = "wo";
    else {
      const mine = home ? m.homePts : m.awayPts, theirs = home ? m.awayPts : m.homePts;
      res = mine > theirs ? "w" : mine < theirs ? "l" : "d";
    }
    out.push({ round: r.round, date: r.date, res, home, opp: home ? m.away : m.home, m });
  }));
  return out.sort((a, b) => b.round - a.round);
}

const normName = (v) => String(v || "").toLowerCase().replace(/[^a-z ]/g, " ").replace(/\s+/g, " ").trim();

function nameScore(input, candidate) {
  const a = normName(input).split(" ").filter(Boolean);
  const b = normName(candidate).split(" ").filter(Boolean);
  if (!a.length || !b.length) return 0;
  const [short, long] = a.length <= b.length ? [a, b] : [b, a];
  const hit = (w) => long.some((x) => x === w || (w.length >= 3 && x.startsWith(w.slice(0, 3))));
  if (short.every(hit)) return short.length === long.length ? 1 : 0.9;
  return short.filter(hit).length / Math.max(a.length, b.length);
}

function knownNames() {
  const set = new Set(Object.keys(DATA.section_players || {}));
  (DATA.match_details || []).forEach((m) => {
    [...(m.home_players || []), ...(m.away_players || [])].forEach((n) => {
      if (n && !/^no player/i.test(n)) set.add(n);
    });
  });
  (roster.players || []).forEach((p) => set.add(p.name));
  return [...set];
}

function matchName(input) {
  const target = String(input || "").trim();
  if (!target) return "";
  let best = null, score = 0;
  knownNames().forEach((n) => {
    const sc = nameScore(target, n);
    if (sc > score) { score = sc; best = n; }
  });
  return score >= 0.8 ? best : target;
}

function recordFor(name) {
  const hit = (DATA.section_players || {})[name];
  if (!hit || !hit.rubbers) return null;
  return hit;
}

function playingFor(round) {
  const rr = rosterRound(round);
  if (!rr) return { playing: [], sitting: [], added: [], edited: false };
  const e = editsFor(round);
  const added = e.add || [];
  const playing = (rr.in || []).filter((n) => !(e.out || []).includes(n)).concat(added);
  const sitting = [...new Set([...(rr.out || []), ...(rr.unavailable || []), ...(e.out || [])])]
    .filter((n) => !playing.includes(n));
  return { playing, sitting, added, edited: (e.out || []).length + added.length > 0 };
}
function planFor(firstName, n) {
  const r = rosterRound(n);
  if (!r) return "none";
  if ((r.in || []).includes(firstName)) return "in";
  if ((r.unavailable || []).includes(firstName)) return "un";
  if ((r.out || []).includes(firstName)) return "out";
  return "none";
}

function deriveTotals() {
  ourResults = resultsFor(CLUB);
  playerResults = DATA.section_players || {};
  us = DATA.ladder.find((t) => t.isUs) || us;
  completedRounds = ourResults.filter((r) => r.res !== "wo");
  teamSetsFor = us.sets_for; teamSetsAgainst = us.sets_against;
  setPct = Math.round((100 * teamSetsFor) / Math.max(1, teamSetsFor + teamSetsAgainst));
  gamePct = Math.round((100 * us.games_for) / Math.max(1, us.games_for + us.games_against));
  pointsPerRound = (us.pts / Math.max(1, ourResults.length)).toFixed(1);
  winRate = completedRounds.length ? Math.round((100 * completedRounds.filter((r) => r.res === "w").length) / completedRounds.length) : 0;
  squad = (roster.players || []).map((p) => {
    const f = first(p.name);
    const inR = [], outR = [], unR = [];
    (roster.rounds || []).forEach((r) => {
      if ((r.in || []).includes(f)) inR.push(r.round);
      else if ((r.unavailable || []).includes(f)) unR.push(r.round);
      else if ((r.out || []).includes(f)) outR.push(r.round);
    });
    const line = playerLine(p.name);
    return { ...p, inCount: inR.length, outCount: outR.length, unCount: unR.length,
      scheduled: (roster.rounds || []).length || 1, line };
  });
}

  const oppSquad = atHome ? m.away_players : m.home_players;
  const oppName = atHome ? m.away : m.home;
  const byFirst = {};
  (roster.players || []).forEach((pl) => { byFirst[first(pl.name).toLowerCase()] = pl.name; });
  const ourName = (n) => byFirst[first(n || "").toLowerCase()] || (recordFor(n) ? matchName(n) : n);

  const squadRows = [0, 1, 2].map((i) => `<tr>

      <tbody>${rubberRows}</tbody>
      <tfoot>
        <tr class="tot"><td class="lb">Total games</td><td class="sc">${ourGames}–${oppGames}</td><td class="lb r"></td></tr>
        <tr class="tot"><td class="lb">Total sets</td><td class="sc">${ourSets}–${oppSets}</td><td class="lb r"></td></tr>

let teamTab = "ladder";

function pointsRace() {
  const rounds = [...new Set((DATA.results || []).map((r) => r.round))].sort((a, b) => a - b);
  const teams = [...DATA.ladder].sort((a, b) => a.pos - b.pos).map((t) => t.team);
  const cum = {}, series = {};
  teams.forEach((t) => { cum[t] = 0; series[t] = []; });
  rounds.forEach((rd) => {
    const r = (DATA.results || []).find((x) => x.round === rd);
    (r && r.matches || []).forEach((m) => {
      const hp = m.washout ? 4 : (m.homePts || 0);
      const ap = m.washout ? 4 : (m.awayPts || 0);
      if (cum[m.home] !== undefined) cum[m.home] += hp;
      if (cum[m.away] !== undefined) cum[m.away] += ap;
    });
    teams.forEach((t) => series[t].push(cum[t]));
  });
  return { rounds, teams, series };
}

function raceChart() {
  const { rounds, teams, series } = pointsRace();
  if (rounds.length < 2) {
    return `<p class="caption" style="margin-top:0">The chart appears once two rounds have been played.</p>`;
  }
  const W = 330, H = 190, padL = 24, padR = 8, padT = 10, padB = 22;
  const maxY = Math.max(8, ...teams.map((t) => series[t][series[t].length - 1]));
  const x = (i) => padL + (i * (W - padL - padR)) / (rounds.length - 1);
  const y = (v) => padT + (1 - v / maxY) * (H - padT - padB);

  const grid = [0, Math.round(maxY / 2), maxY].map((v) =>
    `<line x1="${padL}" y1="${y(v)}" x2="${W - padR}" y2="${y(v)}" stroke="var(--line-soft)" stroke-width="1"/>
     <text x="${padL - 5}" y="${y(v) + 3}" text-anchor="end" class="ax">${v}</text>`).join("");

  const ticks = rounds.filter((r, i) => rounds.length <= 6 || i % Math.ceil(rounds.length / 5) === 0 || i === rounds.length - 1)
    .map((r) => `<text x="${x(rounds.indexOf(r))}" y="${H - 6}" text-anchor="middle" class="ax">${r}</text>`).join("");

  const palette = ["#7fb79b", "#a8c7a0", "#c9b98a", "#9bb3c7", "#c7a2a2", "#a9a2c7", "#8fbfb3", "#b8b8a8"];
  const lines = teams.map((t, i) => {
    const mine = t === CLUB;
    const pts = series[t].map((v, j) => `${x(j)},${y(v)}`).join(" ");
    const colour = mine ? "var(--brand)" : palette[i % palette.length];
    const last = series[t][series[t].length - 1];
    return `<polyline points="${pts}" fill="none" stroke="${colour}" stroke-width="${mine ? 3 : 1.6}"
        stroke-linejoin="round" stroke-linecap="round" opacity="${mine ? 1 : .85}"/>
      <circle cx="${x(series[t].length - 1)}" cy="${y(last)}" r="${mine ? 3.4 : 2.2}" fill="${colour}"/>`;
  }).join("");

  const legend = [...teams]
    .map((t, i) => ({ t, i, last: series[t][series[t].length - 1] }))
    .sort((a, b) => b.last - a.last)
    .map(({ t, i, last }) => `<div class="lg ${t === CLUB ? "us" : ""}">
        <i style="background:${t === CLUB ? "var(--brand)" : palette[i % palette.length]}"></i>
        <span>${esc(t)}</span><b>${last}</b></div>`).join("");

  return `<svg class="race" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative points by round">
      ${grid}${ticks}${lines}
    </svg>
    <div class="legendlist">${legend}</div>`;
}

function totalsFor(list) {
  let w = 0, l = 0, gw = 0, gl = 0, sw = 0, sl = 0;
  list.forEach((m) => {
    if (m.won) w++; else l++;
    gw += m.gw || 0; gl += m.gl || 0;
    const st = parseSets(m.score || "");
    sw += st.sw; sl += st.sl;
  });
  return { w, l, gw, gl, sw, sl, n: w + l };
}

function parseSets(txt) {
  const nums = String(txt).match(/\d+/g) || [];
  let sw = 0, sl = 0;
  for (let i = 0; i + 1 < nums.length; i += 2) {
    if (Number(nums[i]) > Number(nums[i + 1])) sw++; else sl++;
  }
  return { sw, sl };
}

function parseScore(txt) {
  const nums = String(txt).match(/\d+/g) || [];
  let gw = 0, gl = 0;
  for (let i = 0; i + 1 < nums.length; i += 2) {
    gw += Number(nums[i]); gl += Number(nums[i + 1]);
  }
  return { gw, gl };
}

let ladderSort = "team"; // "team" = the site's order, then games | "games" | "pct" | "sets"
const teamPos = {};
DATA.ladder.forEach((t) => { teamPos[t.team] = t.pos; });

function ladderRowsAll(mode) {
  const m = mode || ladderSort;
  const all = Object.values(DATA.section_players || {}).filter((p) => p.rubbers > 0);
  return all.sort((a, b) => {
    if (m === "team") {
      const ta = teamPos[a.team] || 99, tb = teamPos[b.team] || 99;
      return (ta - tb) || (b.games_won - a.games_won) || a.name.localeCompare(b.name);
    }
    if (m === "pct") {
      return (b.set_pct - a.set_pct) || ((b.game_pct || 0) - (a.game_pct || 0)) || a.name.localeCompare(b.name);
    }
    if (m === "sets") {
      return (b.sets_won - a.sets_won) || (b.games_won - a.games_won) || a.name.localeCompare(b.name);
    }
    return (b.games_won - a.games_won)
      || ((b.games_won - b.games_lost) - (a.games_won - a.games_lost))
      || a.name.localeCompare(b.name);
  });
}
function rankOf(name) {
  const rows = ladderRowsAll("games");
  const i = rows.findIndex((r) => r.name === name);
  return i < 0 ? null : { rank: i + 1, total: rows.length };

    .sort((a, b) => (posOf[a.team] || 99) - (posOf[b.team] || 99) || a.name.localeCompare(b.name));

  let body = "", team = null;
  rows.forEach((p) => {
    if (p.team !== team) {
      team = p.team;
      body += `<tr class="teamhead ${team === CLUB ? "us" : ""}">
        <td class="tpos">${posOf[team] || ""}</td>
        <td class="pl" colspan="2"><span class="tn">${esc(team)}</span></td>
      </tr>`;
    }
    body += `<tr class="${team === CLUB ? "us" : ""}" data-explain="${esc(p.name)}">
      <td class="tpos"></td>
      <td class="pl">
        <span class="pn">${esc(p.name)}</span>
        <span class="pbar"><i style="width:${Math.max(2, p.set_pct)}%"></i></span>
        <span class="pmeta">${p.sets_won} of ${p.rubbers} sets · ${p.games_won}–${p.games_lost} games</span>
      </td>
      <td class="rate">${p.set_pct}%</td>
    </tr>`;
  });

  return `<div class="tblwrap"><table class="ptable">
      <thead><tr>
        <th class="tpos"></th><th class="pl">Player<span class="thsub">share of sets won</span></th><th class="rate">Won</th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table></div>
    <p class="caption">Listed in the order of the official ladder — clubs from top to bottom, players
    alphabetically within each club. The bar is the share of sets that child has won, so a 3-set record and a
    6-set record sit on the same scale.</p>`;
}

let openClubs = new Set([CLUB]);

function teamsTable() {
  const sorted = [...DATA.ladder].sort((a, b) => a.pos - b.pos);
  const mine = sorted.find((t) => t.isUs);
  const fourth = sorted[3];
  const level = sorted.find((t) => t.pos !== mine.pos && t.pts === mine.pts);
  const roundsLeft = DATA.draw.filter((d) => d.date >= todayISO()).length;
  const clear = mine.pts - fourth.pts;

  const byTeam = {};
  Object.values(DATA.section_players || {}).filter((p) => p.rubbers > 0).forEach((p) => {
    (byTeam[p.team] = byTeam[p.team] || []).push(p);
  });

  const rows = sorted.map((t) => {
    const fin = t.pos <= 4;
    const open = openClubs.has(t.team);
    const players = (byTeam[t.team] || []).sort((a, b) => a.name.localeCompare(b.name));

    let out = `<tr class="clubrow ${t.isUs ? "us" : ""} ${open ? "open" : ""}" data-club="${esc(t.team)}">
      <td class="pos">${t.pos}</td>
      <td class="pl"><span class="plinner">
        <span class="pn inline">${esc(t.team)}</span>${fin ? `<span class="finchip">finals</span>` : ""}
        <span class="chev" aria-hidden="true">▸</span></span></td>
      <td class="num">${t.pts.toFixed(1)}</td>
      <td class="num">${pct(t.pct)}</td>
    </tr>`;

    if (open) {
      out += players.map((p) => `<tr class="prow2 ${t.isUs ? "us" : ""}" data-explain="${esc(p.name)}">
        <td class="pos"></td>
        <td class="pl"><span class="prowinner">
          <span class="pblock">
            <span class="pn2">${esc(p.name)}</span>
            <span class="pbar"><i style="width:${Math.max(2, p.set_pct)}%"></i></span>
            <span class="pmeta">${p.sets_won} of ${p.rubbers} sets · ${p.games_won}–${p.games_lost} games</span>
          </span>
          <span class="chev" aria-hidden="true">▸</span></span>
        </td>
        <td class="rate2">${p.set_pct}%</td>
      </tr>`).join("");
    }

    if (t.pos === 4) out += `<tr class="cutrow"><td colspan="4"><span>finals cut</span></td></tr>`;
    return out;
  }).join("");

  return `<div class="tblwrap"><table class="ptable">
      <thead><tr><th class="pos">#</th><th class="pl">Team<span class="thsub">tap a club, then a player</span></th><th class="num">Pts</th><th class="num">%</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <p class="caption">The official ladder from TROLS, with the top four marked for finals. Tap a club to see its
    players. You are <b>${clear.toFixed(1)} points clear</b> of the cut with <b>${roundsLeft} rounds</b> left${level ? `, and level with ${esc(level.team)} on points` : ""}.
    Percentage is games won ÷ games lost.</p>`;
}

function clubClash(ev) {
  const start = parseDate(ev.d), end = parseDate(ev.e2 || ev.d);
  const hit = DATA.draw.find((r) => {
    const rd = parseDate(r.date);
    return rd >= start && rd <= end;
  });
  return hit ? hit.round : null;
}

function inClubBreak(ev) {
  const start = parseDate(ev.d);
  return start >= parseDate("2026-12-14") && start <= parseDate("2027-01-30");
}

function daysTo(iso) {
  if (!iso) return null;
  const t = parseDate(todayISO()), d = parseDate(iso);
  return Math.round((d - t) / 86400000);
}

function closeLabel(iso) {
  const n = daysTo(iso);
  if (n === null) return `<span class="due none">date TBA</span>`;
  if (n < 0) return `<span class="due past">closed ${Math.abs(n)}d ago</span>`;
  if (n === 0) return `<span class="due now">closes today</span>`;
  if (n <= 7) return `<span class="due now">closes in ${n}d</span>`;
  if (n <= 21) return `<span class="due soon">closes in ${n}d</span>`;
  return `<span class="due">closes in ${n}d</span>`;
}

let LIVE = null;
function liveEvents() {
  if (!LIVE) return null;
  return LIVE.map((e) => ({
    n: e.name, d: e.date, u: e.url, src: e.src,
    s: e.where || "", dr: e.km != null ? `${e.km} km` : "",
    e: e.src === "utr" ? "UTR event" : "Tennis Australia",
    t: /jds/i.test(e.name) ? "JDS" : /j?250/i.test(e.name) ? "J250"
      : /j?125/i.test(e.name) ? "J125" : /jc\b/i.test(e.name) ? "JC"
      : e.src === "utr" ? "UTR" : "Open",
    ball: e.ball || "yellow",
    dropped: e.dropped || null,
    p: (() => {
      const my = MY_UTR || 0;
      const TOL = my < 2 ? 1.0 : my < 3 ? 1.2 : my < 4 ? 1.4 : my < 5 ? 1.6 : 1.8;
      if (e.utrMin != null && e.utrMax != null) {
        if (my >= e.utrMin && my <= e.utrMax) return "Start here";        // fits now
        if (my > e.utrMax && my - e.utrMax >= 0.5) return "Easy";          // comfortably below him
        if (my < e.utrMin) {
          return (e.utrMin - my) <= TOL ? "Target" : "Later";              // stretch grows with him
        }
        return "Target";
      }
      if (e.src === "utr") return "Start here";
      if (/jds|jc\b/i.test(e.name)) return "Start here";
      if (/j?125/i.test(e.name)) return "Target";
      return "Later";
    })(),
    fit: (() => {
      const my = MY_UTR || 0;
      if (e.utrMin != null && e.utrMax != null) {
        if (my >= e.utrMin && my <= e.utrMax) return 100;
        const off = my < e.utrMin ? e.utrMin - my : my - e.utrMax;
        return Math.max(0, 100 - off * 40);
      }
      if (e.src === "utr") return 80;
      if (/jds|jc\b/i.test(e.name)) return 85;
      if (/j?125/i.test(e.name)) return 55;
      return 30;
    })(),
    c: null, e2: e.date,
  }));
}

  if (!pathUnlocked()) return `<div class="card"><p class="caption" style="margin:0">Locked.</p></div>`;

  const t = matchTotals();
  const gap = Math.round((TARGET_UTR - MY_UTR) * 10) / 10;

  const today = todayISO();
  const SOURCE = liveEvents() || [];
  const up = SOURCE.filter((e) => e.d >= today).sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0));
  const ok = up.filter((e) => !e.dropped && !PASSED.includes(e.n));   // eligible and not passed over
  const enteredUp = ok.filter((e) => isEntered(e.n));

          <small><b>${t.n}</b> matches · <b>${t.w}</b> won · <b>${t.l}</b> lost · <b>${t.gw}</b> games won</small>
        </div>
        <div class="vnode goal"><span class="vdot"></span>
          <b>${TARGET_UTR.toFixed(1)} · next goal</b>

      </div>

        <a href="https://tournaments.tennis.com.au/player-profile/1db032e5-eae1-4b8c-bf8c-eea7b0537a6e/tournaments" target="_blank" rel="noopener">TA record ›</a>
      </div>
    </div>
`;

  /* ---- all events ---- */
  const stamp = window.__eventsStamp

  const evKey = `<details class="fold mini">

    <div class="fbody">
      <p class="evkey">Tennis Australia and UTR events, merged and sorted by date — the tag tells you how each one fits.</p>
      <p class="evkey"><b>Book now</b> — enter these · <b>Good target</b> — a stretch worth taking ·

  const evBody = evKey + up.map((e) => {
    const pr = PRIORITY[e.p] || { label: e.p, cls: "" };

    do not move the rating. They still count as matches played.</p>
    ${clubMatches().slice(0, 20).map(rowHTML).join("")}`;

  return dash
    + fold("events", "All events", `${up.length} ahead`, evBody, false)
    + fold("matches", "My Score Card", `${t.w}W · ${t.l}L`, matchBody, false)
    + fold("target", "Goals",
        `now ${MY_UTR != null ? MY_UTR.toFixed(1) : "—"} → ${TARGET_UTR.toFixed(1)}`,
        (() => {
          const gap = Math.max(0, TARGET_UTR - (MY_UTR || 0));

    + fold("ajp", "After this",
        (() => {
          const team = clubMatches().length;
          const ready = team >= 6 && (MY_UTR || 0) >= 3.0;
          return ready ? "ready" : `${Math.max(0, 6 - team)} team matches to go`;
        })(),
        (() => {

          const ratingOk = (MY_UTR || 0) >= 3.0;
          return `<div class="prow"><b>Association Junior Pennant</b>
              <span>Sunday teams graded by UTR, against other associations. Target: the 2027/28 season.</span></div>
            <div class="prow"><b>Team matches: ${team} of 6</b>
              <span>${need ? `${need} more for a club to nominate him.` : "Enough for a nomination."}</span></div>
            <div class="prow"><b>Rating: ${MY_UTR != null ? MY_UTR.toFixed(1) : "—"} of 3.0</b>
              <span>${ratingOk ? "Above the AJP entry threshold." : `${(3.0 - (MY_UTR || 0)).toFixed(1)} short of the entry threshold.`}</span></div>`;
        })(), false)
    + fold("watch", "Watch for",
        (() => {

          return `<p class="caption" style="margin-top:0">The 2027 Australian Competitive Play Junior Regulations

    + `<p class="plansrc">Drive times are estimates from Carnegie 3163. Confirm every deadline on the tournament page before paying.</p>`;

function explainSheet(name) {
  const rows = ladderRowsAll();
  const i = rows.findIndex((r) => r.name === name);
  if (i < 0) return "";
  const p = rows[i];
  const pos = i + 1;
  const above = rows.slice(0, i);
  const next = i > 0 ? rows[i - 1] : null;
  const sameGames = above.filter((r) => r.games_won === p.games_won);
  const detail = ((DATA.our_players || {})[name] || {}).detail || [];
  const sets = detail.flatMap((d) => (d.rubbers || []).map((rb) => ({ ...rb, round: d.round, opp: d.opponent_team })));
  const totalG = p.games_won + p.games_lost;
  const faced = [...new Set(detail.map((d) => d.opponent_team))];
  const steps = [];
  let stepNo = 0;
  const step = (body) => { stepNo += 1; return `<div class="step"><span class="num">${stepNo}</span><span class="body">${body}</span></div>`; };

  steps.push(step(`<span class="big">${p.games_won} games won</span><br>
    out of ${totalG} played — <b>${p.game_pct || 0}%</b> — across ${p.rubbers} sets${faced.length ? `, against ${faced.map(esc).join(" and ")}` : ""}.
    ${p.sets_won}–${p.sets_lost} on sets.`));

  if (!above.length) {
    steps.push(step(`Nobody in the section has won more games, so this is <b>1st</b>.`));
  } else {
    const more = above.filter((r) => r.games_won > p.games_won);
    let line = more.length
      ? `<b>${more.length}</b> ${more.length === 1 ? "player has" : "players have"} won more games —
         ${more.slice(0, 3).map((r) => `${esc(first(r.name))} ${r.games_won}`).join(", ")}${more.length > 3 ? " and others" : ""}.`
      : `Nobody has won more games than ${esc(first(p.name))} (${p.games_won}).`;
    if (sameGames.length) {
      line += ` Level on ${p.games_won} games with ${sameGames.map((r) => esc(first(r.name))).join(", ")}, so the better win–loss difference goes higher.`;
    }
    line += ` This is <b>${pos}${ordinal(pos)}</b> of ${rows.length}.`;
    steps.push(step(line));
  }

  if (next) {
    if (next.games_won > p.games_won) {
      const need = next.games_won - p.games_won + 1;
      steps.push(step(`<b>${need}</b> more game${need === 1 ? "" : "s"} won puts ${esc(first(p.name))} level with
        ${esc(first(next.name))} (${next.games_won}).`));
    } else {
      const gap = (next.games_won - next.games_lost) - (p.games_won - p.games_lost);
      steps.push(step(`Level with ${esc(first(next.name))} on ${p.games_won} games. Their difference is
        ${gap > 0 ? "+" + gap : gap}, so winning a few more than them moves ${esc(first(p.name))} ahead.`));
    }
  }

  if (sets.length) {
    const wins = sets.filter((r) => r.won).sort((a, b) => (a.ours - a.theirs) - (b.ours - b.theirs));
    const losses = sets.filter((r) => !r.won);
    const bits = [];
    const margins = [...new Set(wins.map((w) => `${w.ours}–${w.theirs}`))];
    if (wins.length) {
      bits.push(margins.length === 1
        ? `every set won <b>${margins[0]}</b>`
        : `closest set <b>${wins[0].ours}–${wins[0].theirs}</b> vs ${esc(wins[0].opp)}`);
    }
    if (losses.length) bits.push(`lost <b>${losses.map((l) => `${l.ours}–${l.theirs}`).join(", ")}</b> vs ${esc(losses[0].opp)}`);
    if (bits.length) steps.push(step(`The detail: ${bits.join("; ")}.`));
  }

  return `
    <div class="grab"></div>
    <button class="ovclose" data-close="1" aria-label="Close">×</button>
    <h3 class="ovtitle" id="ovTitle">Why ${esc(first(p.name))} is ${pos}${ordinal(pos)}</h3>
    <p class="ovsub">${esc(p.team)} · Open Triples Green Ball 1</p>
    ${steps.join("")}
    <p class="ovfoot">The ladder counts <b>games won</b>. A comfortable win is worth more games than a tight one.</p>`;
}

function viewPlayer(name) {
  const p = (DATA.our_players || {})[name] || (DATA.section_players || {})[name];
  if (!p) return `<div class="card"><p class="caption">No sets recorded for ${esc(name)} yet.</p></div>`;
  const r = rankOf(name);
  const pctShown = p.set_pct != null ? Math.round(p.set_pct) : 0;

  const rounds = (p.detail || []).slice().sort((a, b) => b.round - a.round).map((d) => {
    const rubbers = d.rubbers.map((rb) => {
      const real = (rb.opponents || []).filter((o) => !/^no player/i.test(o));
      const who = rb.type === "singles"
        ? `vs ${esc(real[0] || "opponent")}`
        : `with ${esc(first(rb.partner || ""))} vs ${real.length ? real.map((o) => esc(first(o))).join(" & ") : "opponent"}`;
      return `<tr>
        <td class="lbl">${rb.type === "singles" ? "Singles" : "Doubles"}</td>
        <td class="who">${who}</td>
        <td class="num won">${rb.ours}</td>
        <td class="num lost">${rb.theirs}</td>
      </tr>`;
    }).join("");
    return `<div class="pround">
      <div class="prh"><b>Round ${d.round}</b><span>${fmtDate(d.date)} · vs ${esc(d.opponent_team)}</span></div>
      <table class="stats sets">
        <thead><tr><th>Set</th><th>Against</th><th>Won</th><th>Lost</th></tr></thead>
        <tbody>${rubbers}</tbody>
      </table>
    </div>`;
  }).join("");

  return `
    <div class="card">
      <button class="back" id="backBtn">‹ Squad</button>
      <div class="phead">
        <div class="pname">${esc(p.name)}</div>
        <div class="pteam">${esc(p.team)}${r ? ` · ${r.rank}${ordinal(r.rank)} of ${r.total} in the section` : ""}</div>
        ${r ? `<button class="whyr" data-explain="${esc(p.name)}">Why ${esc(first(p.name))} is ${r.rank}${ordinal(r.rank)} ›</button>` : ""}
      </div>
      <div style="display:flex;justify-content:center;padding:4px 0 0">
        ${ring(pctShown, 100, pctShown + "%", "sets won")}
      </div>
      <table class="stats">
        <thead><tr><th>Record</th><th>Won</th><th>Lost</th></tr></thead>
        <tbody>
          <tr><td class="lbl">Sets</td><td class="num won">${p.sets_won}</td><td class="num lost">${p.sets_lost}</td></tr>
          <tr><td class="lbl">Games</td><td class="num won">${p.games_won}</td><td class="num lost">${p.games_lost}</td></tr>
          <tr><td class="lbl">Singles</td><td class="num won">${p.singles_won}</td><td class="num lost">${p.singles_played - p.singles_won}</td></tr>
          <tr><td class="lbl">Doubles</td><td class="num won">${p.doubles_won}</td><td class="num lost">${p.doubles_played - p.doubles_won}</td></tr>
        </tbody>
      </table>
      <p class="caption">A set is first to six games, so the games column counts every individual game across those sets.
      Won plus lost gives how many were played.</p>
    </div>
    <div class="card">
      <p class="label">Every set</p>
      ${rounds || `<p class="caption">No sets recorded yet.</p>`}
    </div>`;
}

function resultsView() {
  const blocks = DATA.results.map((r) => {

      const hWin = m.homePts > m.awayPts;
      return `<div class="mt ${ours ? "ours" : ""}">
        <span class="nm" style="${hWin ? "font-weight:700" : ""}">${esc(m.home)}</span>

function drawView() {
  const t = todayISO();
  const nextNo = nextRound().round;
  const row = (d) => {
    const past = d.date < t, isToday = d.date === t, isNext = d.round === nextNo && !past;
    const rr = rosterRound(d.round);
    const trio = rr ? (rr.in || []).map(first).join(", ") : "";
    const who = d.opponent ? `${d.homeAway === "H" ? "vs" : "at"} ${esc(d.opponent)}` : "Opponent TBC";
    const rr2 = resultForRound(d.round);
    const resTxt = d.result
      || (rr2 ? (rr2.res === "wo" ? "wash out" : rr2.res === "w" ? "won" : rr2.res === "l" ? "lost" : "drawn") : "");
    const resCls = rr2 ? (rr2.res === "w" ? "won" : rr2.res === "l" ? "lost" : "wo") : "";
    return `<li class="${past ? "past" : ""} ${isToday ? "today" : ""} ${isNext ? "next" : ""}">
      <span class="rn">${d.round}</span>
      <span class="who">${who}<small>${fmtDate(d.date)}${d.homeAway ? " · " + (d.homeAway === "H" ? "home" : "away") : ""}${trio ? " · " + esc(trio) : ""}</small></span>
      <span class="res ${resCls}">${esc(resTxt)}</span></li>`;
  };
  const upcoming = DATA.draw.filter((d) => d.date >= t).map(row).join("");
  const earlier = DATA.draw.filter((d) => d.date < t).map(row).join("");
  const finals = DATA.finals.map((f) => `<li><span class="rn">—</span><span class="who">${esc(f.label)}<small>${fmtDate(f.date)}</small></span><span class="res"></span></li>`).join("");
  const pastCount = DATA.draw.filter((d) => d.date < t).length;
  return `<div class="card"><p class="label">Season draw</p>
    ${pastCount ? `<details class="pastwrap"><summary>Earlier rounds · ${pastCount} played</summary>
      <ul class="tl">${earlier}</ul></details>` : ""}
    <ul class="tl">${upcoming}${finals}</ul>
  </div>`;
}

function viewClubs() {

}
function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function alertsOn() { return ("Notification" in window) && Notification.permission === "granted" && localStorage.getItem(NOTIFY_KEY) === "1"; }

async function refreshEvents() {
  const btn = $("#harvestBtn");
  if (btn) { btn.disabled = true; btn.textContent = "Checking…"; }
  try {
    const r = await fetch(`https://raw.githubusercontent.com/akshaybangalorekar/green-ball-1/main/events_map.json?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error("no map");
    const map = (await r.json()).events || {};
    let filled = 0;
    PLAN_EVENTS.forEach((e) => {
      if (e.u) return;
      const hit = Object.keys(map).find((n) => n.toLowerCase().includes(e.n.toLowerCase().slice(0, 12)));
      if (hit) { e.u = map[hit]; filled++; }
    });
    try { localStorage.setItem("em-gb1-map", JSON.stringify(map)); } catch (err) {}
    renderAll();
    showToast(filled ? `${filled} links added` : "No new links yet");
  } catch (err) {
    showToast("Could not reach the list");
    if (btn) { btn.disabled = false; btn.textContent = "Refresh events"; }
  }
}

async function enableAlerts() {
  try {
    const perm = await Notification.requestPermission();
    if (perm === "granted") {
      localStorage.setItem(NOTIFY_KEY, "1");
      const reg = swReg || (navigator.serviceWorker && await navigator.serviceWorker.ready);
      if (reg) {
        if (reg.active) reg.active.postMessage({ type: "check" });
        reg.showNotification(APP_NAME + " alerts on", {
          body: "We'll tell you when results, the ladder or the fixture change.",
          icon: "icon-192.png", badge: "icon-192.png", tag: "gb1-welcome",
        });
      }

  } catch (e) {}
  if ($("#overlay") && $("#overlay").classList.contains("on")) openSettings();
  else renderAll();
}

async function initApp() {
  if (!("serviceWorker" in navigator)) return;
  try {
    swReg = await navigator.serviceWorker.register("sw.js", { scope: "./" });

      try { await navigator.periodicSync.register("check-updates", { minInterval: 12 * 60 * 60 * 1000 }); } catch (e) {}

}

function ymdLocal(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function matchReminderText() {
  const nr = nextRound();
  if (!nr || !nr.opponent) return null;
  const days = Math.round((parseDate(nr.date) - parseDate(ymdLocal(new Date()))) / 86400000);
  if (days < 0 || days > 3) return null;
  const now = new Date();
  const day = now.getDay(), hr = now.getHours();
  const window_ = (day === 5 && hr >= 18) || day === 6 || (day === 0 && hr < 18);
  if (!window_) return null;
  const atHome = nr.homeAway === "H";
  const opp = clubByName(nr.opponent);
  const ourClub = clubByName(CLUB);
  const place = cleanPlace(atHome ? (ourClub && ourClub.venue) : (opp && opp.venue));
  const trio = playingFor(nr.round).playing.map((n) => first(n)).join(", ");
  return {
    round: nr.round,
    title: `Sunday: ${atHome ? "v" : "at"} ${nr.opponent}`,
    body: [place, trio].filter(Boolean).join(" · "),
  };
}

async function maybeRemind() {
  if (!alertsOn()) return;
  const msg = matchReminderText();
  if (!msg) return;
  const key = "em-gb1-reminded-" + msg.round;
  if (localStorage.getItem(key) === "1") return;
  try {
    const reg = swReg || await navigator.serviceWorker.ready;
    reg.showNotification(msg.title, {
      body: msg.body, icon: "icon-192.png", badge: "icon-192.png",
      tag: "gb1-match-" + msg.round, data: { url: "./" },
    });
    localStorage.setItem(key, "1");
  } catch (e) {}
}

function sigOf(d) {
  const draw = (d.draw || []).map((x) => x.opponent || "-").join(",");
  return [d.meta.ladder_loaded, d.results.length, draw].join("|");
}

const NSTATE = "em-gb1-notif-state-v1";

function notifState() {
  try { return JSON.parse(localStorage.getItem(NSTATE) || '{"wash":[],"finals":false}'); }
  catch (e) { return { wash: [], finals: false }; }
}
function saveNotifState(st) { try { localStorage.setItem(NSTATE, JSON.stringify(st)); } catch (e) {} }

function ourWashRounds(d) {
  return (d.results || [])
    .filter((r) => (r.matches || []).some((m) => m.washout && (m.home === CLUB || m.away === CLUB)))
    .map((r) => r.round);
}

function finalsSecured(d) {
  const ladder = [...(d.ladder || [])].sort((a, b) => a.pos - b.pos);
  const mine = ladder.find((t) => t.isUs);
  const fifth = ladder[4];
  if (!mine || !fifth) return false;
  const played = new Set((d.results || []).map((r) => r.round));
  const remaining = (d.draw || []).filter((x) => !played.has(x.round)).length;
  return mine.pts > fifth.pts + 8 * remaining;
}

async function pushNote(body, tag) {
  try {
    const reg = swReg || await navigator.serviceWorker.ready;
    reg.showNotification(APP_NAME, { body, icon: "icon-192.png", badge: "icon-192.png", tag });
  } catch (e) {}
}

async function noteUpdate(fresh) {
  const prev = localStorage.getItem(SIG_KEY);
  const before = notifState();
  const washNow = ourWashRounds(fresh);
  const newWash = washNow.filter((r) => !(before.wash || []).includes(r));
  const securedNow = finalsSecured(fresh);
  const justSecured = securedNow && !before.finals;
  saveNotifState({ wash: washNow, finals: securedNow });

  localStorage.setItem(SIG_KEY, sigOf(fresh));
  if (!prev || prev === sigOf(fresh) || !alertsOn()) return;

  if (newWash.length) {
    const r = newWash[newWash.length - 1];
    return pushNote(`Round ${r} washed out — no play.`, "gb1-wash-" + r);
  }
  if (justSecured) return pushNote("Finals secured — you're in the top four.", "gb1-finals");

  const [prevLoad, prevRounds] = prev.split("|");
  const latest = (fresh.results || [])[0];
  let body = "Ladder updated";
  if (prevRounds !== String((fresh.results || []).length) && latest) body = `Round ${latest.round} results are in`;
  else if (prevLoad === String(fresh.meta.ladder_loaded)) body = "Fixture updated";
  return pushNote(body, "gb1-update");
}

function bind() {
  const squadView = $("#view-squad");
  squadView.querySelectorAll(".seg button").forEach((b) => {
    b.onclick = () => {
      const r = nextRound().round;
      overrides[r] = overrides[r] || {};

      saveOverrides(overrides);
      renderAll();
    };
  });
  $("#view-season").querySelectorAll(".seg-top button").forEach((b) => {
    b.onclick = () => { seasonTab = b.dataset.season; $("#view-season").innerHTML = viewSeason(); bind(); };
  });
  const ih = $("#installBtnHome");
  if (ih) ih.onclick = runInstall;
  const gu = $("#goUnlock");
  if (gu) gu.onclick = () => openSettings();
  $("#view-squad").querySelectorAll(".whyr").forEach((b) => {
    b.onclick = () => openSheet(explainSheet(b.dataset.explain));
  });
  document.querySelectorAll(".pager").forEach((pager) => {
    if (pager.dataset.bound) return;
    pager.dataset.bound = "1";
    const track = pager.querySelector(".pages");
    const dots = pager.nextElementSibling;
    if (!track) return;
    const slides = [...track.children];
    let index = 0;
    const fit = () => {
      const slide = slides[index];
      if (!slide) return;
      const h = slide.getBoundingClientRect().height;
      if (h > 40) pager.style.height = h + "px";
    };
    const go = (i) => {
      index = Math.max(0, Math.min(slides.length - 1, i));
      track.style.transform = `translateX(${-index * 100}%)`;
      if (dots && dots.classList.contains("dots")) {
        dots.querySelectorAll("button").forEach((b, bi) => b.classList.toggle("on", bi === index));
      }
      fit();
    };
    if (dots && dots.classList.contains("dots")) {
      dots.querySelectorAll("button").forEach((b) => { b.onclick = () => go(Number(b.dataset.slide)); });
    }
    let sx = 0, sy = 0, live = false;
    pager.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      sx = t.clientX; sy = t.clientY; live = true;
    }, { passive: true });
    pager.addEventListener("touchend", (e) => {
      if (!live) return;
      live = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.2) go(index + (dx < 0 ? 1 : -1));
    }, { passive: true });
    window.addEventListener("resize", fit);
    requestAnimationFrame(() => { fit(); go(0); });
  });
  $("#view-pathway").querySelectorAll("[data-step]").forEach((b) => {
    b.onclick = () => {
      const id = b.dataset.step;
      const t = pathTicks();
      const next = t.includes(id) ? t.filter((x) => x !== id) : [...t, id];
      localStorage.setItem(PATH_TICKS, JSON.stringify(next));
      $("#view-pathway").innerHTML = viewPathway();
      bind();
    };
  });
  document.querySelectorAll("tr.clubrow").forEach((tr) => {
    tr.onclick = () => {
      const club = tr.dataset.club;
      if (openClubs.has(club)) openClubs.delete(club); else openClubs.add(club);
      $("#view-team").innerHTML = viewTeam();
      bind();
    };
  });
  document.querySelectorAll("tr.prow2").forEach((tr) => {
    tr.onclick = () => openSheet(playerSheet(tr.dataset.explain));
  });
  $("#view-team").querySelectorAll("[data-team]").forEach((b) => {
    b.onclick = () => { teamTab = b.dataset.team; $("#view-team").innerHTML = viewTeam(); bind(); };
  });
  const jc = $("#journeyCard");
  if (jc) jc.onclick = () => {
    const d = document.querySelector('.fold#fold-next');
    if (d) { d.open = true; d.scrollIntoView({ behavior: "smooth", block: "start" }); }
  };
  document.querySelectorAll("[data-enrol]").forEach((cb) => {
    cb.onchange = () => { toggleEntered(cb.dataset.enrol); renderAll(); showToast(cb.checked ? "Added to your journey" : "Removed"); };
  });
  document.querySelectorAll("[data-pass]").forEach((b) => {
    b.onclick = (ev) => { ev.stopPropagation(); passEvent(b.dataset.pass); renderAll(); showToast("Passed"); };
  });
  document.querySelectorAll("[data-result]").forEach((b) => {
    b.onclick = (ev) => { ev.stopPropagation(); addMatchSheet(b.dataset.result); };
  });
  document.querySelectorAll("details.fold").forEach((d) => {
    const body = d.querySelector(".fbody");
    if (!body) return;
    const sig = String(body.innerHTML.length) + "|" + body.innerHTML.slice(0, 60);
    let seen = null;
    try { seen = localStorage.getItem("em-gb1-seen-" + d.id); } catch (e) {}
    if (seen !== null && seen !== sig) d.classList.add("hasnew");
    if (seen === null) { try { localStorage.setItem("em-gb1-seen-" + d.id, sig); } catch (e) {} }
    d.addEventListener("toggle", () => {
      if (d.open) {
        d.classList.remove("hasnew");
        try { localStorage.setItem("em-gb1-seen-" + d.id, sig); } catch (e) {}
      }
    });
  });
  const hl = $("#helpLink");
  if (hl) hl.onclick = (ev) => {
    ev.preventDefault();
    openSettings();
    setTimeout(() => {
      const t = $("#helpSec");
      if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 220);
  };
  const addMatch = $("#addMatch");
  if (addMatch) addMatch.onclick = addMatchSheet;
  const foldNext = document.querySelector(".fold#fold-next");
  if (foldNext) foldNext.open = foldNext.open;

  $("#view-week").querySelectorAll(".blk[data-round]").forEach((b) => {
    const r = Number(b.dataset.round);
    b.onclick = () => {
      if (matchFor(r)) { openSheet(scorecardSheet(r)); return; }
      openSheet(upcomingSheet(r));
      bindRoundSheet(r);

  });
  $("#view-squad").querySelectorAll("tr[data-explain]").forEach((b) => {
    b.onclick = () => openSheet(explainSheet(b.dataset.explain));
  });
  $("#view-squad").querySelectorAll(".kid").forEach((b) => {
    b.onclick = () => {
      selectedPlayer = b.dataset.player;
      if (history.replaceState) history.replaceState(null, "", "#player=" + encodeURIComponent(selectedPlayer));
          bind();
      window.scrollTo({ top: 0, behavior: "smooth" });

  });
  const back = $("#backBtn");
  if (back) back.onclick = () => {
    selectedPlayer = null;
    if (history.replaceState) history.replaceState(null, "", "#squad");
    $("#view-squad").innerHTML = viewSquad();
    bind();
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
}

    if (!isNaN(v) && v > 0 && v <= 16) {
      TARGET_UTR = Math.round(v * 10) / 10;
      localStorage.setItem(TARGET_KEY, String(TARGET_UTR));
      closeSheet(); renderAll(); showToast(`Target ${TARGET_UTR.toFixed(1)} saved`);
    } else showToast("Enter a target between 0 and 16");
  };
  const lockNow = $("#lockNow");
  if (lockNow) lockNow.onclick = () => {
    localStorage.removeItem(UNLOCK_KEY);
    closeSheet();
    showTab("week");
    renderAll();
    showToast("Locked");
  };
  const utrSave = $("#utrSave");
  if (utrSave) utrSave.onclick = () => {
    const v = parseFloat(($("#utrInput") && $("#utrInput").value) || "");
    if (!isNaN(v) && v >= 0 && v <= 16) {
      MY_UTR = Math.round(v * 10) / 10;
      localStorage.setItem(UTR_KEY, String(MY_UTR));
      closeSheet(); renderAll(); showToast(`UTR ${MY_UTR.toFixed(1)} saved`);
    } else {
      showToast("Enter a number between 0 and 16");
    }
  };
  let taps = 0, tapTimer = null;
  const verLine = $("#verLine");
  if (verLine) verLine.onclick = () => {
    taps += 1;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { taps = 0; }, 1200);
    if (taps >= 5) {
      taps = 0;
      const slot = $("#codeSlot");
      if (slot && !$("#pwInput")) {
        slot.innerHTML = `<div class="addrow" style="margin-top:10px">
            <input id="pwInput" type="password" inputmode="numeric" autocomplete="off" placeholder="Code">
            <button class="btn" id="pwGo">Go</button></div>`;
        bindSheet();
      }
    }
  };
  const pwGo = $("#pwGo");
  if (pwGo) pwGo.onclick = () => {
    const v = ($("#pwInput") && $("#pwInput").value || "").trim();
    if (v === "1981") {
      localStorage.setItem(UNLOCK_KEY, "1");
      closeSheet();
      renderAll();
      revealTab("pathway");
      showToast("Pathway added to the tabs");
    } else {
      showToast("That is not the code");
    }
  };
  const ib = $("#installBtn");
  if (ib) ib.onclick = async () => {
    runInstall();
  };
  const tg = $("#alertsToggle");
  if (tg) tg.onchange = () => {
    if (tg.checked) enableAlerts();
    else { localStorage.setItem(NOTIFY_KEY, "0"); showToast("Alerts off"); }
  };
}

function bindRoundSheet(round) {
  const reopen = () => { openSheet(upcomingSheet(round)); bindRoundSheet(round); renderAll(); };
  $("#sheet").querySelectorAll("[data-out]").forEach((b) => {
    b.onclick = () => {
      roundEdits[round] = roundEdits[round] || { out: [], add: [] };
      roundEdits[round].out = [...new Set([...(roundEdits[round].out || []), b.dataset.out])];
      roundEdits[round].add = (roundEdits[round].add || []).filter((n) => n !== b.dataset.out);
      saveEdits(roundEdits);
      reopen();
    };
  });
  const addBtn = $("#addBtn");
  if (addBtn) addBtn.onclick = () => {
    const input = $("#addName");
    const typed = (input && input.value || "").trim();
    if (!typed) return;
    const name = matchName(typed);
    roundEdits[round] = roundEdits[round] || { out: [], add: [] };
    roundEdits[round].add = [...new Set([...(roundEdits[round].add || []), name])];
    roundEdits[round].out = (roundEdits[round].out || []).filter((n) => n !== name);
    saveEdits(roundEdits);
    reopen();
  };
  const reset = $("#resetRound");
  if (reset) reset.onclick = () => { delete roundEdits[round]; saveEdits(roundEdits); reopen(); };
}

function openSheet(html) {
  const ov = $("#overlay");
  if (!ov) return;
  $("#sheet").innerHTML = html;
  ov.classList.add("on");
  document.body.style.overflow = "hidden";
}
function closeSheet() {
  const ov = $("#overlay");
  if (!ov) return;
  ov.classList.remove("on");
  document.body.style.overflow = "";
}
document.addEventListener("click", (e) => {
  const t = e.target;
  if (t && t.dataset && t.dataset.close) closeSheet();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

function revealTab(name) {
  const btn = document.querySelector('.tabs button[data-view="' + name + '"]');
  const nav = document.querySelector("nav.tabs");
  if (!btn || !nav) return;
  nav.scrollTo({ left: nav.scrollWidth, behavior: "smooth" });
  btn.animate ? btn.animate([{ transform: "scale(.92)" }, { transform: "scale(1)" }], { duration: 320 }) : null;
}

function showTab(name) {
  const btn = document.querySelector('.tabs button[data-view="' + name + '"]');
  if (!btn) return;
  document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", "false"));
  btn.setAttribute("aria-selected", "true");
  document.querySelectorAll(".view").forEach((v) => v.classList.remove("on"));
  const view = $("#view-" + name);
  if (view) view.classList.add("on");
  try { btn.scrollIntoView({ block: "nearest", inline: "nearest" }); } catch (e) {}
}
document.querySelectorAll(".tabs button").forEach((b) => {
  b.onclick = () => {
    showTab(b.dataset.view);
    if (history.replaceState) history.replaceState(null, "", "#" + b.dataset.view);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
});

applyTheme(localStorage.getItem(THEME_KEY) || "hardcourt");
renderAll();
loadLive();
if (location.hash) {
  showTab(location.hash.slice(1));
}
initApp();

let refreshing = false;

async function refreshNow(opts) {
  const silent = opts && opts.silent;
  if (refreshing) return;
  refreshing = true;
  const btn = $("#refreshBtn");
  if (btn && !silent) btn.classList.add("spin");

  let outcome = null;
  try {
    const res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const fresh = await res.json();
    const changed = sigOf(fresh) !== sigOf(DATA);
    const first = !localStorage.getItem(SIG_KEY);
    if (changed && !first) {
      noteUpdate(fresh);
      Object.assign(DATA, fresh);
      if (fresh.roster) Object.assign(roster, fresh.roster);
      deriveTotals();
      renderAll();
      outcome = "Updated from TROLS";
    } else {
      outcome = first ? null : "Already up to date";
    }
    localStorage.setItem(SIG_KEY, sigOf(fresh));
  } catch (e) {
    outcome = navigator.onLine === false ? "Offline — showing saved data" : "Couldn't reach TROLS";
  } finally {
    refreshing = false;
    if (btn) btn.classList.remove("spin");
    if (outcome && !silent) showToast(outcome);
  }
}

const refreshBtn = $("#refreshBtn");
if (refreshBtn) refreshBtn.onclick = () => refreshNow();
const settingsBtn = $("#settingsBtn");
if (settingsBtn) settingsBtn.onclick = () => openSettings();

refreshNow({ silent: true });
loadEvents();
setTimeout(maybeRemind, 2500);
</script>
